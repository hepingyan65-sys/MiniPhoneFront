// ---- 消息时间：像微信一样，隔了 5 分钟以上才插一行时间（用手机本地时间） ----
const TIME_GAP = 5 * 60 * 1000;
const WEEKDAY_NAMES = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
let lastShownTs = 0; // 上一条显示出来的消息的时间

function formatMsgTime(ts){
  const d = new Date(ts), now = new Date();
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const DAY = 24 * 60 * 60 * 1000;
  if(ts >= startOfToday) return hm;
  if(ts >= startOfToday - DAY) return '昨天 ' + hm;
  if(ts >= startOfToday - 6 * DAY) return WEEKDAY_NAMES[d.getDay()] + ' ' + hm;
  const md = (d.getMonth() + 1) + '月' + d.getDate() + '日 ';
  if(d.getFullYear() === now.getFullYear()) return md + hm;
  return d.getFullYear() + '年' + md + hm;
}

function maybeTimeDivider(ts){
  if(!ts) return;
  if(ts - lastShownTs >= TIME_GAP){
    const note = addNote(formatMsgTime(ts));
    note.classList.add('time-note');
  }
  lastShownTs = ts;
}

// 以前有几条消息里夹着后端的时间标记（"[你那边 11月5日 …]"），手机里存的副本还留着，显示时擦掉
const cleanStamps = (t) => String(t || '').replace(/\s*\[(?:她|你)那边[^\]]*\]\s*/g, '\n\n').replace(/\n{3,}/g, '\n\n').trim();
// 动作描写：他们消息里（…）的部分拆出来，单独显示在气泡上方；她自己的消息不拆
let showActions = localStorage.getItem('mp_show_actions') !== '0'; // 默认显示
function splitAction(t){
  const acts = [];
  const speech = String(t || '')
    .replace(/（[^）]*）|\([^)]*\)/g, (x) => { acts.push(x); return ''; })
    .replace(/[ \t]{2,}/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  return { action: acts.join(' '), speech };
}
function bubbleForMessage(m){
  if(m.photo){ // 照片单独一条，不拆动作
    maybeTimeDivider(m.ts);
    addBubble(paintInto || chatEl, m.role, '', null, { id: m.id, replyTo: m.replyTo, speaker: m.speaker, photo: m.photo, reactions: m.reactions });
    return;
  }
  if(m.voice){ // 语音单独一条，不拆动作
    maybeTimeDivider(m.ts);
    addBubble(paintInto || chatEl, m.role, '', null, { id: m.id, replyTo: m.replyTo, speaker: m.speaker, voice: m.voice, reactions: m.reactions });
    return;
  }
  const thumb = thumbs[m.ts];
  let text = m.role === 'user' ? m.text : cleanStamps(m.text);
  let action = '';
  if(m.role !== 'user'){ const s = splitAction(text); text = s.speech; action = showActions ? s.action : ''; }
  if(!text && !action && !m.hadImage && !thumb) return; // 只有动作、又关掉了显示：这条就不出现
  maybeTimeDivider(m.ts);
  text = text || (m.hadImage && !thumb ? '[图片]' : '');
  addBubble(paintInto || chatEl, m.role, text, thumb, { id: m.id, replyTo: m.replyTo, speaker: m.speaker, action, reactions: m.reactions });
}

// 聊天记录很长时，一次全画出来要好几秒（点联系人会愣住）。所以先只画最近的 CHAT_PAGE 条，
// 往上翻到顶附近再一批批接上更早的（CHAT_MORE 条）
const CHAT_PAGE = 60, CHAT_MORE = 40;
let firstShownId = null; // 现在画出来的最早那条；换对话时清空
let bulkPaint = false;   // 一次画很多条时：不每条都滚到底（每滚一次浏览器就要重新排版一遍）、不播入场动画
let paintInto = null;    // 往上补消息时先画进这个临时容器，再整块插到最前面
function renderChat(){
  chatEl.innerHTML = '';
  emptyNote = null;
  lastShownTs = 0;
  if(!currentConv) return;
  const h = historyOf(currentConv);
  if(h.length === 0){
    firstShownId = null;
    emptyNote = addNote(isGroup(currentConv) ? '群里还没有消息，等他们聊起来吧' : '还没有消息，跟' + contactName(currentConv) + '说点什么吧');
    return;
  }
  let start = firstShownId ? h.findIndex(m => m.id === firstShownId) : -1;
  if(start < 0) start = Math.max(0, h.length - CHAT_PAGE);
  firstShownId = h[start].id;
  if(start > 0) lastShownTs = h[start - 1].ts || 0; // 时间分隔线和一口气全画时一样
  bulkPaint = true;
  try{ h.slice(start).forEach(bubbleForMessage); }
  finally{ bulkPaint = false; }
  chatEl.scrollTop = chatEl.scrollHeight;
}
// 往上翻到顶附近：把更早的一批画出来插到最前面，并保持你正在看的那条不动
let loadingOlder = false;
function loadOlder(){
  if(loadingOlder || !currentConv || !firstShownId) return;
  const h = historyOf(currentConv);
  const start = h.findIndex(m => m.id === firstShownId);
  if(start <= 0) return;
  loadingOlder = true;
  const from = Math.max(0, start - CHAT_MORE);
  const keepTs = lastShownTs;
  const box = document.createElement('div');
  lastShownTs = from > 0 ? (h[from - 1].ts || 0) : 0;
  paintInto = box; bulkPaint = true;
  try{ h.slice(from, start).forEach(bubbleForMessage); }
  finally{ paintInto = null; bulkPaint = false; lastShownTs = keepTs; }
  const fromBottom = chatEl.scrollHeight - chatEl.scrollTop;
  const frag = document.createDocumentFragment();
  while(box.firstChild) frag.appendChild(box.firstChild);
  chatEl.insertBefore(frag, chatEl.firstChild);
  chatEl.scrollTop = chatEl.scrollHeight - fromBottom;
  firstShownId = h[from].id;
  loadingOlder = false;
}
let jumpingUntil = 0; // 点「↑ N 条新消息」平滑滚过去的那一会儿，先不自动接更早的消息（会把滚动打断）
chatEl.addEventListener('scroll', () => { if(chatEl.scrollTop < 300 && Date.now() > jumpingUntil) loadOlder(); }, { passive: true });

// 「↑ N 条新消息」：点进聊天时，新消息多到第一条不在屏幕里，就在右上角给一个小胶囊，点一下跳过去
const unreadPill = document.getElementById('unreadPill');
const unreadPillText = document.getElementById('unreadPillText');
let pillTarget = null; // 第一条新消息的 id
const rowOf = (id) => chatEl.querySelector('.row[data-id="' + id + '"]');
function hideUnreadPill(){ pillTarget = null; unreadPill.classList.remove('show'); }
function showUnreadPill(cid, prevRead){
  hideUnreadPill();
  const unread = historyOf(cid).filter(m => m.role !== 'user' && m.ts > prevRead);
  if(!unread.length) return;
  // 第一条新消息：还没画出来的（比画出来的最早那条还早）照样算；画到了却不显示的（只有动作、关了动作描写）跳过
  const h = historyOf(cid);
  const shownFrom = Math.max(0, h.findIndex(m => m.id === firstShownId));
  const first = unread.find(m => h.indexOf(m) < shownFrom || rowOf(m.id));
  if(!first) return;
  const el = rowOf(first.id);
  if(el && el.getBoundingClientRect().top >= chatEl.getBoundingClientRect().top) return; // 一屏看得全：不用提示
  pillTarget = first.id;
  unreadPillText.textContent = (unread.length > 99 ? '99+' : unread.length) + ' 条新消息';
  unreadPill.style.top = (chatEl.offsetTop + 10) + 'px';
  unreadPill.classList.add('show');
}
unreadPill.addEventListener('click', () => {
  if(!pillTarget || !currentConv) return hideUnreadPill();
  const h = historyOf(currentConv);
  const i = h.findIndex(m => m.id === pillTarget);
  if(i < 0) return hideUnreadPill();
  if(!rowOf(pillTarget)){ firstShownId = h[Math.max(0, i - 12)].id; renderChat(); } // 太早了还没画出来：先补画到那里（多带一些上文）
  const el = rowOf(pillTarget);
  hideUnreadPill();
  if(!el) return;
  jumpingUntil = Date.now() + 1000;
  const goal = chatEl.scrollTop + el.getBoundingClientRect().top - chatEl.getBoundingClientRect().top - 12;
  // 离得很远：先瞬间跳到目标下面一屏的地方，再平滑滚完最后这一屏（不然一路刷过上百条，又慢又晕）
  if(chatEl.scrollTop - goal > chatEl.clientHeight * 1.5) chatEl.scrollTop = goal + chatEl.clientHeight;
  chatEl.scrollTo({ top: goal, behavior: 'smooth' });
  const b = el.querySelector('.bubble');
  if(b){ b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 1400); }
});
// 自己往上翻、第一条新消息露出来了：胶囊收起
chatEl.addEventListener('scroll', () => {
  if(!pillTarget) return;
  const el = rowOf(pillTarget);
  if(el && el.getBoundingClientRect().top >= chatEl.getBoundingClientRect().top) hideUnreadPill();
}, { passive: true });
let emptyNote = null;

// 去后端拉某个对话的新消息
const syncing = {}, lastSyncAt = {};
let sendingConv = null; // 正在发消息的对话（发的时候先不拉这个对话，免得重复）
const syncedOnce = {}; // 打开 App 后，每个对话是不是已经拉过一次了
async function syncMessages(cid){
  if(!backendUrl || !canChat(cid) || syncing[cid] || sendingConv === cid) return;
  syncing[cid] = true;
  lastSyncAt[cid] = Date.now();
  try{
    const h = historyOf(cid);
    const after = h.length ? h[h.length - 1].ts : 0;
    const data = await api('/messages?conv=' + encodeURIComponent(cid) + '&after=' + after, { timeout: 30000 });
    updateStatus(cid, data.status);
    let added = false, edited = false, reacted = false;
    const fresh = [];
    // 后端删掉的消息：手机里的副本也删掉
    const removed = Array.isArray(data.removed) ? data.removed : [];
    for(let i = h.length - 1; i >= 0; i--){
      if(removed.includes(h[i].id)){ h.splice(i, 1); edited = true; }
    }
    (data.messages || []).forEach(m => {
      const old = h.find(x => x.id === m.id);
      if(old){
        // 后端改过的旧消息：把手机里这条也换成新的
        if(old.text !== m.text){ old.text = m.text; edited = true; }
        if(m.photo && !old.photo){ old.photo = m.photo; edited = true; }
        if(m.voice && !old.voice){ old.voice = m.voice; edited = true; }
        // 表情变了：只换掉那一排，不重画整个聊天
        if(JSON.stringify(old.reactions || []) !== JSON.stringify(m.reactions || [])){
          old.reactions = m.reactions;
          reacted = true;
          if(cid === currentConv) updateReacts(old);
        }
        return;
      }
      h.push(m);
      if(m.role !== 'user') fresh.push(m);
      if(cid === currentConv){
        if(emptyNote){ emptyNote.remove(); emptyNote = null; }
        bubbleForMessage(m);
      }
      added = true;
    });
    if(edited && !added){ save.history(cid); if(cid === currentConv) renderChat(); renderContacts(); }
    else if(edited && cid === currentConv) renderChat();
    if(reacted && !added && !edited) save.history(cid);
    if(added){
      save.history(cid);
      if(isViewing(cid)) markRead(cid);
      renderContacts();
    }
    // 小弹窗：打开 App 后的第一次拉取不弹（离开期间的消息推送已经告诉过她了）；群聊不弹；正在看这个聊天不弹
    if(syncedOnce[cid] && fresh.length && !isGroup(cid) && !isViewing(cid) && document.visibilityState === 'visible') showToast(cid, fresh[fresh.length - 1], fresh.length);
    syncedOnce[cid] = true;
  }catch(e){ /* 拉不到就下次再拉 */ }
  syncing[cid] = false;
}

async function sendChat(){
  const text = input.value.trim();
  const image = selectedImage;
  if(!text && !image) return;
  if(!backendUrl){ alert('先去"设置"填后端地址'); return; }
  const cid = currentConv;
  if(!cid) return;
  const replyTo = replyingTo;
  input.value = '';
  selectedImage = null;
  imagePreviewBar.style.display = 'none';
  cancelReply();
  sendBtn.disabled = true;
  sendingConv = cid;

  if(emptyNote){ emptyNote.remove(); emptyNote = null; }
  maybeTimeDivider(Date.now());
  const bubble = addBubble(chatEl, 'user', text, image ? image.thumb : null, { replyTo });
  try{
    const data = await api('/send', { method: 'POST', body: { conv: cid, text, image: image ? image.full : null, replyTo }, timeout: 90000 });
    const m = data.message;
    bubble.dataset.id = m.id; // 发出去拿到编号以后，这条也能被长按引用了
    historyOf(cid).push(m);

    markRead(cid);

  }catch(e){
    if(cid === currentConv) addNote('这条没发出去：' + e.message);
    else alert('发给' + contactName(cid) + '的那条没发出去：' + e.message);
  }finally{
    sendingConv = null;
    sendBtn.disabled = false;
  }
}

  if(d < 86400000) return Math.floor(d / 3600000) + '小时前';

  return (t.getMonth() + 1) + '月' + t.getDate() + '日 ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');

/* ---------- 通知 ---------- */
const notifyStatus = document.getElementById('notifyStatus');
const enableNotifyBtn = document.getElementById('enableNotifyBtn');
let swRegistration = null;

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function checkNotifyStatus(){
  if(!('Notification' in window)){
    notifyStatus.textContent = '这个浏览器不支持通知';
    enableNotifyBtn.disabled = true;
    return;
  }
  if(Notification.permission === 'granted' && swRegistration){
    const sub = await swRegistration.pushManager.getSubscription();
    notifyStatus.textContent = sub ? '已开启 ✅' : '权限已给，但还没订阅，点一下按钮';
  } else if(Notification.permission === 'denied'){
    notifyStatus.textContent = '被拒绝了，需要去手机系统设置里手动打开通知权限';
  } else {
    notifyStatus.textContent = '还没开启';
  }
}

async function enableNotify(){
  if(!backendUrl){ alert('先在上面填好后端地址'); return; }
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    alert('这个浏览器/系统版本不支持推送通知（iOS 需要 16.4 及以上，并且是从主屏幕图标打开的"小手机"，不是 Safari 标签页里打开的）');
    return;
  }
  // iOS 第一次加载 Service Worker 时页面还没被它接管，刷新一次就好
  if(!navigator.serviceWorker.controller){
    notifyStatus.textContent = '第一次需要刷新一下，马上自动刷新…';
    location.reload();
    return;
  }
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){
      notifyStatus.textContent = '你没有允许通知权限';
      return;
    }
    if(!swRegistration) swRegistration = await navigator.serviceWorker.ready;
    const { publicKey } = await api('/vapid-public-key');
    let sub = await swRegistration.pushManager.getSubscription();
    if(!sub){
      sub = await swRegistration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });
    }
    await api('/subscribe', { method: 'POST', body: { subscription: sub } });
    notifyStatus.textContent = '已开启 ✅';
  }catch(e){
    notifyStatus.textContent = '开启失败：' + e.message;
  }
}
enableNotifyBtn.addEventListener('click', enableNotify);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg => { swRegistration = reg; checkNotifyStatus(); }).catch(()=>{});
}

function legacyText(m){
  if(m.displayText !== undefined) return m.displayText;
  if(Array.isArray(m.content)) return m.content.filter(c => c.type === 'text').map(c => c.text).join(' ');
  return m.content || '';
}
async function migrateLegacyIfNeeded(){
  if(localStorage.getItem('mp_migrated_v2')) return;
  const legacy = JSON.parse(localStorage.getItem('mp_history') || '[]');
  if(!legacy.length){ localStorage.setItem('mp_migrated_v2', '1'); return; }
  let lastTs = 0;
  const items = legacy.map(m => {
    const ts = Math.max(Number(m.ts) || 0, lastTs + 1); lastTs = ts;
    if(m.displayImage) thumbs[ts] = m.displayImage;
    return { role: m.role, text: legacyText(m), hadImage: !!m.displayImage, ts };
  });
  await api('/import', { method: 'POST', body: { history: items, memories }, timeout: 90000 });
  save.thumbs();
  localStorage.setItem('mp_migrated_v2', '1');
}

/* ---------- 封面（启动页） ---------- */
// 封面盖在 FromAlis 上面：进去时封面朝他放大、淡出；回来时封面淡回来。FromAlis 一直在下面跑着（轮询、未读照常）
const startEl = document.getElementById('start');
let startAnim = null;
function enterAlis(animate){
  if(startEl.classList.contains('gone')){ leaveWb(); if(currentConv && isViewing(currentConv)){ markRead(currentConv); renderContacts(); } return; } // 已经不在封面（比如在工作台里点了推送）：直接回到 FromAlis
  if(startAnim){ startAnim.cancel(); startAnim = null; }
  const done = () => { startEl.classList.add('gone'); startAnim = null; leaveWb(); placeLamp(false); if(currentConv && isViewing(currentConv)){ markRead(currentConv); renderContacts(); } }; // 回到正开着的聊天：这时才算看到
  if(animate === false || !startEl.animate || (reduceMotion && reduceMotion.matches)) return done();
  startEl.style.transformOrigin = '30% 38%'; // 朝窗边的他推进去
  startAnim = startEl.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(1.14)' }],
    { duration: 520, easing: 'cubic-bezier(.45,0,.25,1)' });
  startAnim.onfinish = done;
}
function showStart(){
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); // 收起键盘
  if(startAnim){ startAnim.cancel(); startAnim = null; }
  startEl.classList.remove('gone');
  if(!startEl.animate || (reduceMotion && reduceMotion.matches)) return;
  startEl.style.transformOrigin = '50% 50%';
  startAnim = startEl.animate([{ opacity: 0, transform: 'scale(1.06)' }, { opacity: 1, transform: 'scale(1)' }],
    { duration: 420, easing: 'cubic-bezier(.2,.8,.3,1)' });
  startAnim.onfinish = () => { startAnim = null; };
}
// 点入口：从那根细线上"哗啦"散出一小把光点，往上飘、慢慢熄掉
function sparkle(spot){
  if(!startEl.animate || (reduceMotion && reduceMotion.matches)) return;
  const box = startEl.getBoundingClientRect(), r = spot.querySelector('.rule').getBoundingClientRect();
  for(let i = 0; i < 24; i++){
    const d = document.createElement('span'); d.className = 'spark';
    const x = r.left - box.left + Math.random() * r.width, y = r.top - box.top;
    d.style.left = x + 'px'; d.style.top = y + 'px';
    startEl.appendChild(d);
    const dx = (Math.random() - .5) * 70, dy = -(12 + Math.random() * 46), s = .5 + Math.random() * .8;
    d.animate([
      { transform: 'translate(0,0) scale(' + s + ')', opacity: 0 },
      { transform: 'translate(' + dx * .3 + 'px,' + dy * .3 + 'px) scale(' + s + ')', opacity: 1, offset: .15 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(0.2)', opacity: 0 }
    ], { duration: 650 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)', delay: Math.random() * 90 }).onfinish = () => d.remove();
  }
}
document.getElementById('spotAlis').addEventListener('click', e => {

/* ---------- App 里的小弹窗 ---------- */
// 在工作台、封面、或者 FromAlis 的别的页面时，有人（私聊）发来消息：雾玻璃小卡片从顶上滑下来
// 好几条一起来就叠成一张（显示最新那条和一共几条）；点一下进他的聊天，往上一划收起，4.5 秒后自己缩回去
const toastEl = document.getElementById('toast');
let toastCid = null, toastCount = 0, toastTimer = null, toastDrag = null;
function showToast(cid, m, n){

  toastEl.classList.add('show');

function armToast(){ clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 4500); }
function hideToast(){ clearTimeout(toastTimer); toastEl.classList.remove('show', 'dragging'); toastEl.style.transform = ''; toastCount = 0; }
// 点一下：从哪儿都直接进他的聊天
function openFromToast(){

// 往上一划收起；手指按着的时候不自己缩回去
toastEl.addEventListener('touchstart', e => { toastDrag = { y: e.touches[0].clientY, dy: 0 }; clearTimeout(toastTimer); toastEl.classList.add('dragging'); }, { passive: true });
toastEl.addEventListener('touchmove', e => {
  if(!toastDrag) return;
  toastDrag.dy = e.touches[0].clientY - toastDrag.y;
  toastEl.style.transform = 'translateY(' + (toastDrag.dy < 0 ? toastDrag.dy : toastDrag.dy * .25) + 'px)'; // 往下拉只跟一点点
}, { passive: true });
toastEl.addEventListener('touchend', () => {
  if(!toastDrag) return;
  const dy = toastDrag.dy; toastDrag = null;
  toastEl.classList.remove('dragging');

/* ---------- 工作台（Workbench） ---------- */
// 数据的"正本"在后端（workbench.js），手机只存一份副本 mp_wb；读写都要带钥匙（mp_wb_key，和后端的 WORKBENCH_KEY 一样）
// 时间都按 Jes 这边（日本）写："2026-11-28" 是全天，"2026-11-28T14:00" 带几点
const WB_NAME = { jes: 'Jes', claude: 'Claude', muse: 'Muse' };
const WB_PRI = { high: '高', mid: '中', low: '低' };
const wbEl = id => document.getElementById(id);
let wbKey = localStorage.getItem('mp_wb_key') || '';
let wb = (() => { try{ return JSON.parse(localStorage.getItem('mp_wb')) || null; }catch(_){ return null; } })() || { tasks: [], letters: [], roles: {} };
let wbLocked = !wbKey;   // 没钥匙、或者钥匙不对：纸上锁着
let wbPageId = null;     // 正在看哪一页（'new' = 正在写一件新的事）
let wbNewParent = '';    // 新写的这件事挂在哪个长线下面
let wbPoll = null;
const wbSaveLocal = () => { try{ localStorage.setItem('mp_wb', JSON.stringify(wb)); }catch(_){} };
const wbEsc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function wbApi(path, body){
  if(!backendUrl) throw new Error('先在 FromAlis 的「设置」里填后端地址');
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 60000);
  try{
    const res = await fetch(backendUrl.replace(/\/$/, '') + path, {
      method: body ? 'POST' : 'GET',
      headers: Object.assign({ 'x-workbench-key': wbKey }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined,
      signal: controller.signal
    });
    let data;
    try{ data = await res.json(); }catch(_){ throw new Error('后端返回了看不懂的内容（状态码 ' + res.status + '）'); }
    if(res.status === 401){ wbLocked = true; wbRender(); }
    if(!res.ok) throw new Error(data.error || '请求失败');
    return data;
  }catch(e){
    if(e.name === 'AbortError') throw new Error('后端太久没回应，可能刚睡醒，等一下再试');
    throw e;
  }finally{ clearTimeout(timer); }
}
function wbFlash(msg){ const el = wbEl('wbSync'); el.textContent = msg; clearTimeout(wbFlash.t); wbFlash.t = setTimeout(() => { el.textContent = ''; }, 2600); }

async function wbSync(){
  if(wbLocked) return wbRender();
  try{
    wb = await wbApi('/wb'); wbSaveLocal();
    wbRender();
    if(wbPageId && wbPageId !== 'new' && !wbPageBusy()) wbRenderPage();
  }catch(e){ if(!wbLocked) wbFlash('没连上'); }
}
// 正在这一页上打字、改东西时，不拿新数据把它重画掉
const wbPageBusy = () => { const a = document.activeElement; return !!a && wbEl('wbPage').contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };

/* ---- 日期 ---- */
const wbDate = v => (v || '').slice(0, 10);
const wbClock = v => (v || '').slice(11, 16);
function wbDay(v){
  if(!v) return '';
  const [y, m, d] = wbDate(v).split('-').map(Number);
  const md = m + '/' + String(d).padStart(2, '0');
  return y === new Date().getFullYear() ? md : (y + '/' + md);
}
function wbSpan(t){ // 跨了几天
  if(!t.start || !t.end) return 0;
  return Math.round((new Date(wbDate(t.end)) - new Date(wbDate(t.start))) / 86400000);
}
const wbChildren = id => wb.tasks.filter(t => t.parent === id);
const wbIsLong = t => !t.parent && (wbChildren(t.id).length > 0 || wbSpan(t) >= 3); // 长线：下面挂着小事，或者跨三天以上
const wbByStart = (a, b) => (a.start || '9999') < (b.start || '9999') ? -1 : (a.start || '9999') > (b.start || '9999') ? 1 : a.createdAt - b.createdAt;
function wbMeta(t, withGroup){
  const bits = [];
  const c = wbClock(t.start);
  if(t.end){ bits.push((c ? c + ' ' : '') + '→ ' + wbDay(t.end) + (wbClock(t.end) ? ' ' + wbClock(t.end) : '')); }
  else if(t.start) bits.push(c || '全天');
  if(t.category) bits.push(wbEsc(t.category));
  if(t.priority) bits.push(t.priority === 'high' ? '<b>高</b>' : WB_PRI[t.priority]);
  return bits.join(' · ');
}

/* ---- 按天分开：过期了 / 今天 / 明天 / 这周 / 以后 / 没写日期（日本时间） ---- */
let wbDays = false;
try{ wbDays = localStorage.getItem('mp_wb_days') === '1'; }catch(_){}
const WB_WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
function wbJpToday(){ // 日本今天的日期，'2026-11-23'
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
function wbAddDays(d, n){ const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function wbGroupByDay(items){
  const today = wbJpToday(), tomorrow = wbAddDays(today, 1);
  const wd = new Date(today + 'T00:00:00Z').getUTCDay();          // 0 = 周日
  const sunday = wbAddDays(today, wd === 0 ? 0 : 7 - wd);           // 这周到周日为止
  const label = (name, d) => name + ' · ' + wbDay(d) + ' ' + WB_WEEK[new Date(d + 'T00:00:00Z').getUTCDay()];
  const g = {
    late: { label: '过期了', cls: 'late', list: [] },
    today: { label: label('今天', today), cls: 'today', list: [] },
    tomorrow: { label: label('明天', tomorrow), cls: '', list: [] },
    week: { label: '这周', cls: '', list: [] },
    later: { label: '以后', cls: '', list: [] },
    none: { label: '没写日期', cls: '', list: [] }
  };
  items.forEach(t => {
    const s = wbDate(t.start), e = wbDate(t.end);
    if(!s) return g.none.list.push(t);
    if(s < today) return (e && e >= today ? g.today : g.late).list.push(t); // 跨到今天的还算今天
    if(s === today) return g.today.list.push(t);
    if(s === tomorrow) return g.tomorrow.list.push(t);
    if(s <= sunday) return g.week.list.push(t);
    g.later.list.push(t);
  });
  return Object.values(g).filter(x => x.list.length);
}
wbEl('wbDaysBtn').classList.toggle('on', wbDays);
wbEl('wbDaysBtn').addEventListener('click', () => {
  wbDays = !wbDays;
  try{ localStorage.setItem('mp_wb_days', wbDays ? '1' : '0'); }catch(_){}
  wbEl('wbDaysBtn').classList.toggle('on', wbDays);
  wbRender();
});

/* ---- 正面：手头的事 ---- */
function wbTaskRow(t, opts = {}){
  const div = document.createElement('div');
  div.className = 'wb-task' + (t.status === 'hold' ? ' hold' : '');
  const p = t.parent && wb.tasks.find(x => x.id === t.parent);
  div.innerHTML = (opts.noDate ? '' : '<span class="date">' + wbDay(t.start) + '</span>') +
    '<div class="row">' + (t.status === 'hold' ? '' : '<button class="wb-box' + (t.status === 'done' ? ' on' : '') + '" aria-label="做完了"><i></i></button>') +
    '<button class="main"><div class="title">' + wbEsc(t.title) + (p && !opts.noGroup ? '<span class="grp">· ' + wbEsc(p.title) + '</span>' : '') + '</div>' +
    (wbMeta(t) ? '<div class="meta">' + wbMeta(t) + '</div>' : '') + '</button></div>';
  div.querySelector('.main').addEventListener('click', () => wbOpenPage(t.id));
  const box = div.querySelector('.wb-box');
  if(box) box.addEventListener('click', () => wbToggleDone(t, div, box));
  return div;
}
async function wbToggleDone(t, div, box){
  const done = t.status !== 'done';
  box.classList.toggle('on', done);
  if(done && !wbEl('wbPage').contains(div)) div.classList.add('leaving'); // 正面：划掉、慢慢淡掉，收进归档
  try{
    await wbSaveTask(t.id, { status: done ? 'done' : 'todo' });
    setTimeout(() => { wbRender(); if(wbPageId) wbRenderPage(); }, done ? 850 : 0);
  }catch(e){ div.classList.remove('leaving'); box.classList.toggle('on', !done); wbFlash(e.message); }
}

function wbRender(){
  const front = wbEl('wbFront'), back = wbEl('wbBack');
  wbEl('wbRolesBtn').classList.toggle('gone', wbLocked);
  wbEl('wbDaysBtn').classList.toggle('gone', wbLocked);
  wbEl('wbFlip').classList.toggle('gone', wbLocked);
  if(wbLocked){
    front.innerHTML = '<div class="wb-head"><h1>Locked</h1><span class="sub">这张纸上了锁</span></div>' +
      '<div class="wb-lock">写下工作台的钥匙（就是在 Render 里设的 WORKBENCH_KEY）。只要写一次，这台手机会记住。' +
      '<input type="password" id="wbKeyIn" autocomplete="off" placeholder="钥匙"><button id="wbKeyGo">打开 ›</button><div class="wb-err" id="wbKeyErr"></div></div>';
    const go = async () => {
      const v = wbEl('wbKeyIn').value.trim(); if(!v) return;
      wbKey = v; wbLocked = false; wbEl('wbKeyErr').textContent = '';
      try{ wb = await wbApi('/wb'); localStorage.setItem('mp_wb_key', v); wbSaveLocal(); wbRender(); }
      catch(e){ wbLocked = true; wbRender(); wbEl('wbKeyErr').textContent = e.message; }
    };
    wbEl('wbKeyGo').addEventListener('click', go);
    wbEl('wbKeyIn').addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
    back.innerHTML = '';
    return;
  }
  front.innerHTML = '<div class="wb-head"><h1>On my desk</h1><span class="sub">手头的事</span></div>';
  const live = wb.tasks.filter(t => t.status === 'todo');
  const longs = live.filter(wbIsLong).sort(wbByStart);
  const items = live.filter(t => !wbIsLong(t)).sort(wbByStart);
  const holds = wb.tasks.filter(t => t.status === 'hold').sort(wbByStart);
  if(longs.length){
    front.insertAdjacentHTML('beforeend', '<div class="wb-band">长线</div>');
    longs.forEach(t => {
      const b = document.createElement('button'); b.className = 'wb-long';
      b.innerHTML = wbEsc(t.title) + '<span class="r">' + (t.start ? wbDay(t.start) + (t.end ? ' – ' + wbDay(t.end) : '') : '') + '</span>';
      b.addEventListener('click', () => wbOpenPage(t.id));
      front.appendChild(b);
    });
    front.insertAdjacentHTML('beforeend', '<div class="wb-gap"></div>');
  }
  if(wbDays){
    const groups = wbGroupByDay(items);
    groups.forEach(g => {
      front.insertAdjacentHTML('beforeend', '<div class="wb-day ' + g.cls + '">' + g.label + '</div>');
      g.list.forEach(t => { const row = wbTaskRow(t); if(g.cls) row.classList.add(g.cls); front.appendChild(row); });
    });
  }else items.forEach(t => front.appendChild(wbTaskRow(t)));
  if(!live.length && !holds.length) front.insertAdjacentHTML('beforeend', '<div class="wb-empty">纸上还空着。</div>');
  const add = document.createElement('button'); add.className = 'wb-add'; add.textContent = '+ 写一件事';
  add.addEventListener('click', () => { wbNewParent = ''; wbOpenPage('new'); });
  front.appendChild(add);
  if(holds.length){
    front.insertAdjacentHTML('beforeend', '<div class="wb-band" style="margin-top:18px">搁置</div>');
    holds.forEach(t => front.appendChild(wbTaskRow(t)));
  }
  // 背面：信
  back.innerHTML = '<div class="wb-head"><h1>Letters</h1><span class="sub">往来</span></div>' +
    (wb.letters.length ? '' : '<div class="wb-empty">还没有人写信。</div>') +
    wb.letters.map(l => '<div class="wb-letter">' + wbParas(l.text) + '<div class="sig"><span class="wb-who ' + l.by + '">— ' + (WB_NAME[l.by] || l.by) + '</span><span class="wb-ts">' + wbStamp(l.ts) + '</span></div></div>').join('');
  if(wbEl('wbCard') && !wbEl('wbCard').classList.contains('gone')) wbRenderCard();
}
function wbStamp(ts){ const d = new Date(ts); return (d.getMonth() + 1) + '/' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

async function wbSaveTask(id, patch){
  const t = await wbApi('/wb/task/' + id, patch);
  wb.tasks = wb.tasks.map(x => x.id === id ? t : x); wbSaveLocal();
  return t;
}

/* ---- 一件事的那一页 ---- */
function wbOpenPage(id){
  wbPageId = id;
  const page = wbEl('wbPage');
  wbRenderPage();
  page.classList.remove('gone');
  if(page.animate && !(reduceMotion && reduceMotion.matches)) page.animate([{ transform: 'translateY(40px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 320, easing: 'cubic-bezier(.2,.8,.3,1)' });
  if(id === 'new') setTimeout(() => wbEl('wbTitleIn') && wbEl('wbTitleIn').focus(), 60);
}
function wbClosePage(){
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); // 先把正在改的存掉
  const page = wbEl('wbPage');
  const done = () => { page.classList.add('gone'); wbPageId = null; wbRender(); };
  if(!page.animate || (reduceMotion && reduceMotion.matches)) return done();
  page.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateY(40px)', opacity: 0 }], { duration: 240, easing: 'cubic-bezier(.4,0,.6,1)' }).onfinish = done;
}

function wbRenderPage(){
  const box = wbEl('wbPageIn');
  const isNew = wbPageId === 'new';
  const t = isNew ? { title: '', status: 'todo', start: '', end: '', category: '', priority: '', remind: '', claude: '', muse: '', parent: wbNewParent, body: [] } : wb.tasks.find(x => x.id === wbPageId);
  if(!t){ wbClosePage(); return; }
  const kids = isNew ? [] : wbChildren(t.id).sort(wbByStart);
  const canParent = !kids.length; // 自己下面挂着小事的，不能再挂到别处
  const parents = wb.tasks.filter(x => !x.parent && x.id !== t.id && x.status !== 'done');
  const opt = (field, val, label, hi) => '<button class="wbp-opt' + (t[field] === val ? ' on' : '') + (hi ? ' hi' : '') + '" data-f="' + field + '" data-v="' + val + '">' + label + '</button>';
  const when = (field, label) => '<div class="wbp-prop"><span class="k">' + label + '</span><span class="v wbp-when">' +
    '<input type="date" data-w="' + field + '" data-part="d" value="' + wbDate(t[field]) + '" class="' + (t[field] ? '' : 'empty') + '">' +
    '<input type="time" data-w="' + field + '" data-part="t" value="' + wbClock(t[field]) + '" class="' + (wbClock(t[field]) ? '' : 'empty') + '"' + (t[field] ? '' : ' disabled') + '></span></div>';
  const text = (field, label, ph, who) => '<div class="wbp-prop"><span class="k">' + label + '</span><span class="v">' + (who ? '<span class="wb-who ' + who + '">' + WB_NAME[who] + '</span>' : '') +
    '<textarea class="wbp-in" rows="1" data-f="' + field + '" placeholder="' + ph + '">' + wbEsc(t[field]) + '</textarea></span></div>';
  box.innerHTML =
    '<textarea class="wbp-title" id="wbTitleIn" rows="1" placeholder="这件事叫什么">' + wbEsc(t.title) + '</textarea>' +
    '<div class="wbp-props">' +
      '<div class="wbp-prop"><span class="k">状态</span><span class="v">' + opt('status', 'todo', '要做') + opt('status', 'hold', '搁置') + opt('status', 'done', '做完了') + '</span></div>' +
      when('start', '开始') + when('end', '结束') +
      text('category', '类别', '学习、搬家、社团……') +
      '<div class="wbp-prop"><span class="k">优先级</span><span class="v">' + opt('priority', 'high', '高', true) + opt('priority', 'mid', '中') + opt('priority', 'low', '低') + opt('priority', '', '不分') + '</span></div>' +
      text('remind', '提醒', '什么时候、谁来提醒') +
      text('claude', '分工', '这件事里 Claude 做什么', 'claude') +
      text('muse', '', '这件事里 Muse 做什么', 'muse') +
      (canParent ? '<div class="wbp-prop"><span class="k">属于</span><span class="v"><select class="wbp-sel" data-f="parent"><option value="">（不属于哪条长线）</option>' +
        parents.map(p => '<option value="' + p.id + '"' + (p.id === t.parent ? ' selected' : '') + '>' + wbEsc(p.title) + '</option>').join('') + '</select></span></div>' : '') +
    '</div>' +
    (isNew ? '' : '<div class="wbp-subs" id="wbKids"></div>') +
    '<div class="wbp-notes" id="wbNotes"></div>' +
    (isNew ? '' : '<div class="wbp-write" id="wbWrite"><span class="wb-who jes">Jes：</span><textarea id="wbWriteIn" rows="1"></textarea></div>' +
      '<button class="wbp-tear" id="wbTear">撕掉这一页</button>');

  // 标题：新的一件事写了标题才真正存下来
  const titleIn = wbEl('wbTitleIn');
  titleIn.addEventListener('change', async () => {
    const v = titleIn.value.trim();
    if(!v){ if(!isNew) titleIn.value = t.title; return; }
    try{
      if(wbPageId === 'new'){
        const nt = await wbApi('/wb/task', { title: v, parent: wbNewParent });
        wb.tasks.push(nt); wbSaveLocal(); wbPageId = nt.id; wbRenderPage();
      }else if(v !== t.title) await wbSaveTask(t.id, { title: v });
    }catch(e){ wbFlash(e.message); }
  });
  titleIn.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); titleIn.blur(); } });
  // 下面的属性：新的一件事要先写标题
  const need = () => { if(wbPageId === 'new'){ wbFlash('先写这件事叫什么'); titleIn.focus(); return false; } return true; };
  const save = async (patch) => { if(!need()) return; try{ await wbSaveTask(wbPageId, patch); wbRenderPage(); }catch(e){ wbFlash(e.message); wbRenderPage(); } };
  box.querySelectorAll('.wbp-opt').forEach(b => b.addEventListener('click', () => save({ [b.dataset.f]: b.dataset.v })));
  box.querySelectorAll('.wbp-in').forEach(inp => {
    inp.addEventListener('change', () => { if(need()) wbSaveTask(wbPageId, { [inp.dataset.f]: inp.value }).catch(e => { wbFlash(e.message); wbRenderPage(); }); });
    inp.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); inp.blur(); } });
  });
  // 标题和这几栏写长了就自己换行、往下长（以前是一行的输入框，字多了右边会被截掉半个）
  box.querySelectorAll('textarea.wbp-in, .wbp-title').forEach(ta => ta.addEventListener('input', () => wbFit(ta)));
  requestAnimationFrame(() => box.querySelectorAll('textarea.wbp-in, .wbp-title').forEach(wbFit));
  box.querySelectorAll('.wbp-when input').forEach(inp => inp.addEventListener('change', () => {
    const f = inp.dataset.w;
    const d = box.querySelector('[data-w="' + f + '"][data-part="d"]').value;
    const c = box.querySelector('[data-w="' + f + '"][data-part="t"]').value;
    save({ [f]: d ? d + (c ? 'T' + c : '') : '' });
  }));
  const sel = box.querySelector('.wbp-sel');
  if(sel) sel.addEventListener('change', () => save({ parent: sel.value }));

  if(isNew) return;
  // 挂在下面的小事（长线才有）
  const kidsBox = wbEl('wbKids');
  if(kids.length || wbIsLong(t)){
    kids.forEach(k => kidsBox.appendChild(wbTaskRow(k, { noGroup: true, noDate: true })));
    kidsBox.querySelectorAll('.wb-task').forEach((row, i) => { const d = wbDay(kids[i].start); if(d) row.querySelector('.meta') ? row.querySelector('.meta').insertAdjacentHTML('afterbegin', d + ' · ') : row.querySelector('.main').insertAdjacentHTML('beforeend', '<div class="meta">' + d + '</div>'); });
    const add = document.createElement('button'); add.className = 'wb-add'; add.style.fontSize = '12px'; add.textContent = '+ 加一件小事';
    add.addEventListener('click', () => { wbNewParent = t.id; wbOpenPage('new'); });
    kidsBox.appendChild(add);
  }
  // 大家一起写的草稿：一段一段，前面署名
  const notes = wbEl('wbNotes');
  t.body.forEach(n => {
    const p = document.createElement('div'); p.className = 'wbp-note';
    p.innerHTML = '<span class="wb-who ' + n.by + '">' + (WB_NAME[n.by] || n.by) + '：</span>' + wbParas(n.text) + '<span class="wb-ts">' + wbStamp(n.ts) + (n.editedAt && n.by !== 'jes' ? ' 改过' : '') + '</span>';
    p.addEventListener('click', () => wbEditNote(t, n, p));
    notes.appendChild(p);
  });
  wbWriteSetup(t);
  wbEl('wbTear').addEventListener('click', async () => {
    if(!confirm('把「' + t.title + '」这一页撕掉？' + (kids.length ? '\n挂在它下面的小事不会删，会变成单独的事。' : '') + '\n（后端回收站里还留着，找得回来）')) return;
    try{ await wbApi('/wb/task/' + t.id + '/delete', {}); wb.tasks = wb.tasks.filter(x => x.id !== t.id).map(x => x.parent === t.id ? Object.assign({}, x, { parent: '' }) : x); wbSaveLocal(); wbClosePage(); }
    catch(e){ wbFlash(e.message); }
  });
}
// 点一段草稿：改它（清空再存 = 删掉这一段）
function wbEditNote(t, n, p){
  if(p.querySelector('textarea')) return;
  p.innerHTML = '<textarea>' + wbEsc(n.text) + '</textarea><div class="acts"><button data-a="del">删掉</button><button data-a="cancel">算了</button><button data-a="ok">改好了</button></div>';
  const ta = p.querySelector('textarea'); ta.focus();
  p.querySelector('.acts').addEventListener('click', async e => {
    e.stopPropagation();
    const a = e.target.dataset.a; if(!a) return;
    try{
      if(a === 'del'){ if(!confirm('删掉这一段？')) return; await wbApi('/wb/task/' + t.id + '/note/' + n.id + '/delete', {}); t.body = t.body.filter(x => x.id !== n.id); }
      if(a === 'ok' && ta.value.trim() && ta.value.trim() !== n.text){ const nn = await wbApi('/wb/task/' + t.id + '/note/' + n.id, { text: ta.value }); Object.assign(n, nn); }
      wbSaveLocal(); wbRenderPage();
    }catch(err){ wbFlash(err.message); }
  });
  p.addEventListener('click', e => e.stopPropagation(), { once: true });
}

/* ---- 写字：草稿、信 ---- */
function wbFit(ta){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
// 信和页上的话：空一行（或好几行）分段的地方，只留小半行的空隙，不再空出整整一行；原文不动
function wbParas(text){
  const parts = String(text || '').replace(/\s+$/, '').split(/\n[ \t\u3000]*(?:\n[ \t\u3000]*)+/);
  return wbEsc(parts[0]) + parts.slice(1).map(p => '<span class="wb-p">' + wbEsc(p) + '</span>').join('');
}
function wbGrow(ta){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; }
wbEl('wbLetterIn').addEventListener('input', e => wbGrow(e.target));

/* ---- 在这一页上直接接着写 ----
   最后一段是 Jes 写的、中间没人插话、离她上次落笔不到 5 分钟：新写的字接在那一段后面（另起一行，不再署名）；
   不然就另起一段。没有「写上」按钮：停笔 5 秒存一次，点别处、合上这一页、切到后台时也存，不丢字。 */
const WB_MERGE_MS = 5 * 60 * 1000;
let wbDraft = null;      // { taskId, noteId, base, saved }：这一次在写的那一段
let wbWriteQ = Promise.resolve(), wbWriteTimer = null;
function wbWriteSetup(t){
  const box = wbEl('wbWrite'), ta = wbEl('wbWriteIn');
  if(!box) return;
  const last = t.body[t.body.length - 1];
  const cont = !!last && last.by === 'jes' && Date.now() - (last.editedAt || last.ts) < WB_MERGE_MS;
  box.classList.toggle('cont', cont);
  ta.placeholder = cont ? '接着写……' : (t.body.length ? '接着写……' : '在这页上写点什么……');
  ta.addEventListener('focus', () => {
    if(wbDraft && wbDraft.taskId === t.id) return;
    const tt = wb.tasks.find(x => x.id === t.id) || t;        // 同步过就是新的一份：克克、Muse 刚写的也算进来
    const l = tt.body[tt.body.length - 1];
    const c = !!l && l.by === 'jes' && Date.now() - (l.editedAt || l.ts) < WB_MERGE_MS;
    box.classList.toggle('cont', c);
    wbDraft = { taskId: t.id, noteId: c ? l.id : null, base: c ? l.text : '', saved: '' };
  });
  ta.addEventListener('input', () => { wbFit(ta); clearTimeout(wbWriteTimer); wbWriteTimer = setTimeout(wbWriteSave, 5000); });
  ta.addEventListener('blur', () => { clearTimeout(wbWriteTimer); wbWriteSave(true); });
}
// 存这一次写的字；done = 写完了（点了别处）：存好后把这一段画回纸上，编辑区清空
function wbWriteSave(done){
  wbWriteQ = wbWriteQ.then(async () => {
    const ta = wbEl('wbWriteIn'), d = wbDraft;
    if(!d) return;
    const typed = ta && wbPageId === d.taskId ? ta.value.replace(/\s+$/, '') : d.saved;
    const t = wb.tasks.find(x => x.id === d.taskId);
    if(t && typed.trim() && typed !== d.saved){
      const full = d.base ? d.base + '\n' + typed : typed;
      try{
        if(d.noteId){
          const nn = await wbApi('/wb/task/' + t.id + '/note/' + d.noteId, { text: full });
          const n = t.body.find(x => x.id === d.noteId); if(n) Object.assign(n, nn);
        }else{
          const n = await wbApi('/wb/task/' + t.id + '/note', { text: full });
          t.body.push(n); d.noteId = n.id;
        }
        d.saved = typed; wbSaveLocal();
      }catch(e){ wbFlash('没存上：' + e.message); return; } // 没存上就留着字，不清空
    }
    if(done){
      wbDraft = null;
      if(!d.saved || wbPageId !== d.taskId) return;           // 什么都没写：不重画，免得吃掉她正要点的那一下
      if(!wbPageBusy()) return wbRenderPage();                // 把写好的这一段画回纸上，编辑区清空
      if(ta){ ta.value = ''; wbFit(ta); }                     // 她已经在改别的段：先清空，下次同步时这一段会出现
    }
  });
  return wbWriteQ;
}
document.addEventListener('visibilitychange', () => { if(document.hidden && wbDraft){ clearTimeout(wbWriteTimer); wbWriteSave(); } });
wbEl('wbLetterSend').addEventListener('click', async () => {
  const ta = wbEl('wbLetterIn'), v = ta.value.trim();
  if(!v) return;
  try{
    const l = await wbApi('/wb/letter', { text: v });
    wb.letters.push(l); wbSaveLocal(); ta.value = ''; wbGrow(ta); wbRender();
    const back = wbEl('wbBack'); back.scrollTop = back.scrollHeight;
  }catch(e){ wbFlash(e.message); }
});

/* ---- 翻面 ---- */
function wbFlipTo(back){
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  wbEl('wbSheet').classList.toggle('flipped', back);
  if(back) setTimeout(() => { const b = wbEl('wbBack'); b.scrollTop = b.scrollHeight; }, 50); // 翻过来先看到最新的信
}
wbEl('wbFlip').addEventListener('click', () => wbFlipTo(true));
wbEl('wbFlipBack').addEventListener('click', () => wbFlipTo(false));
wbEl('wbPageClose').addEventListener('click', wbClosePage);

/* ---- 分工一览 + 归档 ---- */
function wbRenderCard(){
  const box = wbEl('wbCardIn');
  const live = wb.tasks.filter(t => t.status !== 'done');
  const duty = who => live.filter(t => t[who]).sort(wbByStart).map(t => '<li><span class="t">' + wbEsc(t.title) + '</span> <span class="d">— ' + wbEsc(t[who]) + '</span></li>').join('') || '<li class="d">（还没有）</li>';
  const done = wb.tasks.filter(t => t.status === 'done').sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  box.innerHTML = '<div class="wb-head" style="margin-bottom:8px"><h1 style="font-size:20px">Who does what</h1><span class="sub">分工</span></div>' +
    ['claude', 'muse'].map(w => '<h3><span class="wb-who ' + w + '">' + WB_NAME[w] + '</span></h3>' +
      '<textarea rows="1" data-r="' + w + '" placeholder="平时归 ' + WB_NAME[w] + ' 管的事">' + wbEsc((wb.roles || {})[w]) + '</textarea>' +
      '<ul>' + duty(w) + '</ul>').join('') +
    '<h3 style="margin-top:20px">Archive <span class="wb-ts" style="font-family:Noto Serif SC;letter-spacing:.15em">做完的事</span></h3>' +
    (done.length ? '<ul>' + done.map(t => '<li class="arch-row"><button class="t" data-open="' + t.id + '">' + wbEsc(t.title) + '</button><button data-back="' + t.id + '">放回去</button></li>').join('') + '</ul>' : '<ul><li class="d">（还没有）</li></ul>') +
    '<h3 style="margin-top:20px">Torn out <span class="wb-ts" style="font-family:Noto Serif SC;letter-spacing:.15em">撕掉的</span></h3><ul id="wbTorn"><li class="d">……</li></ul>';
  // 撕掉的页在后端回收站里，打开这张纸条时去取
  wbApi('/wb/torn').then(list => {
    const ul = wbEl('wbTorn'); if(!ul) return;
    ul.innerHTML = list.length ? list.map(x => '<li class="arch-row"><span class="t">' + wbEsc(x.title) + ' <span class="wb-ts">' + wbStamp(x.ts) + ' 撕掉</span></span><button data-restore="' + x.id + '">放回去</button></li>').join('') : '<li class="d">（还没有）</li>';
    ul.querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', async () => {
      try{ await wbApi('/wb/torn/' + b.dataset.restore + '/restore', {}); wb = await wbApi('/wb'); wbSaveLocal(); wbRender(); wbRenderCard(); wbFlash('放回去了'); }
      catch(e){ wbFlash(e.message); }
    }));
  }).catch(() => { const ul = wbEl('wbTorn'); if(ul) ul.innerHTML = '<li class="d">（没取到，等一下再打开试试）</li>'; });
  box.querySelectorAll('textarea').forEach(ta => {
    wbGrow(ta);
    ta.addEventListener('input', () => wbGrow(ta));
    ta.addEventListener('change', async () => { try{ wb.roles = await wbApi('/wb/roles', { [ta.dataset.r]: ta.value }); wbSaveLocal(); }catch(e){ wbFlash(e.message); } });
  });
  box.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { wbEl('wbCard').classList.add('gone'); wbOpenPage(b.dataset.open); }));
  box.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', async () => { try{ await wbSaveTask(b.dataset.back, { status: 'todo' }); wbRender(); }catch(e){ wbFlash(e.message); } }));
}
wbEl('wbRolesBtn').addEventListener('click', () => { wbRenderCard(); wbEl('wbCard').classList.remove('gone'); });
wbEl('wbCardClose').addEventListener('click', () => { if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); wbEl('wbCard').classList.add('gone'); });
wbEl('wbCard').addEventListener('click', e => { if(e.target === wbEl('wbCard')) wbEl('wbCardClose').click(); });

/* ---- 大标题跟着划的方向藏起来 / 出来 ---- */
['wbFront', 'wbBack'].forEach(id => {
  const el = wbEl(id); let last = 0;
  el.addEventListener('scroll', () => {
    const y = el.scrollTop, d = y - last; last = y;
    if(y < 24) el.classList.remove('tucked');        // 回到最上面：一定出来
    else if(d > 6) el.classList.add('tucked');       // 往下划：藏起来
    else if(d < -6) el.classList.remove('tucked');   // 往上划：出来
  }, { passive: true });
});

/* ---- 进出工作台 ---- */
// 从封面推近到书桌上：封面朝她放大、淡出，下面是这张纸
function enterWb(){
  const w = wbEl('wb');
  w.classList.remove('gone');
  wbRender(); wbSync();
  clearInterval(wbPoll); wbPoll = setInterval(() => { if(!w.classList.contains('gone') && document.visibilityState === 'visible') wbSync(); }, 30000);
  if(startAnim){ startAnim.cancel(); startAnim = null; }
  const done = () => { startEl.classList.add('gone'); startAnim = null; };
  if(!startEl.animate || (reduceMotion && reduceMotion.matches)) return done();
  startEl.style.transformOrigin = '62% 62%';
  startAnim = startEl.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(1.14)' }], { duration: 520, easing: 'cubic-bezier(.45,0,.25,1)' });
  startAnim.onfinish = done;
}
function leaveWb(){ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); wbEl('wb').classList.add('gone'); wbEl('wbSheet').classList.remove('flipped'); clearInterval(wbPoll); wbPoll = null; } // 离开时翻回正面，下次从封面进来先看到手头的事
// 点了克克、Muse 写东西的推送：不管在哪，直接摊开这张纸（是信的话翻到背面），不播封面动画
function openWbFromPush(back){
  if(startAnim){ startAnim.cancel(); startAnim = null; }
  startEl.classList.add('gone');
  wbEl('wbCard').classList.add('gone');
  if(!wbEl('wbPage').classList.contains('gone')){ wbEl('wbPage').classList.add('gone'); wbPageId = null; }
  if(wbEl('wb').classList.contains('gone')) enterWb(); else wbSync();
  wbFlipTo(!!back);
}
if(window.__openFromPush === 'wb' || window.__openFromPush === 'wb-back') openWbFromPush(window.__openFromPush === 'wb-back');

/* ---------- 初始化 ---------- */
async function init(){
  // 第一次用上联系人列表：以前的消息都算看过了，不然会冒出几十条"未读"
  CONTACT_ORDER.forEach(cid => {
    if(readAt[cid] !== undefined) return;
    const h = historyOf(cid);
    readAt[cid] = h.length ? h[h.length - 1].ts : 0;
  });
  save.readAt();
  renderPersona();
  backendInput.value = backendUrl;
  renderContacts();
  renderFeedPick();
  renderFeed();
  updateFeedDot();
  renderMemoryList();
  if(!backendUrl){
    alert('先去"设置"填一下后端地址，才能真正聊起来');
    return;
  }
  loadPersonaFromBackend();
  loadContacts();
  try{ await migrateLegacyIfNeeded(); }
  catch(e){ alert('旧聊天记录还没搬过去（' + e.message + '），下次打开会再试'); }
  await Promise.all(chatIds().map(syncMessages));
  syncFeed();
  loadMemories();
}
init();
</script>
