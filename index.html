<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>小手机</title>
<style>
  :root{
    --frame: #3B2E27; --frame-edge: #2A211C; --screen: #F2E9D8;
    --ink: #2A211C; --ink-soft: #6B5D4F; --rose: #B5715A; --sage: #7C8B6F;
    --bubble-ai: #FFFDF8; --bubble-me: #E7D9BE;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background: radial-gradient(ellipse at 50% 20%, #2b2420 0%, #17130f 70%);
    display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    padding: 24px;
  }
  .stage{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .phone{
    width: 340px; height: 640px; background: var(--frame); border-radius: 38px; padding: 12px;
    box-shadow: 0 0 0 1px var(--frame-edge), 0 30px 60px rgba(0,0,0,.55);
    display:flex; flex-direction:column;
  }
  .screen{ flex:1; background: var(--screen); border-radius: 26px; overflow:hidden; display:flex; flex-direction:column; position:relative; }
  .status{ height:26px; display:flex; align-items:center; justify-content:space-between; padding: 6px 20px 0; font-size:11px; color: var(--ink-soft); }
  .header{ display:flex; align-items:center; gap:10px; padding: 6px 16px 12px; border-bottom: 1px solid rgba(42,33,28,.1); }
  .avatar{ width:38px; height:38px; border-radius:50%; background: linear-gradient(135deg, var(--rose), #C9A227); display:flex; align-items:center; justify-content:center; color:#fff; font-family:"Noto Serif SC", serif; font-size:16px; flex-shrink:0; }
  .who{flex:1; min-width:0;}
  .who .name{ font-family:"Noto Serif SC", serif; font-size:16px; color:var(--ink); }
  .who .status-line{font-size:11px; color:var(--sage); margin-top:1px;}
  .gear{ width:28px; height:28px; border-radius:50%; border:1px solid rgba(42,33,28,.15); background:transparent; color:var(--ink-soft); cursor:pointer; font-size:13px; }
  .chat{ flex:1; overflow-y:auto; padding: 14px 14px 8px; display:flex; flex-direction:column; gap:10px; }
  .row{ display:flex; } .row.me{ justify-content:flex-end; }
  .bubble{ max-width: 76%; padding: 9px 13px; border-radius: 14px; font-size: 13.5px; line-height:1.55; color: var(--ink); white-space:pre-wrap; word-break:break-word; }
  .row.ai .bubble{ background: var(--bubble-ai); border: 1px solid rgba(42,33,28,.08); border-top-left-radius:4px; }
  .row.me .bubble{ background: var(--bubble-me); border-top-right-radius:4px; }
  .bubble.typing{ color: var(--ink-soft); font-style: italic; }
  .inputbar{ display:flex; align-items:flex-end; gap:8px; padding: 10px 12px 14px; border-top: 1px solid rgba(42,33,28,.1); background: var(--screen); }
  textarea{ flex:1; resize:none; border-radius:16px; border:1px solid rgba(42,33,28,.18); padding: 9px 12px; font-size:13.5px; font-family:inherit; color:var(--ink); background:#fff; max-height:80px; min-height:36px; outline:none; }
  textarea:focus{ border-color: var(--rose); }
  .send{ background: var(--rose); color:#fff; border:none; border-radius:16px; padding: 9px 16px; font-size:13px; cursor:pointer; flex-shrink:0; }
  .send:disabled{ opacity:.5; }
  .hint{ color:#8a7d6e; font-size:12px; }
  .modal-mask{ position:absolute; inset:0; background: rgba(42,33,28,.55); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition: opacity .15s; }
  .modal-mask.open{ opacity:1; pointer-events:auto; }
  .modal{ width: 86%; background: var(--screen); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .modal h3{ margin:0 0 4px; font-family:"Noto Serif SC", serif; font-size:15px; color:var(--ink); }
  .modal label{ font-size:11.5px; color:var(--ink-soft); }
  .modal input, .modal textarea{ width:100%; border-radius:10px; border:1px solid rgba(42,33,28,.18); padding:7px 10px; font-size:13px; font-family:inherit; color:var(--ink); background:#fff; }
  .modal textarea{ min-height:70px; resize:vertical; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }
  .modal-actions button{ border:none; border-radius:10px; padding:7px 14px; font-size:12.5px; cursor:pointer; }
  .btn-cancel{ background:transparent; color:var(--ink-soft); border:1px solid rgba(42,33,28,.18) !important; }
  .btn-save{ background: var(--sage); color:#fff; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <div class="status"><span id="clock">9:41</span><span>●●●</span></div>
      <div class="header">
        <div class="avatar" id="avatarLetter">阿</div>
        <div class="who">
          <div class="name" id="personaName">阿澄</div>
          <div class="status-line">在线 · 正在等你说话</div>
        </div>
        <button class="gear" id="gearBtn" title="设定">⚙</button>
      </div>
      <div class="chat" id="chat"></div>
      <div class="inputbar">
        <textarea id="input" rows="1" placeholder="想说点什么…"></textarea>
        <button class="send" id="sendBtn">寄出</button>
      </div>
      <div class="modal-mask" id="modalMask">
        <div class="modal">
          <h3>设定</h3>
          <label>后端地址（部署好之后填这里）</label>
          <input id="backendInput" placeholder="https://xxx.up.railway.app">
          <label>名字</label>
          <input id="nameInput" maxlength="12">
          <label>人设 / 说话方式</label>
          <textarea id="personaInput"></textarea>
          <div class="modal-actions">
            <button class="btn-cancel" id="cancelBtn">取消</button>
            <button class="btn-save" id="saveBtn">保存</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="hint">点 ⚙ 先填后端地址，再填人设</div>
</div>

<script>
const chatEl = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const gearBtn = document.getElementById('gearBtn');
const modalMask = document.getElementById('modalMask');
const backendInput = document.getElementById('backendInput');
const nameInput = document.getElementById('nameInput');
const personaInput = document.getElementById('personaInput');
const personaNameEl = document.getElementById('personaName');
const avatarLetterEl = document.getElementById('avatarLetter');

const DEFAULT_PERSONA = {
  name: "阿澄",
  system: "你是阿澄，说话人的一个熟悉多年的朋友。性格温和、体贴，但不谄媚，会认真回应对方说的事。回复保持简短口语化，像发消息一样。"
};

let backendUrl = localStorage.getItem('mp_backend') || '';
let persona = JSON.parse(localStorage.getItem('mp_persona') || 'null') || { ...DEFAULT_PERSONA };
let history = JSON.parse(localStorage.getItem('mp_history') || '[]');

function fmtClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
fmtClock(); setInterval(fmtClock, 30000);

function renderPersona(){
  personaNameEl.textContent = persona.name;
  avatarLetterEl.textContent = persona.name.slice(0,1);
}

function addBubble(role, text){
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'me' : 'ai');
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return b;
}

function init(){
  renderPersona();
  if(history.length === 0){
    addBubble('assistant', '嗨，是我。今天过得怎么样？');
  } else {
    history.forEach(m => addBubble(m.role, m.content));
  }
  if(!backendUrl){
    addBubble('assistant', '（先点右上角 ⚙ 填一下后端地址，才能真正聊起来哦）');
  }
}

async function callBackend(userText){
  const messages = [...history, {role:'user', content:userText}].map(m => ({role:m.role, content:m.content}));
  const res = await fetch(backendUrl.replace(/\/$/, '') + '/chat', {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system: persona.system, messages })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || '请求失败');
  return data.reply;
}

async function send(){
  const text = input.value.trim();
  if(!text) return;
  if(!backendUrl){ alert('先在 ⚙ 里填后端地址'); return; }
  input.value = '';
  sendBtn.disabled = true;

  addBubble('user', text);
  history.push({role:'user', content:text});
  localStorage.setItem('mp_history', JSON.stringify(history));

  const typingBubble = addBubble('assistant', '正在输入…');
  typingBubble.classList.add('typing');

  try{
    const reply = await callBackend(text);
    typingBubble.classList.remove('typing');
    typingBubble.textContent = reply;
    history.push({role:'assistant', content:reply});
    localStorage.setItem('mp_history', JSON.stringify(history));
  }catch(e){
    typingBubble.classList.remove('typing');
    typingBubble.textContent = '（信号好像断了：' + e.message + '）';
  }
  sendBtn.disabled = false;
  chatEl.scrollTop = chatEl.scrollHeight;
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });

gearBtn.addEventListener('click', () => {
  backendInput.value = backendUrl;
  nameInput.value = persona.name;
  personaInput.value = persona.system;
  modalMask.classList.add('open');
});
document.getElementById('cancelBtn').addEventListener('click', () => modalMask.classList.remove('open'));
document.getElementById('saveBtn').addEventListener('click', () => {
  backendUrl = backendInput.value.trim();
  persona.name = nameInput.value.trim() || DEFAULT_PERSONA.name;
  persona.system = personaInput.value.trim() || DEFAULT_PERSONA.system;
  localStorage.setItem('mp_backend', backendUrl);
  localStorage.setItem('mp_persona', JSON.stringify(persona));
  renderPersona();
  modalMask.classList.remove('open');
});

init();
</script>
</body>
</html>
