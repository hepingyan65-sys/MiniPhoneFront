<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>小手机</title>
<style>
  :root{
    --sky-top: #0B0C14;
    --sky-bottom: #171A2B;
    --frame: #16161C;
    --frame-edge: #060608;
    --screen-top: #14162244;
    --lamp: #E3A15C;
    --lamp-dim: #B97A4A;
    --moon: #8892AC;
    --ink: #EDE7DA;
    --ink-dim: #9A9CB4;
    --bubble-ai: #23273A;
    --bubble-me: #3A2E28;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    height: 100dvh;
    background: radial-gradient(ellipse 900px 600px at 50% -10%, #23283f 0%, #0A0A10 55%, #050507 100%);
    display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    padding: 16px;
    overflow: hidden;
  }
  .stage{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .phone{
    width: min(400px, 94vw);
    height: min(720px, 92dvh);
    background: var(--frame); border-radius: 38px; padding: 12px;
    box-shadow: 0 0 0 1px var(--frame-edge), 0 40px 80px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.04);
    display:flex; flex-direction:column; position:relative;
  }
  @media (max-width: 480px){
    .phone{ width: 100vw; height: 100dvh; border-radius: 0; padding: 0; }
    .screen{ border-radius: 0; }
    .hint{ display:none; }
  }
  .screen{
    flex:1; border-radius: 26px; overflow:hidden; display:flex; flex-direction:column; position:relative;
    background:
      radial-gradient(420px 260px at 30% 0%, rgba(227,161,92,.14), transparent 60%),
      linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
  }
  .status{ height:26px; display:flex; align-items:center; justify-content:space-between; padding: 6px 20px 0; font-size:11px; color: var(--ink-dim); }
  .header{
    display:flex; align-items:center; gap:12px; padding: 8px 16px 14px;
    border-bottom: 1px solid rgba(255,255,255,.06); position:relative;
  }
  .avatar{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background: radial-gradient(circle at 35% 30%, #F3C286, var(--lamp) 55%, var(--lamp-dim) 100%);
    box-shadow: 0 0 18px 3px rgba(227,161,92,.45);
    display:flex; align-items:center; justify-content:center;
    color:#20140A; font-family:"Noto Serif SC", serif; font-size:16px;
  }
  .who{flex:1; min-width:0;}
  .who .name{ font-family:"Noto Serif SC", serif; font-size:16px; color: var(--ink); letter-spacing:.02em; }
  .who .status-line{font-size:11px; color: var(--moon); margin-top:2px;}
  .gear{
    width:28px; height:28px; border-radius:50%; border:1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.03); color: var(--ink-dim); cursor:pointer; font-size:13px;
  }
  .chat{ flex:1; overflow-y:auto; padding: 16px 14px 8px; display:flex; flex-direction:column; gap:11px; }
  .row{ display:flex; } .row.me{ justify-content:flex-end; }
  .bubble{
    max-width: 76%; padding: 10px 14px; border-radius: 15px; font-size: 13.5px; line-height:1.6;
    white-space:pre-wrap; word-break:break-word;
  }
  .row.ai .bubble{
    background: var(--bubble-ai); color: var(--ink);
    border: 1px solid rgba(227,161,92,.18);
    border-top-left-radius:4px;
    box-shadow: 0 0 14px rgba(227,161,92,.06);
  }
  .row.me .bubble{
    background: var(--bubble-me); color: var(--ink);
    border-top-right-radius:4px;
  }
  .bubble.typing{ color: var(--ink-dim); font-style: italic; }
  .inputbar{
    display:flex; align-items:flex-end; gap:8px; padding: 10px 12px 14px;
    border-top: 1px solid rgba(255,255,255,.06);
    background: linear-gradient(180deg, transparent, rgba(5,5,8,.4));
  }
  textarea{
    flex:1; resize:none; border-radius:16px; border:1px solid rgba(255,255,255,.12);
    padding: 9px 12px; font-size:16px; font-family:inherit; color: var(--ink);
    background: rgba(255,255,255,.04); max-height:80px; min-height:36px; outline:none;
  }
  textarea::placeholder{ color: var(--ink-dim); }
  textarea:focus{ border-color: var(--lamp); }
  .send{
    background: linear-gradient(135deg, #F0BA80, var(--lamp-dim));
    color:#20140A; border:none; border-radius:16px; padding: 9px 16px; font-size:13px;
    font-weight:600; cursor:pointer; flex-shrink:0;
  }
  .send:disabled{ opacity:.4; }
  .hint{ color: var(--ink-dim); font-size:12px; }
  .modal-mask{
    position:absolute; inset:0; background: rgba(5,5,10,.72);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition: opacity .15s;
  }
  .modal-mask.open{ opacity:1; pointer-events:auto; }
  .modal{ width: 86%; background: #1A1D2C; border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .modal h3{ margin:0 0 4px; font-family:"Noto Serif SC", serif; font-size:15px; color: var(--ink); }
  .modal label{ font-size:11.5px; color: var(--ink-dim); }
  .modal input, .modal textarea{
    width:100%; border-radius:10px; border:1px solid rgba(255,255,255,.14);
    padding:7px 10px; font-size:16px; font-family:inherit; color: var(--ink); background: rgba(255,255,255,.04);
  }
  .modal textarea{ min-height:70px; resize:vertical; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }
  .modal-actions button{ border:none; border-radius:10px; padding:7px 14px; font-size:12.5px; cursor:pointer; }
  .btn-cancel{ background:transparent; color: var(--ink-dim); border:1px solid rgba(255,255,255,.14) !important; }
  .btn-save{ background: var(--lamp); color:#20140A; font-weight:600; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">
      <div class="status"><span id="clock">23:41</span><span>●●●</span></div>
      <div class="header">
        <div class="avatar" id="avatarLetter">阿</div>
        <div class="who">
          <div class="name" id="personaName">阿澄</div>
          <div class="status-line">在线 · 正在等你说话</div>
        </div>
        <button class="gear" id="gearBtn" title="设定">⚙</button>
      </div>
      <div class="chat" id="chat"></div>
      <div class="inputbar">
        <textarea id="input" rows="1" placeholder="想说点什么…"></textarea>
        <button class="send" id="sendBtn">寄出</button>
      </div>
      <div class="modal-mask" id="modalMask">
        <div class="modal">
          <h3>设定</h3>
          <label>后端地址（部署好之后填这里）</label>
          <input id="backendInput" placeholder="https://xxx.up.railway.app">
          <label>名字</label>
          <input id="nameInput" maxlength="12">
          <label>人设 / 说话方式</label>
          <textarea id="personaInput"></textarea>
          <div class="modal-actions">
            <button class="btn-cancel" id="cancelBtn">取消</button>
            <button class="btn-save" id="saveBtn">保存</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="hint">点 ⚙ 先填后端地址，再填人设</div>
</div>

<script>
const chatEl = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const gearBtn = document.getElementById('gearBtn');
const modalMask = document.getElementById('modalMask');
const backendInput = document.getElementById('backendInput');
const nameInput = document.getElementById('nameInput');
const personaInput = document.getElementById('personaInput');
const personaNameEl = document.getElementById('personaName');
const avatarLetterEl = document.getElementById('avatarLetter');

const DEFAULT_PERSONA = {
  name: "阿澄",
  system: "你是阿澄，说话人的一个熟悉多年的朋友。性格温和、体贴，但不谄媚，会认真回应对方说的事。回复保持简短口语化，像发消息一样。"
};

let backendUrl = localStorage.getItem('mp_backend') || '';
let persona = JSON.parse(localStorage.getItem('mp_persona') || 'null') || { ...DEFAULT_PERSONA };
let history = JSON.parse(localStorage.getItem('mp_history') || '[]');

function fmtClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
fmtClock(); setInterval(fmtClock, 30000);

function renderPersona(){
  personaNameEl.textContent = persona.name;
  avatarLetterEl.textContent = persona.name.slice(0,1);
}

function addBubble(role, text){
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'me' : 'ai');
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return b;
}

function init(){
  renderPersona();
  if(history.length === 0){
    addBubble('assistant', '嗨，是我。今天过得怎么样？');
  } else {
    history.forEach(m => addBubble(m.role, m.content));
  }
  if(!backendUrl){
    addBubble('assistant', '（先点右上角 ⚙ 填一下后端地址，才能真正聊起来哦）');
  }
}

async function callBackend(userText){
  const messages = [...history, {role:'user', content:userText}].map(m => ({role:m.role, content:m.content}));
  const res = await fetch(backendUrl.replace(/\/$/, '') + '/chat', {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system: persona.system, messages })
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || '请求失败');
  return data.reply;
}

async function send(){
  const text = input.value.trim();
  if(!text) return;
  if(!backendUrl){ alert('先在 ⚙ 里填后端地址'); return; }
  input.value = '';
  sendBtn.disabled = true;

  addBubble('user', text);
  history.push({role:'user', content:text});
  localStorage.setItem('mp_history', JSON.stringify(history));

  const typingBubble = addBubble('assistant', '正在输入…');
  typingBubble.classList.add('typing');

  try{
    const reply = await callBackend(text);
    typingBubble.classList.remove('typing');
    typingBubble.textContent = reply;
    history.push({role:'assistant', content:reply});
    localStorage.setItem('mp_history', JSON.stringify(history));
  }catch(e){
    typingBubble.classList.remove('typing');
    typingBubble.textContent = '（信号好像断了：' + e.message + '）';
  }
  sendBtn.disabled = false;
  chatEl.scrollTop = chatEl.scrollHeight;
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });

gearBtn.addEventListener('click', () => {
  backendInput.value = backendUrl;
  nameInput.value = persona.name;
  personaInput.value = persona.system;
  modalMask.classList.add('open');
});
document.getElementById('cancelBtn').addEventListener('click', () => modalMask.classList.remove('open'));
document.getElementById('saveBtn').addEventListener('click', () => {
  backendUrl = backendInput.value.trim();
  persona.name = nameInput.value.trim() || DEFAULT_PERSONA.name;
  persona.system = personaInput.value.trim() || DEFAULT_PERSONA.system;
  localStorage.setItem('mp_backend', backendUrl);
  localStorage.setItem('mp_persona', JSON.stringify(persona));
  renderPersona();
  modalMask.classList.remove('open');
});

init();
</script>
</body>
</html>
