<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小手机">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=IM+Fell+English:ital@0;1&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>小手机</title>
<style>
  /* 外观：雾绿 + 一点淡淡的香槟色暖光（"雾里的一盏灯"） */
  :root{
    --sky-top: #0E1411; --sky-bottom: #141C17;
    --frame: #101512; --frame-edge: #050706;
    --lamp: #CFC09A; --lamp-dim: #A89874; --moon: #9DB09A;   /* lamp：香槟色点缀；moon：灰绿 */
    --ink: #E6EADF; --ink-dim: #A1AE9E;                      /* 雾白 / 灰绿 */
    --bubble-ai: rgba(20,30,24,.62); --bubble-me: rgba(132,158,124,.34);
    --card: rgba(18,27,21,.55); --card-line: rgba(220,232,214,.10);
    --glass-edge: rgba(226,236,220,.12);                     /* 雾玻璃的细描边 */
    --placeholder: #1E2A22;                                  /* 图片、头像还没加载出来时的底色 */
    --title-font: "Cinzel", "Noto Serif SC", serif;          /* 大标题：罗马碑刻大写 */
    --name-font: "IM Fell English", "Noto Serif SC", serif;  /* 人名：老书印刷体 */
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0; background:#070A08;}
  body{
    height: 100dvh;
    background: #070A08;
    display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    padding: 16px; overflow:hidden;
  }
  .phone{
    width: min(400px, 94vw); height: min(720px, 92dvh);
    background: var(--frame); border-radius: 38px; padding: 12px;
    box-shadow: 0 0 0 1px var(--frame-edge), 0 40px 80px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.04);
    display:flex; flex-direction:column; position:relative;
  }
  @media (max-width: 480px){
    body{ padding:0; align-items:flex-start; } /* 手机上贴着顶部摆，不上下居中（键盘弹起 App 变矮时不会被挪到中间） */
    .phone{
      width:100vw; height: var(--app-h, 100dvh); border-radius:0; padding:0; /* 键盘弹出时 JS 把 --app-h 设成看得见的高度 */
      top: var(--app-top, 0px); /* iOS 把看得见的区域往下挪了多少，App 就跟着挪多少 */
      padding-top: env(safe-area-inset-top, 0px);
      /* 底部安全区不在这里留了：交给下面的 tabbar 自己往下铺，避免留两遍出现一条空白 */
    }
    .screen{ border-radius:0; }
  }
  .screen{
    flex:1; border-radius:26px; overflow:hidden; display:flex; flex-direction:column; position:relative;
    background: var(--sky-top); isolation:isolate;
  }
  /* 背景图 bg.jpg：主页（信息列表、朋友圈、设置）微微虚化压暗；点进聊天变清楚。
     模糊程度放在变量里：右滑返回时 JS 按拖了多少直接改变量，背景跟着手指一点点变（数值和 JS 的 bgLook() 一致） */
  .screen{ --bg-filter: blur(4px) saturate(.9) brightness(.72); --bg-scale: scale(1.03); }
  .screen.in-chat{ --bg-filter: blur(0px) saturate(.95) brightness(.9); --bg-scale: scale(1); }
  .screen::before{
    content:''; position:absolute; inset:0; z-index:-2;
    background: url('bg.jpg') center 60% / cover no-repeat;
    opacity:.8; filter: var(--bg-filter); transform: var(--bg-scale);
    /* 时间和曲线跟推门动画一样（pushView 每次会设好 --push-ms） */
    transition: filter var(--push-ms, .36s) cubic-bezier(.32,.72,0,1), transform var(--push-ms, .36s) cubic-bezier(.32,.72,0,1);
  }
  .screen.dragging::before{ transition:none; } /* 手指拖着的时候背景直接跟手，不慢半拍 */
  /* 上下各压一层深色，让标题和输入框的字看得清 */
  .screen::after{
    content:''; position:absolute; inset:0; z-index:-1;
    background: linear-gradient(180deg, rgba(8,12,10,.72) 0%, rgba(8,12,10,.25) 30%, rgba(8,12,10,.15) 62%, rgba(8,12,10,.70) 100%);
  }
  .status{ height:26px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding: 6px 20px 0; font-size:11px; color: var(--ink-dim); }
  /* 回封面的小拱门：放在每页大标题左边（状态栏那一行在 iPhone 上会被系统虚化，不好点）；点的范围 40×40 */
  .to-start{ width:40px; height:40px; margin:-6px -6px -6px -10px; background:none; border:none; padding:0; color: var(--ink-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex:none; -webkit-tap-highlight-color:transparent; }
  .to-start svg{ width:18px; height:18px; }
  .to-start-pad{ width:24px; flex:none; }

  /* ---- 封面（启动页）：一张画，点窗边的他进 FromAlis，点书桌前的 Jes 进工作台 ----
     画按 cover 铺满（手机比画更细长，左右会裁掉一点）；两个入口的位置是按"画"的百分比算的，
     所以放在和画一样比例的 .start-art 里，屏幕再怎么变，入口都贴着人物 */
  .start{ position:absolute; inset:12px; border-radius:26px; overflow:hidden; z-index:50; background:#050505; container-type:size; }
  @media (max-width: 480px){ .start{ inset:0; border-radius:0; } }
  .start.gone{ display:none; }
  .start-art{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width: max(100cqw, calc(100cqh * 941 / 1672)); height: max(100cqh, calc(100cqw * 1672 / 941));
    background: url('start.jpg') center / 100% 100% no-repeat;
  }
  /* 上下压一点暗，字和 Home 条附近不刺眼 */
  .start::after{ content:''; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 16%, rgba(0,0,0,0) 80%, rgba(0,0,0,.45) 100%); }
  .start-spot{ position:absolute; background:none; border:none; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .start-spot.alis{ left:11%; top:18%; width:35%; height:44%; z-index:2; }
  .start-spot.desk{ left:24%; top:40%; width:72%; height:50%; z-index:1; }
  .start-spot:active{ transform:none; } /* 整片点击区不缩，只让字缩一下 */
  /* 入口的字：› + 斜体英文，下面一根很细的线，线下一行小中文。像书里的章节名，不像网页链接 */
  .start-label{ position:absolute; display:flex; flex-direction:column; align-items:flex-start; color: var(--st-ink); white-space:nowrap;
    text-shadow: 0 1px 12px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.7); transition: transform .45s cubic-bezier(.3,1.6,.5,1); }
  .start-spot:active .start-label{ transform:scale(.95); transition-duration:.12s; }
  .start-label .en{ font-family: var(--name-font); font-style:italic; font-size:18px; line-height:1; letter-spacing:.03em; display:flex; align-items:baseline; gap:6px; padding:0 2px 1px 0; } /* 字贴着线，像在横线上签名 */
  .start-label .en i{ font-style:normal; font-family: -apple-system, sans-serif; font-weight:300; font-size:15px; color: var(--st-arrow); }
  .start-label .rule{ align-self:stretch; height:1px; background: linear-gradient(90deg, var(--st-ink) 0%, var(--st-ink) 65%, transparent 100%); opacity:.38; } /* 0.5px 在 iPhone 上有时会被吞掉，用 1px 调淡 */
  .start-label .zh{ font-family: "Noto Serif SC", serif; font-size:9px; color: var(--st-sub); letter-spacing:.24em; padding:5px 0 0 15px; }
  /* 他在远景：字淡一点、偏冷，像隔着窗边的雾；你在近景：字亮一点、暖一点，像台灯照着 */
  /* 远的不是"更暗"，而是"更亮、更灰白、对比更低"（空气透视）：字调成发冷的浅雾白，去掉压暗的黑影，换成一圈淡淡的雾光 */
  .start-spot.alis{ --st-ink: rgba(226,232,236,.86); --st-sub: rgba(214,222,228,.70); --st-arrow: rgba(222,212,186,.80); }
  .start-spot.alis .start-label{ text-shadow: 0 0 10px rgba(205,215,222,.30), 0 1px 6px rgba(0,0,0,.45); }
  .start-spot.desk{ --st-ink: #F2E9D6; --st-sub: rgba(232,222,200,.78); --st-arrow: var(--lamp); }
  /* 字的位置跟着画走，但屏幕越细长、画左右被裁得越多：保证字离屏幕边至少 14px，不跑出去
     --art-w 是画的宽，--crop 是一边被裁掉多少（cqw/cqh 指封面 .start 的宽高） */
  .start-spot{ --art-w: max(100cqw, calc(100cqh * 941 / 1672)); --crop: calc((var(--art-w) - 100cqw) / 2); }
  .start-spot.alis .start-label{ top:47%; left: max(4%, calc(var(--crop) - var(--art-w) * .11 + 14px)); }   /* 他的点击区从画的 11% 开始 */
  .start-spot.desk .start-label{ top:46%; right: max(5%, calc(var(--crop) - var(--art-w) * .04 + 14px)); } /* 你的点击区到画的 96% 为止 */
  /* 灯：有人发来新消息时亮起来、轻轻呼吸 */
  .start-lamp{ width:5px; height:5px; border-radius:50%; background: var(--lamp); box-shadow: 0 0 8px 2px rgba(207,192,154,.55); display:none; align-self:center; margin-left:2px; }
  .start-spot.lit .start-lamp{ display:block; animation: lampBreath 2.8s ease-in-out infinite; }
  @keyframes lampBreath{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
  /* 点下去"哗啦"散开的光点 */
  .spark{ position:absolute; width:3.5px; height:3.5px; border-radius:50%; pointer-events:none; z-index:4;
    background: #F4E7C4; box-shadow: 0 0 6px 1.5px rgba(232,212,160,.75); }

  /* ---- 顶部各tab的header ---- */
  .header{ display:flex; align-items:center; gap:12px; padding: 8px 16px 14px; border-bottom: 1px solid var(--glass-edge); flex-shrink:0;
    background: rgba(10,15,12,.35); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .avatar{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background: radial-gradient(circle at 35% 30%, #E4D8B8, var(--lamp) 55%, var(--lamp-dim) 100%);
    box-shadow: 0 0 0 1px var(--glass-edge);
    display:flex; align-items:center; justify-content:center; color:#20140A; font-family:"Noto Serif SC", serif; font-size:16px;
  }
  /* 照片头像（avatars/ 文件夹里） */
  img.avatar{ object-fit:cover; background: var(--placeholder); box-shadow: 0 0 0 1px var(--glass-edge); }
  .back-btn{ background:none; border:none; color: var(--lamp); font-size:26px; line-height:1; padding:0 4px 0 0; cursor:pointer; font-family:inherit; }

  /* 联系人列表 */
  .contacts-list{ flex:1; overflow-y:auto; padding: 10px 12px 20px; display:flex; flex-direction:column; gap:8px; }
  .contact-row{ display:flex; align-items:center; gap:12px; padding:11px 12px; cursor:pointer; flex-shrink:0;
    border:1px solid var(--glass-edge); border-radius:18px; background: var(--card); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .contact-row:active{ background: rgba(255,255,255,.07); }
  .contact-row img{ width:48px; height:48px; border-radius:50%; object-fit:cover; flex-shrink:0; background: var(--placeholder); box-shadow: 0 0 0 1px var(--glass-edge); }
  .contact-row .c-main{ flex:1; min-width:0; }
  .contact-row .c-top{ display:flex; align-items:baseline; gap:8px; }
  .contact-row .c-name{ flex:1; font-family: var(--name-font); font-size:17px; color: var(--ink); }
  /* 中文名字（群名）：宋体本身显大，单独小一号 */
  .contact-row .c-name.cjk{ font-size:14.5px; letter-spacing:.02em; }
  .contact-row .c-time{ font-size:10.5px; color: var(--ink-dim); flex-shrink:0; }
  .contact-row .c-bottom{ display:flex; align-items:center; gap:8px; margin-top:3px; }
  .contact-row .c-last{ flex:1; min-width:0; font-size:12px; color: var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .unread{ min-width:17px; height:17px; border-radius:9px; background: rgba(207,192,154,.78); color:#1C1A12; font-size:10.5px; font-weight:600; display:flex; align-items:center; justify-content:center; padding:0 5px; flex-shrink:0; }
  .contact-row.not-yet{ cursor:default; opacity:.45; }
  .contact-row.not-yet:active{ background:none; }
  .tab-btn{ position:relative; }
  /* 群头像：五个人的小头像拼在一起（像微信群） */
  .group-av{ display:flex; flex-wrap:wrap-reverse; justify-content:center; align-content:center; gap:1px; padding:2px; background: var(--placeholder); border-radius:50%; overflow:hidden; flex-shrink:0; }
  .group-av img{ border-radius:3px !important; object-fit:cover; background:none !important; box-shadow:none !important; }
  /* 群聊里每条消息前面的小头像和名字 */
  .row.with-speaker{ gap:8px; align-items:flex-start; }
  .row.with-speaker .mini-av{ width:30px; height:30px; border-radius:50%; object-fit:cover; flex-shrink:0; margin-top:2px; }
  .row.with-speaker .col{ display:flex; flex-direction:column; align-items:flex-start; gap:3px; max-width:76%; min-width:0; }
  .row.with-speaker .col .bubble{ max-width:100%; }
  .row.with-speaker .col .quote{ max-width:100%; }
  .speaker-name{ font-family: var(--name-font); font-size:12.5px; color: var(--ink-dim); padding-left:2px; }
  .row.with-speaker .mini-av{ cursor:pointer; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }

  /* 资料页：群里短按头像打开 */
  .profile{ position:absolute; inset:0; z-index:40; display:none; flex-direction:column;
    background: rgba(10,15,12,.82); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  .profile.open{ display:flex; }
  .profile .p-body{ flex:1; display:flex; flex-direction:column; align-items:center; padding: 28px 28px 20px; gap:6px; text-align:center; }
  .profile .p-av{ width:96px; height:96px; border-radius:50%; object-fit:cover; background: var(--placeholder); box-shadow: 0 0 0 1px var(--glass-edge); margin-bottom:10px; }
  .profile .p-name{ font-family: var(--name-font); font-size:24px; color: var(--ink); }
  .profile .p-full{ font-size:12px; color: var(--ink-dim); letter-spacing:.3px; }
  .profile .p-role{ font-size:13px; color: var(--ink); margin-top:14px; line-height:1.7; }
  .profile .p-now{ font-size:12px; color: var(--lamp); margin-top:6px; }
  .profile .p-btn{ margin-top:auto; width:100%; padding:12px; border-radius:12px; border:1px solid rgba(207,192,154,.38); background: rgba(207,192,154,.14); color: var(--ink); font-size:14px; font-family:inherit; cursor:pointer; }
  .profile .p-btn:disabled{ opacity:.4; }
  .tab-dot{ position:absolute; top:6px; left:calc(50% + 8px); width:8px; height:8px; border-radius:50%; background: var(--lamp); display:none; }

  .who{flex:1; min-width:0;}
  .who .name{ font-family: var(--name-font); font-size:18px; color: var(--ink); }
  .who .name.cjk{ font-size:15px; letter-spacing:.02em; }
  .who .status-line{font-size:11px; color: var(--moon); margin-top:2px;}
  /* 他正在输入：状态行换成「正在输入…」，字慢慢一明一暗 */
  .who .status-line.typing{ color: var(--lamp); animation: typingBreath 1.6s ease-in-out infinite; }
  @keyframes typingBreath{ 50%{ opacity:.45; } }
  .plain-title{ font-family: var(--title-font); font-weight:500; font-size:22px; letter-spacing:.08em; text-align:center; padding:2px 0; color: var(--ink); flex:1; }

  /* ---- 三个面板容器 ---- */
  .panels{ flex:1; min-height:0; position:relative; }
  .panel{ position:absolute; inset:0; display:none; flex-direction:column; min-height:0; }
  .panel.active{ display:flex; }

  /* ---- 信息 tab ---- */
  .chat{ flex:1; overflow-y:auto; padding: 16px 14px 8px; display:flex; flex-direction:column; gap:11px; }
  .row{ display:flex; } .row.me{ justify-content:flex-end; }
  .bubble{ max-width: 76%; padding: 10px 14px; border-radius: 15px; font-size: 13.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .row.ai .bubble{ background: var(--bubble-ai); color: var(--ink); border: 1px solid var(--glass-edge); border-top-left-radius:4px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .row.me .bubble{ background: var(--bubble-me); color: var(--ink); border-top-right-radius:4px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .bubble.typing{ color: var(--ink-dim); font-style: italic; }
  .note{ align-self:center; font-size:11.5px; color: var(--ink-dim); padding:4px 10px; text-align:center; }
  .note.time-note{ font-size:11px; color:#C9D2C4; opacity:.85; padding:2px 10px; letter-spacing:.3px; }
  .bubble img{ max-width:100%; border-radius:10px; display:block; margin-top:6px; }
  .bubble img:first-child{ margin-top:0; }
  /* 他们发的照片（Unsplash 图库）：雾玻璃小相框，加载出来之前是一层慢慢流动的雾 */
  .bubble.photo{ padding:4px; width:min(232px, 64vw); max-width:76%; }
  .photo-frame{ position:relative; border-radius:11px; overflow:hidden; background: var(--placeholder); cursor:zoom-in; aspect-ratio:4/3; }
  .photo-frame::before{ content:''; position:absolute; inset:0;
    background: linear-gradient(100deg, transparent 20%, rgba(207,192,154,.10) 45%, rgba(157,176,154,.14) 55%, transparent 80%);
    background-size:220% 100%; animation: photoFog 1.6s ease-in-out infinite; }
  .photo-frame.loaded::before{ display:none; }
  @keyframes photoFog{ from{ background-position:120% 0; } to{ background-position:-120% 0; } }
  .bubble .photo-frame img{ width:100%; height:100%; object-fit:cover; display:block; margin:0; border-radius:0; opacity:0; transition: opacity .45s; }
  .photo-frame.loaded img{ opacity:1; }
  .photo-credit{ position:absolute; left:0; right:0; bottom:0; padding:14px 8px 5px; font-size:9px; line-height:1.3; letter-spacing:.2px;
    color: rgba(230,234,223,.78); background: linear-gradient(transparent, rgba(7,10,8,.6)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; transition: opacity .45s; }
  .photo-frame.loaded .photo-credit{ opacity:1; }
  .photo-credit a{ color:inherit; text-decoration:none; border-bottom:1px solid rgba(207,192,154,.35); }
  /* 搜不到图时的文字照片卡片（和朋友圈里的照片卡片同一个样子） */
  .bubble.photo-card{ cursor:pointer; font-size:12.5px; line-height:1.6;
    background: linear-gradient(160deg, rgba(157,176,154,.28), rgba(207,192,154,.12)) !important; border:1px solid var(--glass-edge); }
  .bubble.photo-card::before{ content:"📷 "; }
  /* Alis 发的语音条：雾玻璃小长条，点一下播放，声波从左到右亮成香槟色；下面的「转文字」点开看英文原话和中文翻译 */
  .row.stacked{ flex-direction:column; align-items:flex-start; gap:4px; }
  .bubble.voice{ display:flex; align-items:center; gap:9px; cursor:pointer; padding:9px 13px; }
  .bubble.voice svg{ width:15px; height:15px; flex:none; stroke: var(--lamp); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .bubble.voice .vplay-pause{ display:none; }
  .bubble.voice.playing .vplay-play{ display:none; }
  .bubble.voice.playing .vplay-pause{ display:block; }
  .vbars{ display:flex; align-items:center; gap:2px; height:18px; flex:1; }
  .vbars i{ flex:1; max-width:3px; min-width:2px; border-radius:1px; background: var(--ink-dim); opacity:.55; transition: background .2s, opacity .2s; }
  .vbars i.on{ background: var(--lamp); opacity:1; }
  .bubble.voice.playing .vbars i:not(.on){ animation: vbreath 1.4s ease-in-out infinite; }
  @keyframes vbreath{ 50%{ opacity:.9; } }
  .vdur{ font-size:12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; flex:none; }
  .bubble.voice.broken .vdur{ color:#D8A39A; }
  .vtoggle{ font-size:11px; color: var(--lamp-dim); padding:0 4px; cursor:pointer; letter-spacing:.3px; }
  .vtrans{ max-width:76%; font-size:12.5px; line-height:1.6; padding:8px 12px; border-radius:12px; background: var(--card); border:1px solid var(--card-line);
    color: var(--ink); white-space:pre-wrap; word-break:break-word; cursor:pointer; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

  /* 引用：长按气泡弹出菜单，引用的原文显示在气泡下面的灰色小框里（像微信） */
  .bubble{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }

  /* 按下去的反馈：按下时迅速缩一点，松手时带一点回弹弹回来（取代 iPhone 自带的灰色点击高光） */
  *{ -webkit-tap-highlight-color: transparent; }
  button, .contact-row, .post .p-comment{ transition: transform .32s cubic-bezier(.3,1.6,.5,1), background .15s; }
  button:active{ transform: scale(.92); transition-duration: .08s; }

  .contact-row.not-yet:active{ transform:none; }
  /* 长按消息：按住时气泡慢慢往里收，菜单弹出那一刻（或中途松手）"啵"地弹回 */
  .bubble, .mini-av{ transition: transform .34s cubic-bezier(.3,1.6,.5,1); }

  .row.has-quote{ flex-direction:column; align-items:flex-start; gap:4px; }

  /* 动作描写：从他们的消息里拆出来，像剧本里的舞台提示，写在气泡上方（设置里可以关掉） */
  .stage{ max-width:76%; font-size:11.5px; line-height:1.55; color:#B9C4B4; font-style:italic; padding:0 4px; white-space:pre-wrap; word-break:break-word; }

  .msg-menu{

  /* ---- 设置 tab ---- */
  .settings-body{ flex:1; overflow-y:auto; padding: 14px 14px 90px; display:flex; flex-direction:column; gap:16px; }
  .settings-section{ background: var(--card); border:1px solid var(--glass-edge); border-radius:18px; padding:12px; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }

    background: rgba(18,26,21,.45); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);

    flex:1; background:none; border:none; padding:9px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px;

  .tab-btn .icon{ font-size:18px; line-height:1; }

  /* ==================== 工作台（Workbench）：一张泛黄的纸 ====================
     正面是手头的事，翻过来是三个人往来的信；点一件事，另一张纸盖上来，是它的那一页。
     色调跟着封面那张画走：暗棕的桌面、旧纸、深棕墨水，三个人三种墨水色 */
  .wb{ --ink:#2C2218; --ink-soft:#5E4E3A; --ink-faint:rgba(70,52,30,.45); --red:#9A3A2C;
    --paper:#E9DDBF; --paper-2:#DDCBA3; --c-claude:#8A4B2A; --c-muse:#2F5560; --c-jes:#5B3F68;
    position:absolute; inset:12px; border-radius:26px; overflow:hidden; z-index:40; background:#0B0806;
    display:flex; flex-direction:column; color: var(--ink); font-family:"Noto Serif SC", serif; }
  @media (max-width: 480px){ .wb{ inset:0; border-radius:0; padding-top: env(safe-area-inset-top, 0px); } }
  .wb.gone, .wb .gone{ display:none !important; }
  /* 纸外面那一圈：旧书架和一盏灯（Jes 挑的图），压暗一点，只在纸边上露出来 */
  .wb-room{ position:absolute; inset:-10px; z-index:0; background:url('wb-room.jpg') 45% 60% / cover no-repeat #0B0806;
    filter: blur(1.5px) brightness(.62) saturate(.9); }
  .wb-top{ position:relative; z-index:1; height:50px; flex:none; display:flex; align-items:center; justify-content:center; color: rgba(236,226,204,.8); }
  .wb-top .t{ font-family: var(--title-font); font-size:14px; letter-spacing:.22em; }
  .wb-top .to-start{ position:absolute; left:6px; top:5px; margin:0; color: rgba(236,226,204,.6); }
  .wb-sync{ position:absolute; right:16px; font-size:10px; color: rgba(236,226,204,.45); letter-spacing:.1em; }
  .wb-stage{ position:relative; z-index:1; flex:1; min-height:0; padding:0 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
  /* 翻面：两面各自转，不用 preserve-3d。平时朝上的那面完全没有 3D 变换，背过去的那面 visibility:hidden，
     手指只摸得到看得见的那一面（以前背面叠在正面上面，iPhone 上正面划不动） */
  .wb-sheet{ position:relative; height:100%; perspective:1600px; }
  .wb-sheet > .wb-face{ backface-visibility:visible; -webkit-backface-visibility:visible;
    transition: transform .9s cubic-bezier(.4,.1,.2,1), visibility 0s .3s; } /* .3 秒正好转到侧着，这时候换面 */
  .wb-sheet.flipped .wb-front{ transform: rotateY(-180deg); visibility:hidden; }
  .wb-sheet.flipped .wb-back{ transform:none; visibility:visible; }
  .wb-face{ position:absolute; inset:0; overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    clip-path: polygon(0.4% 0.3%,22% 0,48% .4%,73% 0,99.6% .3%,100% 18%,99.6% 44%,100% 71%,99.7% 99.6%,76% 100%,51% 99.6%,27% 100%,0.3% 99.7%,0 76%,.4% 52%,0 27%);
    /* 真的旧纸（Jes 挑的图）盖在上面；图没加载出来时，底下画出来的那张纸还在 */
    background: url('paper.jpg') center / cover no-repeat, linear-gradient(170deg, var(--paper), var(--paper-2)); }
  /* 图里自带颗粒、旧斑和折痕，以前 CSS 画的那些就不要了 */
  .wb-back{ transform: rotateY(180deg); visibility:hidden; }
  .wb-margin{ position:absolute; left:40px; top:0; bottom:0; width:1px; background: rgba(154,58,44,.35); z-index:1; pointer-events:none; }
  .wb-inner{ position:relative; z-index:1; height:100%; overflow-y:auto; overflow-x:hidden; overscroll-behavior-x:none; touch-action:pan-y; -webkit-overflow-scrolling:touch; padding:18px 18px 70px 50px; }
  .wb button{ font-family:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .wb-head{ display:flex; align-items:baseline; gap:10px; margin:0 40px 12px 0; }
  .wb-head h1{ font-family: var(--name-font); font-style:italic; font-weight:400; font-size:24px; margin:0; line-height:1.2; }
  .wb-head .sub{ font-size:10px; color: var(--ink-soft); letter-spacing:.2em; white-space:nowrap; }
  .wb-tools{ position:absolute; right:12px; top:14px; z-index:2; display:flex; gap:6px; }
  .wb-tools button{ width:32px; height:32px; display:flex; align-items:center; justify-content:center; }
  .wb-tools svg, .wb-x svg{ width:19px; height:19px; stroke: var(--ink-soft); }
  .wb-band{ font-size:10px; color: var(--ink-soft); letter-spacing:.15em; margin:4px 0 7px; }
  .wb .wb-long{ position:relative; display:block; text-align:left; font-size:12px; margin:0 0 6px; padding-left:12px; }
  .wb-long::before{ content:''; position:absolute; left:0; top:3px; bottom:3px; width:2px; border-radius:1px; background: var(--red); opacity:.55; }
  .wb-long .r{ font-family: var(--name-font); font-size:11px; color: var(--ink-soft); margin-left:8px; }
  .wb-gap{ height:10px; }
  /* 按天分开（右上角的按钮）：每段前面一条细线 + 小字，段和段之间多空一点 */
  .wb-tools button.on svg{ stroke: var(--red); }
  .wb-day{ display:flex; align-items:center; gap:8px; margin:16px 0 8px; font-size:10px; letter-spacing:.15em; color: var(--ink-soft); }
  .wb-day::after{ content:''; flex:1; height:1px; background: var(--ink-faint); opacity:.7; }
  .wb-day.late, .wb-day.today{ color: var(--red); }
  .wb-day.today::after{ background: var(--red); opacity:.45; }
  /* 今天的事：像用荧光笔淡淡涂过一道 */
  .wb-task.today .title{ display:inline; -webkit-box-decoration-break:clone; box-decoration-break:clone; background: linear-gradient(180deg, transparent 55%, rgba(214,170,60,.38) 55%, rgba(214,170,60,.38) 92%, transparent 92%); }
  .wb-task.late .date{ font-weight:600; }
  .wb-task{ position:relative; margin:0 0 11px; }
  .wb-task .date{ position:absolute; left:-48px; top:2px; width:40px; text-align:right; font-family: var(--name-font); font-size:11px; color: var(--red); white-space:nowrap; }
  .wb-task .row{ display:flex; align-items:flex-start; gap:7px; }
  .wb-task .main{ flex:1; min-width:0; text-align:left; }
  .wb-task .title{ font-size:13.5px; font-weight:600; line-height:1.4; }
  .wb-task .grp{ font-weight:400; font-size:10px; color: var(--ink-soft); letter-spacing:.05em; margin-left:6px; }
  .wb-task .meta{ font-size:10px; color: var(--ink-soft); margin-top:1px; letter-spacing:.04em; }
  .wb-task .meta b, .wb-hi{ font-weight:400; color: var(--red); }
  .wb-task.hold{ opacity:.55; }
  .wb-task.leaving .title{ text-decoration: line-through; color: var(--ink-faint); }
  .wb-task.leaving{ transition: opacity .5s .35s; opacity:0; }
  /* 打勾的小方框：点的范围比框大一圈 */
  .wb-box{ width:22px; height:22px; margin:-2px -4px -2px -5px; flex:none; display:flex; align-items:center; justify-content:center; }
  .wb-box i{ width:11px; height:11px; border:1px solid var(--ink-soft); border-radius:2px; position:relative; }
  .wb-box.on i::after{ content:"✓"; position:absolute; left:1px; top:-6px; font-size:12px; font-style:normal; color: var(--ink); }
  .wb-add{ display:block; margin:8px 0 0; font-family: var(--name-font); font-style:italic; font-size:13px; color: var(--ink-soft); }
  .wb-empty{ font-size:12px; color: var(--ink-soft); margin:8px 0; }
  .wb-fold{ position:absolute; right:0; bottom:0; width:46px; height:46px; z-index:3; pointer-events:none;
    background: linear-gradient(135deg, transparent 50%, #C9B48A 50%, #E6D7B5 100%); box-shadow:-3px -3px 6px rgba(0,0,0,.12); }
  .wb-flip{ position:absolute; right:0; bottom:0; z-index:4; padding:14px 52px 14px 16px !important; font-family: var(--name-font) !important; font-style:italic; font-size:12px; color: var(--ink-soft) !important; }
  .wb-back .wb-flip{ right:auto; left:44px; padding:14px 16px 14px 6px !important; }
  /* 署名的三种墨水 */
  .wb-who{ font-family: var(--name-font); font-style:italic; font-size:13px; }
  .wb-who.claude{ color: var(--c-claude); } .wb-who.muse{ color: var(--c-muse); } .wb-who.jes{ color: var(--c-jes); }
  .wb-ts{ font-family: var(--name-font); font-size:10px; color: var(--ink-faint); margin-left:6px; white-space:nowrap; }
  /* 背面：信 */
  .wb-letter{ margin-bottom:16px; font-size:12px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  /* 空一行分段：只留小半行的空隙，不再空出整整一行 */
  .wb-p{ display:block; margin-top:.45em; }
  .wb-letter .sig{ text-align:right; margin-top:2px; white-space:normal; }
  /* 写字的那一行（信、草稿共用） */
  .wb-pen{ position:absolute; left:50px; right:18px; bottom:12px; z-index:3; display:flex; align-items:flex-end; gap:8px;
    border-bottom:1px solid var(--ink-faint); padding:4px 0; }
  .wb-back .wb-pen{ bottom:44px; }
  .wb-pen textarea{ flex:1; min-width:0; resize:none; border:none; outline:none; background:transparent; font-family:"Noto Serif SC", serif;
    font-size:12.5px; line-height:1.55; color: var(--ink); max-height:120px; padding:0; }
  .wb-pen textarea::placeholder{ color: var(--ink-faint); }
  .wb-pen button{ font-family: var(--name-font) !important; font-style:italic; font-size:13px; color: var(--c-jes) !important; padding:2px 0 2px 6px !important; white-space:nowrap; }
  /* 一件事的那一页：另一张纸从下面盖上来 */
  .wb-page{ position:absolute; z-index:5; left:0; right:0; top: calc(50px + env(safe-area-inset-top, 0px)); bottom:0; /* 要让开 iPhone 顶上的状态栏：那一条会被系统虚化 */ padding:0 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .wb-page .wb-face{ box-shadow:0 -6px 30px rgba(0,0,0,.45); }
  .wb-x{ position:absolute; right:10px; top:12px; z-index:4; width:34px; height:34px; display:flex; align-items:center; justify-content:center; }
  .wbp-title{ display:block; width:calc(100% - 34px); border:none; outline:none; background:transparent; padding:0; margin:0 34px 10px 0;
    font-family:"Noto Serif SC", serif; font-weight:600; font-size:20px; line-height:1.35; color: var(--ink); resize:none; overflow:hidden; }
  .wbp-title::placeholder{ color: var(--ink-faint); font-weight:400; }
  .wbp-props{ font-size:11.5px; line-height:1.75; margin-bottom:8px; }
  .wbp-prop{ display:flex; align-items:baseline; gap:6px; min-height:22px; }
  .wbp-prop .k{ width:40px; flex:none; color: var(--ink-soft); font-size:10px; letter-spacing:.1em; }
  .wbp-prop .v{ flex:1; min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px; }
  .wbp-opt{ color: var(--ink-faint) !important; font-size:11.5px; }
  .wbp-opt.on{ color: var(--ink) !important; text-decoration: underline; text-decoration-thickness:1px; text-underline-offset:3px; }
  .wbp-opt.on.hi{ color: var(--red) !important; }
  .wbp-in{ flex:1; min-width:60px; border:none; border-bottom:1px dotted transparent; border-radius:0; outline:none; background:transparent; padding:0;
    font-family:"Noto Serif SC", serif; font-size:11.5px; line-height:1.6; color: var(--ink); resize:none; overflow:hidden; display:block; }
  .wbp-in, .wbp-title{ min-height:0; max-height:none; } /* 不吃聊天输入框那条 textarea 的最小/最大高度 */
  .wbp-in:focus{ border-bottom-color: var(--ink-faint); }
  .wbp-in::placeholder{ color: var(--ink-faint); }
  .wbp-when{ display:flex; align-items:center; gap:4px; font-size:11.5px; }
  .wbp-when input{ -webkit-appearance:none; appearance:none; border:none; border-bottom:1px dotted var(--ink-faint); border-radius:0; outline:none; background:transparent; color: var(--ink);
    font-family:"Noto Serif SC", serif; font-size:11.5px; padding:0; min-width:0; min-height:20px; margin-right:6px; }
  .wbp-when input::-webkit-date-and-time-value{ text-align:left; }
  .wbp-when input:disabled{ opacity:.35; }
  .wbp-when input[type=date]{ width:106px; } .wbp-when input[type=time]{ width:64px; }
  .wbp-when input:invalid, .wbp-when input.empty{ color: var(--ink-faint); }
  .wbp-sel{ border:none; outline:none; background:transparent; color: var(--ink); font-family:"Noto Serif SC", serif; font-size:11.5px; padding:0; -webkit-appearance:none; appearance:none; }
  .wbp-subs{ margin:4px 0 10px; }
  .wbp-subs .wb-task{ margin-bottom:6px; }
  .wbp-subs .wb-task .title{ font-size:12px; font-weight:400; }
  .wbp-notes{ font-size:12px; line-height:1.55; margin-top:10px; }
  .wbp-note{ margin:0 0 7px; white-space:pre-wrap; word-break:break-word; }
  .wbp-note textarea{ width:100%; border:1px dotted var(--ink-faint); background: rgba(255,250,235,.25); outline:none; resize:vertical; min-height:60px;
    font-family:"Noto Serif SC", serif; font-size:12px; line-height:1.55; color: var(--ink); padding:4px; }
  .wbp-note .acts{ display:flex; gap:14px; justify-content:flex-end; font-size:11px; margin-top:2px; }
  .wbp-note .acts button{ color: var(--ink-soft) !important; }
  /* 直接在纸上接着写：最后一段下面就是写字的地方，没有框 */
  .wbp-write{ display:flex; align-items:baseline; gap:2px; margin:0 0 7px; }
  .wbp-write textarea{ flex:1; min-width:0; min-height:0; max-height:none; border:none; outline:none; background:transparent; resize:none; overflow:hidden; padding:0;
    font-family:"Noto Serif SC", serif; font-size:12px; line-height:1.55; color: var(--ink); }
  .wbp-write textarea::placeholder{ color: var(--ink-faint); }
  .wbp-write.cont{ margin-top:-7px; } .wbp-write.cont .wb-who{ display:none; } /* 5 分钟内接着上一段写：不再署名，看起来就是同一段 */
  .wbp-tear{ display:block; margin:44px 0 0; font-size:10px; letter-spacing:.2em; color: var(--ink-faint) !important; }
  /* 分工一览 + 归档：一张小纸条 */
  .wb-card{ position:absolute; z-index:6; inset:0; background: rgba(8,5,2,.62); display:flex; align-items:flex-start; justify-content:center; padding: calc(64px + env(safe-area-inset-top, 0px)) 26px 40px; }
  .wb-card .wb-face{ position:relative; inset:auto; width:100%; max-height:100%; box-shadow:0 14px 40px rgba(0,0,0,.6); transform: rotate(-.6deg); }
  .wb-card .wb-inner{ height:auto; max-height:calc(100dvh - 150px - env(safe-area-inset-top, 0px)); padding:18px 18px 22px 22px; }
  .wb-card h3{ font-family: var(--name-font); font-style:italic; font-weight:400; font-size:15px; margin:14px 0 4px; }
  .wb-card h3:first-of-type{ margin-top:0; }
  .wb-card textarea{ width:100%; border:none; border-bottom:1px dotted var(--ink-faint); border-radius:0; -webkit-appearance:none; background:transparent; outline:none; resize:none;
    font-family:"Noto Serif SC", serif; font-size:12px; line-height:1.55; color: var(--ink); padding:0; }
  .wb-card ul{ list-style:none; padding:0; margin:4px 0 0; font-size:11.5px; line-height:1.6; }
  .wb-card li{ margin:0 0 3px; }
  .wb-card li .t{ font-weight:600; } .wb-card li .d{ color: var(--ink-soft); }
  .wb-card .arch-row{ display:flex; align-items:baseline; gap:8px; }
  .wb-card .arch-row .t{ font-weight:400; color: var(--ink-soft); text-decoration: line-through; flex:1; text-align:left; }
  .wb-card #wbTorn .arch-row .t{ text-decoration:none; color: var(--ink-faint); }
  .wb-card .arch-row button{ font-size:10px; color: var(--ink-soft) !important; white-space:nowrap; }
  .wb-lock{ font-size:12px; color: var(--ink-soft); line-height:1.7; }
  .wb-lock input{ display:block; width:100%; margin:12px 0; border:none; border-bottom:1px solid var(--ink-faint); background:transparent; outline:none; font-size:16px; padding:4px 0; color: var(--ink); }
  .wb-lock button{ font-family: var(--name-font) !important; font-style:italic; font-size:14px; color: var(--c-jes) !important; }
  .wb-err{ color: var(--red); font-size:11px; margin-top:6px; }

  /* ==================== App 里的小弹窗：在别处时，有人发来消息 ====================
     雾玻璃小卡片从顶上滑下来；点一下进他的聊天，往上一划收起，4.5 秒后自己缩回去 */
  .toast{ position:absolute; z-index:60; left:10px; right:10px; top: calc(env(safe-area-inset-top, 0px) + 8px);
    display:flex; align-items:center; gap:11px; padding:10px 14px 10px 10px; border-radius:20px; cursor:pointer;
    background: rgba(18,26,21,.72); border:1px solid var(--glass-edge); color: var(--ink);
    -webkit-backdrop-filter: blur(22px) saturate(1.2); backdrop-filter: blur(22px) saturate(1.2);
    box-shadow: 0 10px 30px rgba(0,0,0,.45); -webkit-tap-highlight-color:transparent;
    transform: translateY(calc(-100% - 30px)); opacity:0; pointer-events:none;
    transition: transform .26s cubic-bezier(.4,0,.6,1), opacity .26s; touch-action:none; }
  @media (min-width: 481px){ .toast{ left:24px; right:24px; top:22px; } }
  .toast.show{ transform:none; opacity:1; pointer-events:auto; transition: transform .5s cubic-bezier(.3,1.35,.5,1), opacity .2s; }
  .toast.dragging{ transition:none; }
  .toast img{ width:36px; height:36px; border-radius:50%; object-fit:cover; flex:none; background: var(--placeholder); }
  .toast .tx{ flex:1; min-width:0; }
  .toast .nm{ display:flex; align-items:baseline; gap:8px; font-family: var(--name-font); font-size:15px; line-height:1.2; }
  .toast .nm small{ font-family: -apple-system, sans-serif; font-size:10.5px; color: var(--ink-dim); margin-left:auto; white-space:nowrap; }
  .toast .pv{ font-size:12.5px; color: var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .toast .lamp-dot{ width:5px; height:5px; border-radius:50%; background: var(--lamp); box-shadow:0 0 8px 2px rgba(207,192,154,.5); flex:none; align-self:center; }

  /* 背面、某一页：写字的那一行占纸底下自己的一块，信/草稿只在上面滚动，不会再从输入栏底下穿过去 */
  .wb-back, .wb-page .wb-face{ display:flex; flex-direction:column; }
  .wb-back .wb-inner, .wb-page .wb-inner{ flex:1; min-height:0; height:auto; padding-bottom:16px; }
  .wb-back .wb-pen, .wb-page .wb-pen{ position:relative; left:auto; right:auto; bottom:auto; flex:none; margin:0 18px 12px 50px; }
  .wb-back .wb-flip{ position:relative; left:auto; right:auto; bottom:auto; flex:none; align-self:flex-start; margin:0 0 4px 44px; padding:6px 16px 10px 6px !important; }
  /* 大标题：往下划藏起来，往上划出来（像 Safari 的地址栏）；出来时底下带一层渐淡的纸色，不和下面的字叠 */
  .wb-front .wb-inner > .wb-head, .wb-back .wb-inner > .wb-head{ position:sticky; top:-18px; z-index:2; margin-top:-18px; margin-bottom:4px; padding:18px 40px 18px 0;
    margin-left:-8px; margin-right:-12px; padding-left:8px; /* 比字宽一点，但不盖住左边那根红线 */
    /* 底下垫的是同一张纸：按纸铺开的大小和位置算好，对得严丝合缝，看不出是另一块；底下渐渐淡掉 */
    --pw: max(100cqw, 100cqh * 600 / 947); /* paper.jpg 是 600×947，像 cover 一样铺满整张纸 */
    background: url('paper.jpg') no-repeat calc((100cqw - var(--pw)) / 2 - 42px) calc((100cqh - var(--pw) * 947 / 600) / 2) / var(--pw) auto, rgb(219,199,169);
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 62%, transparent 100%); mask-image: linear-gradient(180deg, #000 0%, #000 62%, transparent 100%);
    transition: transform .28s cubic-bezier(.2,.8,.3,1), opacity .2s; }
  .wb-front, .wb-back{ container-type:size; } /* 让上面的标题量得到整张纸有多大 */
  .wb-inner.tucked > .wb-head{ transform: translateY(-110%); opacity:0; }
</style>
</head>
<body>
<div class="img-viewer" id="imgViewer"><img id="imgViewerImg" alt=""><div class="desc-big" id="imgViewerDesc"></div></div>
<div class="phone">
  <div class="screen">
    <div class="status"><span id="clock">23:41</span><span>●●●</span></div>

    <div class="panels">
      <!-- 动态 -->
      <div class="panel" id="panel-moments">
        <div class="header"><button class="to-start" aria-label="回到封面"><svg class="ln" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20V10a6 6 0 0 1 12 0v10"/><path d="M4 20h16"/><path d="M12 4v16"/></svg></button><div class="plain-title">Moments</div><span class="to-start-pad"></span></div>
        <div class="moments-body" id="momentsBody">
          <div class="feed-compose">
            <textarea id="feedInput" placeholder="这一刻的想法……"></textarea>
            <div class="feed-pick" id="feedPick"></div>
            <input type="file" id="feedImageInput" accept="image/*" multiple style="display:none;">
            <div class="feed-actions"><button class="feed-post-btn" id="feedPostBtn">发表</button></div>
          </div>
          <div id="feedList"></div>
        </div>
        <!-- 评论框：点 💬 评论这条，点别人的评论就是回复他 -->
        <div class="feed-cbar" id="feedCbar">
          <button class="cb-x" id="feedCClose" aria-label="收起">×</button>
          <input id="feedCInput" placeholder="评论" enterkeyhint="send">
          <button class="send" id="feedCSend">发送</button>
        </div>
      </div>

      <!-- 信息 -->
      <div class="panel active" id="panel-chat">
       <!-- 联系人列表：点进去才是聊天 -->
       <div id="contactsView" style="display:flex; flex-direction:column; position:absolute; inset:0;">
        <div class="header"><button class="to-start" aria-label="回到封面"><svg class="ln" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20V10a6 6 0 0 1 12 0v10"/><path d="M4 20h16"/><path d="M12 4v16"/></svg></button><div class="plain-title">Messages</div><span class="to-start-pad"></span></div>
        <div class="contacts-list" id="contactsList"></div>
       </div>
       <!-- 资料页（群里短按头像） -->
       <div class="profile" id="profileView">
        <div class="header">
          <button class="back-btn" id="profileBackBtn" aria-label="返回">‹</button>
          <div class="who"><div class="name">资料</div></div>
        </div>
        <div class="p-body">
          <img class="p-av" id="profileAv" alt="">
          <div class="p-name" id="profileName"></div>
          <div class="p-full" id="profileFull"></div>
          <div class="p-role" id="profileRole"></div>
          <div class="p-now" id="profileNow"></div>
          <button class="p-btn" id="profileChatBtn">发消息</button>
        </div>
       </div>
       <!-- 和某个人的聊天 -->
       <div id="convView" style="display:none; flex-direction:column; position:absolute; inset:0;">
        <div class="header">
          <button class="back-btn" id="backBtn" aria-label="返回">‹</button>
          <div id="convAvatarBox" style="display:flex;"></div>
          <div class="who">
            <div class="name" id="personaName"></div>
            <div class="status-line" id="statusLine">伦敦</div>
          </div>
        </div>
        <div class="chat" id="chat"></div>
        <button class="unread-pill" id="unreadPill"><svg class="ln" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg><span id="unreadPillText"></span></button>
        <div class="reply-bar" id="replyBar" style="display:none;">
          <span class="reply-text" id="replyText"></span>
          <button id="cancelReplyBtn">×</button>
        </div>

  paddy:    { name: 'Paddy',    avatar: 'avatars/paddy.jpg', full: 'Patrick O\'Connell', role: '石匠大师', where: '英国乡下' },

const mentionsMe = (text) => /@\s*Jess/i.test(text || ''); // 群里有人 @我

try{ localStorage.removeItem('mp_moments'); }catch(e){} // 旧的日记不要了（Jes 确认过，自己有留档）

let feedReadAt = Number(localStorage.getItem('mp_feed_read') || 0);  // 朋友圈里别人的点赞、评论看到哪儿了

function safeSet(key, value){
  try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
}
const save = {
  history: (cid) => safeSet(histKey(cid), JSON.stringify(historyOf(cid))),
  contacts: () => safeSet('mp_contacts', JSON.stringify(backendContacts)),
  readAt: () => safeSet('mp_read', JSON.stringify(readAt)),
  feed: () => safeSet('mp_feed', JSON.stringify(feed)),

  memories: () => safeSet('mp_memories', JSON.stringify(memories)),
  persona: () => safeSet('mp_persona', JSON.stringify(persona)),

  // 缩略图存不下时，从最早的开始删，保证不会因为空间满了卡住
  thumbs: () => {
    const keys = Object.keys(thumbs).sort((a,b) => a - b);
    while(!safeSet('mp_thumbs', JSON.stringify(thumbs)) && keys.length){ delete thumbs[keys.shift()]; }
  },
};

// 统一的请求函数：带超时，返回内容看不懂时给出明确报错
async function api(path, { method = 'GET', body, timeout = 60000 } = {}){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try{
    const res = await fetch(backendUrl.replace(/\/$/, '') + path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      signal: controller.signal
    });
    let data;
    try{ data = await res.json(); }
    catch(_){ throw new Error('后端返回了看不懂的内容（状态码 ' + res.status + '）'); }
    if(!res.ok) throw new Error(data.error || '请求失败');
    return data;
  }catch(e){
    if(e.name === 'AbortError') throw new Error('后端太久没回应，可能刚睡醒，等一下再试');
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

async function loadPersonaFromBackend(){
  if(!backendUrl) return;
  try{
    const data = await api('/persona');
    if(data && data.system){
      persona = { name: data.name || "Alistair", system: data.system };
      save.persona();
      renderPersona();
    }
  }catch(e){ /* 拿不到就先用本地缓存 */ }
}

// 问后端现在能和谁聊天
async function loadContacts(){
  try{
    const data = await api('/contacts');
    if(data && Array.isArray(data.contacts) && data.contacts.length){
      backendContacts = {};
      data.contacts.forEach(c => { backendContacts[c.id] = c.name; });
      save.contacts();
      renderContacts();
    }
  }catch(e){ /* 拿不到就用上次的 */ }
}

// 背景：只有在「信息」里点进了某个聊天才变清楚，其他时候微微虚化（由 JS 明确贴标签，iPhone 上更可靠）

// 底栏的灯：挪到选中的 Tab 后面（animate = false 时直接到位，比如刚打开、底栏刚重新出现）
const tabLamp = document.getElementById('tabLamp');
function placeLamp(animate){
  const b = document.querySelector('.tab-btn.active');

}
placeLamp(false);
if(window.ResizeObserver) new ResizeObserver(() => placeLamp(false)).observe(document.querySelector('.tabbar')); // 屏幕变了、底栏重新出现：重新摆
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const wasActive = btn.classList.contains('active');

    if(!wasActive && panel.animate && !(reduceMotion && reduceMotion.matches)){
      panel.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 240, easing: 'cubic-bezier(.2,.8,.3,1)' });

function compressImage(dataUrl, maxSide, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => reject(new Error('这张图片读不出来，换一张试试'));
    img.src = dataUrl;
  });
}

attachBtn.addEventListener('click', () => imageInput.click());
imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const full = await compressImage(reader.result, 1280, 0.8);
      const thumb = await compressImage(reader.result, 360, 0.7);
      selectedImage = { full, thumb };
      imagePreviewThumb.src = thumb;
      imagePreviewBar.style.display = 'flex';
    }catch(e){ alert(e.message); }
  };
  reader.readAsDataURL(file);
  imageInput.value = '';
});

// 列表里的时间：今天显示几点，昨天显示"昨天"，一周内显示周几，再早显示日期
function listTime(ts){
  const d = new Date(ts), now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const DAY = 24 * 60 * 60 * 1000;
  if(ts >= startOfToday) return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if(ts >= startOfToday - DAY) return '昨天';
  if(ts >= startOfToday - 6 * DAY) return WEEKDAY_NAMES[d.getDay()];
  return (d.getMonth() + 1) + '/' + d.getDate();
}
// 头像：有照片就用照片（群也有一张合照）；群万一没有照片，就把五个人的小照片拼起来
function avatarFor(cid, size){
  const info = CONTACT_INFO[cid];
  if(info.avatar){
    const img = document.createElement('img');
    img.src = info.avatar; img.alt = '';
    img.style.width = img.style.height = size + 'px';
    return img;
  }
  const box = document.createElement('div');
  box.className = 'group-av';
  box.style.width = box.style.height = size + 'px';
  const cell = Math.floor((size - 6) / 3);
  info.members.forEach(m => {
    const img = document.createElement('img');
    img.src = CONTACT_INFO[m].avatar; img.alt = '';
    img.style.width = img.style.height = cell + 'px';
    box.appendChild(img);
  });
  return box;
}
const speakerName = (id) => (CONTACT_INFO[id] ? contactName(id) : '某人');
function previewOf(cid, m){
  if(m.photo) return (m.role === 'user' ? '我：' : (isGroup(cid) && m.speaker ? speakerName(m.speaker) + '：' : '')) + '[照片]';
  if(m.voice) return '[语音]';
  const t = (m.text || (m.hadImage ? '[图片]' : '')).replace(/\s+/g, ' ');
  if(m.role === 'user') return '我：' + t;
  const s = splitAction(cleanStamps(t)); // 列表里只显示他说的话；只有动作的才显示动作
  return (isGroup(cid) && m.speaker ? speakerName(m.speaker) + '：' : '') + (s.speech || s.action).replace(/\s+/g, ' ');
}

function renderContacts(){
  contactsListEl.innerHTML = '';
  let anyUnread = false;
  CONTACT_ORDER.forEach(cid => {
    const info = CONTACT_INFO[cid];
    const ok = canChat(cid);
    const h = historyOf(cid);
    const last = h[h.length - 1];
    const row = document.createElement('div');
    row.className = 'contact-row' + (ok ? '' : ' not-yet');
    const img = avatarFor(cid, 48);
    const main = document.createElement('div'); main.className = 'c-main';
    const top = document.createElement('div'); top.className = 'c-top';
    const name = document.createElement('div'); name.className = 'c-name' + (hasCJK(contactName(cid)) ? ' cjk' : ''); name.textContent = contactName(cid);
    const time = document.createElement('div'); time.className = 'c-time'; time.textContent = last ? listTime(last.ts) : '';
    top.appendChild(name); top.appendChild(time);
    const bottom = document.createElement('div'); bottom.className = 'c-bottom';
    const lastEl = document.createElement('div'); lastEl.className = 'c-last';
    if(!ok) lastEl.textContent = '还在工地上忙，过几天就能聊天了';
    else if(last) lastEl.textContent = previewOf(cid, last);
    else lastEl.textContent = '还没有消息';
    bottom.appendChild(lastEl);
    const n = ok ? unreadCount(cid) : 0;
    if(n){
      // 群聊像开了免打扰：只有 @我 的才让底部「信息」亮小圆点
      if(!isGroup(cid) || historyOf(cid).some(m => m.role !== 'user' && m.ts > (readAt[cid] || 0) && mentionsMe(m.text))) anyUnread = true;
      const badge = document.createElement('div'); badge.className = 'unread'; badge.textContent = n > 99 ? '99+' : n;
      bottom.appendChild(badge);
    }
    main.appendChild(top); main.appendChild(bottom);
    row.appendChild(img); row.appendChild(main);
    if(ok) row.addEventListener('click', () => openConv(cid));
    contactsListEl.appendChild(row);
  });
  chatTabDot.style.display = anyUnread ? 'block' : 'none';
  document.getElementById('spotAlis').classList.toggle('lit', anyUnread); // 封面上他那盏小灯
}

function openConv(cid){
  if(currentConv !== cid){ cancelReply(); firstShownId = null; }
  currentConv = cid;
  personaNameEl.textContent = contactName(cid);
  personaNameEl.classList.toggle('cjk', hasCJK(contactName(cid)));
  convAvatarBox.innerHTML = '';
  const av = avatarFor(cid, 40);
  av.classList.add('avatar');
  convAvatarBox.appendChild(av);
  renderStatus();

// 推门进聊天：聊天页从右边滑进来、慢慢显现，联系人列表往左退一点、淡出；返回时反过来。
// 两层都是半透明的雾玻璃，所以一边滑一边淡，免得滑到一半两层叠在一起看
const PUSH_MS = 360, PUSH_EASE = 'cubic-bezier(.32,.72,0,1)'; // 像 iOS 原生翻页：起步快，慢慢停稳
const reduceMotion = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : null;
let pushAnims = [];
const screenEl = document.querySelector('.screen');
// fromDrag：右滑返回时手指松开，从两层现在的位置接着播（剩下的路越短，播得越快）
function pushView(entering, leaving, forward, fromDrag = false, remain = 1){
  pushAnims.forEach(a => a.cancel()); // 连点、点进去马上返回：打断上一段，从这一段接着来
  pushAnims = [];
  const front = forward ? entering : leaving; // 聊天页永远在上面
  const back = forward ? leaving : entering;
  const nowF = { transform: front.style.transform || 'translateX(0)', opacity: front.style.opacity || 1 };
  const nowB = { transform: back.style.transform || 'translateX(0)', opacity: back.style.opacity || 1 };
  if(fromDrag) remain = Math.max(0, Math.min(1, (parseFloat(front.style.transform.replace(/[^\d.-]/g, '')) || 0) / (front.offsetWidth || 1)));
  [entering, leaving].forEach(el => { el.style.zIndex = ''; el.style.pointerEvents = ''; el.style.transform = ''; el.style.opacity = ''; });
  // 背景交还给 CSS：从拖到的那个模糊程度接着变到终点，和页面同时停稳
  screenEl.style.setProperty('--push-ms', PUSH_MS + 'ms');
  screenEl.classList.remove('dragging');
  screenEl.style.removeProperty('--bg-filter');
  screenEl.style.removeProperty('--bg-scale');
  entering.style.display = 'flex';
  if(!entering.animate || (reduceMotion && reduceMotion.matches)){ leaving.style.display = 'none'; return; }
  front.style.zIndex = 2; back.style.zIndex = 1;
  leaving.style.pointerEvents = 'none';
  const out = { transform: 'translateX(100%)', opacity: 0 }, inn = { transform: 'translateX(0)', opacity: 1 };
  const behind = { transform: 'translateX(-28%)', opacity: 0 };
  let ms = PUSH_MS;
  if(fromDrag) ms = Math.max(160, PUSH_MS * (forward ? remain : 1 - remain)); // 弹回：剩下的是已经拖出去的那段
  screenEl.style.setProperty('--push-ms', ms + 'ms'); // 背景变完的时间也跟这一段动画一样长
  const opt = { duration: ms, easing: PUSH_EASE };
  const a1 = front.animate(fromDrag ? [nowF, forward ? inn : out] : (forward ? [out, inn] : [inn, out]), opt);
  const a2 = back.animate(fromDrag ? [nowB, forward ? behind : inn] : (forward ? [inn, behind] : [behind, inn]), opt);
  pushAnims = [a1, a2];
  a1.onfinish = () => {
    leaving.style.display = 'none';
    [entering, leaving].forEach(el => { el.style.zIndex = ''; el.style.pointerEvents = ''; });
    pushAnims = [];
  };
}
document.getElementById('backBtn').addEventListener('click', () => closeConv());

// 从左边缘往右拖：聊天页跟着手指走，松手时拖过一半（或甩得够快）就退回联系人列表，不够就弹回来
const EDGE_PX = 28;
// 背景的样子：f = 0 是聊天里（清楚），f = 1 是联系人列表（模糊）。数值和 CSS 里 .screen / .screen.in-chat 一致
function bgLook(f){
  screenEl.style.setProperty('--bg-filter', 'blur(' + (4 * f).toFixed(2) + 'px) saturate(' + (.95 - .05 * f).toFixed(3) + ') brightness(' + (.9 - .18 * f).toFixed(3) + ')');
  screenEl.style.setProperty('--bg-scale', 'scale(' + (1 + .03 * f).toFixed(4) + ')');
}
let drag = null; // { x0, y0, mode: 'wait' | 'drag', w, lastX, lastT, v }
convView.addEventListener('touchstart', (e) => {
  if(e.touches.length !== 1 || pushAnims.length) return;
  const t = e.touches[0];
  const left = convView.getBoundingClientRect().left;
  if(t.clientX - left > EDGE_PX) return;
  drag = { x0: t.clientX, y0: t.clientY, mode: 'wait', w: convView.offsetWidth, lastX: t.clientX, lastT: e.timeStamp, v: 0 };
}, { passive: true });
convView.addEventListener('touchmove', (e) => {
  if(!drag) return;
  const t = e.touches[0];
  const dx = t.clientX - drag.x0, dy = t.clientY - drag.y0;
  if(drag.mode === 'wait'){
    if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    if(dx <= 0 || Math.abs(dy) > dx){ drag = null; return; } // 先往上下走：是在滚聊天，不管
    drag.mode = 'drag';
    cancelPress(); closeMsgMenu();
    contactsView.style.display = 'flex';
    contactsView.style.zIndex = 1; convView.style.zIndex = 2;
    screenEl.classList.add('dragging');
  }
  e.preventDefault(); // 拖的时候别让聊天上下滚
  const x = Math.max(0, dx), p = Math.min(1, x / drag.w);
  convView.style.transform = 'translateX(' + x + 'px)';
  convView.style.opacity = String(1 - p * 0.6);
  contactsView.style.transform = 'translateX(' + (-28 * (1 - p)) + '%)';
  contactsView.style.opacity = String(p);
  bgLook(p);
  const dt = e.timeStamp - drag.lastT;
  if(dt > 0){ drag.v = 0.7 * ((t.clientX - drag.lastX) / dt) + 0.3 * drag.v; drag.lastX = t.clientX; drag.lastT = e.timeStamp; }
}, { passive: false });
function endDrag(){
  if(!drag) return;
  const d = drag; drag = null;
  if(d.mode !== 'drag') return;
  const p = (parseFloat(convView.style.transform.replace(/[^\d.-]/g, '')) || 0) / d.w;
  if(p > 0.5 || d.v > 0.5) closeConv(true);                 // 拖过一半或者甩得快（每毫秒 0.5 像素以上）：返回
  else pushView(convView, contactsView, true, true);       // 不够：弹回聊天
}
convView.addEventListener('touchend', endDrag);
convView.addEventListener('touchcancel', endDrag);

// 他们发的照片：有图就画成相框（角落小字注明摄影师和图库），没图（搜不到）就画成文字照片卡片
function fillPhoto(b, p){
  const card = () => { b.className = 'bubble photo-card'; b.textContent = p.desc || '照片'; b.onclick = () => openDescViewer(p.desc || '照片'); };
  if(!p.url){ card(); return; }
  b.classList.add('photo');
  const frame = document.createElement('div');
  frame.className = 'photo-frame';
  if(p.w && p.h) frame.style.aspectRatio = String(Math.min(1.5, Math.max(0.75, p.w / p.h)));
  const img = document.createElement('img');
  img.alt = p.desc || '';
  img.loading = 'lazy';
  img.onload = () => frame.classList.add('loaded');
  img.onerror = () => { b.innerHTML = ''; card(); }; // 图打不开了，也退回成文字卡片
  img.src = p.url;
  frame.appendChild(img);
  if(p.by){
    const cr = document.createElement('div');
    cr.className = 'photo-credit';
    const site = p.site || 'Unsplash'; // 照片来自哪个图库（Unsplash 要求署名摄影师和 Unsplash，都带链接）
    const a1 = document.createElement('a'); a1.href = p.byUrl || p.page; a1.textContent = p.by;
    const a2 = document.createElement('a'); a2.href = p.siteUrl || p.page; a2.textContent = site;
    [a1, a2].forEach(a => { a.target = '_blank'; a.rel = 'noopener'; a.addEventListener('click', e => e.stopPropagation()); });
    cr.append('Photo by ', a1, ' on ', a2);
    frame.appendChild(cr);
  }
  frame.addEventListener('click', () => openImageViewer(p.full || p.url));
  b.appendChild(frame);
}

// Alis 发的语音：画成语音条，点一下播放 / 停下（同一时间只放一条）
const VOICE_ICON = '<svg class="vplay-play" viewBox="0 0 16 16"><path d="M5 3.5v9l7-4.5z"/></svg>' +
  '<svg class="vplay-pause" viewBox="0 0 16 16"><path d="M5.5 3.5v9M10.5 3.5v9"/></svg>';
let voiceNow = null; // 正在放的那条：{ b, audio }
const voiceUrl = (id) => backendUrl.replace(/\/$/, '') + '/voice/' + encodeURIComponent(id);
const fmtDur = (sec) => Math.max(1, Math.round(sec || 0)) + '″';
function voiceProgress(b, frac){
  const bars = b.querySelectorAll('.vbars i');
  bars.forEach((x, i) => x.classList.toggle('on', frac > 0 && i < Math.ceil(frac * bars.length)));
}
function stopVoice(){
  if(!voiceNow) return;
  voiceNow.audio.pause();
  voiceNow.b.classList.remove('playing');
  voiceProgress(voiceNow.b, 0);
  voiceNow = null;
}
function toggleVoice(b, v){
  if(Date.now() - menuOpenedAt < 600) return; // 刚长按弹出了菜单，这一下不算点击
  if(voiceNow && voiceNow.b === b){ stopVoice(); return; }
  stopVoice();
  const audio = new Audio(voiceUrl(v.id));
  voiceNow = { b, audio };
  b.classList.add('playing'); b.classList.remove('broken');
  const mine = () => voiceNow && voiceNow.audio === audio;
  audio.addEventListener('loadedmetadata', () => { if(isFinite(audio.duration)) b.querySelector('.vdur').textContent = fmtDur(audio.duration); });
  audio.addEventListener('timeupdate', () => { if(mine() && audio.duration) voiceProgress(b, audio.currentTime / audio.duration); });
  audio.addEventListener('ended', () => { if(mine()) stopVoice(); });
  const fail = () => { if(!mine()) return; stopVoice(); b.classList.add('broken'); b.querySelector('.vdur').textContent = '放不出来'; };
  audio.addEventListener('error', fail);
  const p = audio.play();
  if(p && p.catch) p.catch(fail);
}
function fillVoice(b, v){
  b.classList.add('voice');
  b.innerHTML = VOICE_ICON;
  const bars = document.createElement('span');
  bars.className = 'vbars';
  // 声波的高低按语音编号算出来，每条都不一样，但同一条每次打开都一样
  const n = Math.min(26, 8 + Math.round((v.dur || 5) * 0.9));
  let seed = 0; for(const c of String(v.id)) seed = (seed * 31 + c.charCodeAt(0)) >>> 0;
  for(let i = 0; i < n; i++){
    seed = (seed * 1103515245 + 12345) >>> 0;
    const bar = document.createElement('i');
    bar.style.height = (4 + (seed % 13)) + 'px';
    bars.appendChild(bar);
  }
  const dur = document.createElement('span');
  dur.className = 'vdur'; dur.textContent = fmtDur(v.dur);
  b.append(bars, dur);
  b.style.width = Math.min(220, 96 + (v.dur || 5) * 6) + 'px';
  b.style.maxWidth = '76%';
  b.addEventListener('click', () => toggleVoice(b, v));
}
// 「转文字」：英文原话（[sighs] 这种标签画成灰色斜体），下面是中文翻译
function voiceTranscript(v){
  const box = document.createElement('div');
  box.className = 'vtrans';
  const en = document.createElement('div');
  String(v.en || '').split(/(\[[^\]]*\])/).forEach(part => {
    if(!part) return;
    if(/^\[[^\]]*\]$/.test(part)){ const t = document.createElement('span'); t.className = 'vtag'; t.textContent = part; en.appendChild(t); }
    else en.appendChild(document.createTextNode(part));
  });
  box.appendChild(en);
  if(v.zh && v.zh !== v.en){ const zh = document.createElement('div'); zh.className = 'zh'; zh.textContent = v.zh; box.appendChild(zh); }
  return box;
}

function addBubble(container, role, text, imageDataUrl, opts = {}){
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'me' : 'ai');
  const b = document.createElement('div');
  b.className = 'bubble';
  if(opts.id) b.dataset.id = opts.id;
  if(opts.photo) fillPhoto(b, opts.photo);
  if(opts.voice) fillVoice(b, opts.voice);
  if(imageDataUrl){
    const img = document.createElement('img');
    img.src = imageDataUrl;
    b.appendChild(img);
  }
  if(text){
    const span = document.createElement('div');
    span.textContent = text;
    b.appendChild(span);
  }
  // 群聊里别人说的话：前面放小头像，上面写名字
  let holder = row;
  if(opts.speaker && role !== 'user'){
    row.classList.add('with-speaker');
    const av = document.createElement('img');
    av.className = 'mini-av'; av.alt = '';
    av.src = (CONTACT_INFO[opts.speaker] || {}).avatar || '';
    av.dataset.speaker = opts.speaker;
    const col = document.createElement('div'); col.className = 'col';
    const nm = document.createElement('div'); nm.className = 'speaker-name'; nm.textContent = speakerName(opts.speaker);
    col.appendChild(nm);
    row.appendChild(av); row.appendChild(col);
    holder = col;
  }
  // 动作描写：气泡上方一行灰色小字
  if(opts.action){
    if(holder === row) row.classList.add('with-stage');
    const st = document.createElement('div');
    st.className = 'stage';
    st.textContent = opts.action;
    holder.appendChild(st);
  }
  if(text || imageDataUrl || opts.photo || opts.voice) holder.appendChild(b); // 只有动作、没有说话的消息，就不画空气泡
  if(opts.reactions && opts.reactions.length && b.parentNode){
    if(holder === row) row.classList.add('stacked');
    holder.appendChild(reactsEl(opts.id, opts.reactions));
  }
  if(opts.voice){ // 语音条下面的「转文字」，默认收着
    if(holder === row) row.classList.add('stacked');
    const tg = document.createElement('div');
    tg.className = 'vtoggle'; tg.textContent = '转文字';
    let box = null;
    const toggle = () => {
      if(box){ box.remove(); box = null; tg.style.display = ''; return; }
      box = voiceTranscript(opts.voice);
      box.addEventListener('click', toggle);
      tg.after(box); tg.style.display = 'none';
    };
    tg.addEventListener('click', toggle);
    holder.appendChild(tg);
  }
  if(opts.replyTo){
    if(holder === row) row.classList.add('has-quote');
    const q = document.createElement('div');
    q.className = 'quote';
    q.textContent = snippetOf(findMsg(opts.replyTo));
    q.addEventListener('click', () => jumpToMessage(opts.replyTo));
    holder.appendChild(q);
  }
  if(opts.id) row.dataset.id = opts.id; // 只有动作、没有气泡的消息也找得到（跳到第一条新消息时用）
  if(bulkPaint) row.classList.add('settled');
  container.appendChild(row);
  if(!bulkPaint) container.scrollTop = container.scrollHeight;
  return b;
}

/* ---------- 引用 ---------- */
const replyBar = document.getElementById('replyBar');
const replyTextEl = document.getElementById('replyText');
const cancelReplyBtn = document.getElementById('cancelReplyBtn');
let replyingTo = null; // 正在引用的那条消息的 id

function findMsg(id){ return currentConv ? historyOf(currentConv).find(m => m.id === id) : null; }
function snippetOf(m){
  if(!m) return '原消息已经不在了';
  let t = (m.photo ? '[照片] ' + (m.photo.desc || '') : m.voice ? '[语音] ' + (m.voice.zh || '') : (m.text || (m.hadImage ? '[图片]' : ''))).replace(/\s+/g, ' ');
  if(m.role !== 'user' && !m.photo && !m.voice){ const s = splitAction(t); t = s.speech || s.action; } // 引用框里也只放他说的话
  return (m.role === 'user' ? '我' : (m.speaker ? speakerName(m.speaker) : contactName(currentConv))) + '：' + t;
}

// 点一下引用框，跳回原来那条消息，让它亮一下
function jumpToMessage(id){
  let el = [...chatEl.querySelectorAll('.bubble')].find(x => x.dataset.id === id);
  if(!el && currentConv){
    // 原消息太早、还没画出来：先往前补画到那条（多带几条上文）
    const h = historyOf(currentConv);
    const i = h.findIndex(m => m.id === id);
    if(i < 0) return;
    firstShownId = h[Math.max(0, i - 5)].id;
    renderChat();
    el = [...chatEl.querySelectorAll('.bubble')].find(x => x.dataset.id === id);
  }
  if(!el) return;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1200);
}

function startReply(m){
  replyingTo = m.id;
  replyTextEl.textContent = '引用 ' + snippetOf(m);
  replyBar.style.display = 'flex';
  input.focus();
}
function cancelReply(){
  replyingTo = null;
  replyBar.style.display = 'none';
}
cancelReplyBtn.addEventListener('click', cancelReply);

// 长按气泡弹出小菜单：引用 / 复制
let menuEl = null, menuOpenedAt = 0;
function closeMsgMenu(){ if(menuEl){ menuEl.remove(); menuEl = null; } }
function openMsgMenu(b){
  closeMsgMenu();
  const m = findMsg(b.dataset.id);
  if(!m) return;
  menuEl = document.createElement('div');
  menuEl.className = 'msg-menu';
  // 上面一排：表情回应（自己已经贴了的那几个亮一点，再点一下就是取消）
  const emoRow = document.createElement('div');
  emoRow.className = 'emo-row';
  const mineSet = new Set((m.reactions || []).filter(r => r.who === 'jes').map(r => r.emoji));
  QUICK_EMOJI.forEach(e => {
    const btn = document.createElement('button');
    btn.textContent = e;
    if(mineSet.has(e)) btn.classList.add('mine');
    btn.addEventListener('click', (ev) => { ev.stopPropagation(); closeMsgMenu(); reactTo(m, e); });
    emoRow.appendChild(btn);
  });
  const more = document.createElement('button');
  more.className = 'more'; more.textContent = '＋';
  more.addEventListener('click', (ev) => { ev.stopPropagation(); closeMsgMenu(); openEmojiPick(m); });
  emoRow.appendChild(more);
  menuEl.appendChild(emoRow);
  // 下面一排：引用 / 复制
  const acts = document.createElement('div');
  acts.className = 'acts';
  menuEl.appendChild(acts);
  const addItem = (label, fn) => {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.addEventListener('click', (ev) => { ev.stopPropagation(); closeMsgMenu(); fn(); });
    acts.appendChild(btn);
  };
  addItem('引用', () => startReply(m));
  const copyText = m.voice ? m.voice.en : m.text; // 语音复制的是英文原话
  if(copyText) addItem('复制', () => { if(navigator.clipboard) navigator.clipboard.writeText(copyText).catch(() => {}); });
  document.body.appendChild(menuEl);
  // 菜单放在气泡上方，上面放不下就放下方
  const r = b.getBoundingClientRect(), mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
  let top = r.top - mh - 6;
  if(top < 8) top = r.bottom + 6;
  const left = Math.max(8, Math.min(r.left + r.width / 2 - mw / 2, window.innerWidth - mw - 8));
  menuEl.style.top = top + 'px';
  menuEl.style.left = left + 'px';
  menuOpenedAt = Date.now();
}

/* ---------- 表情回应 ---------- */
const QUICK_EMOJI = ['❤️', '😂', '🥹', '😭', '🥺', '👌🏻']; // 长按菜单里那一排；想换就改这里，别的表情点 ＋ 从键盘挑

// 气泡下面那一小排表情：按贴的先后排开，点一下展开看是谁贴的
function reactsEl(id, reactions){
  const el = document.createElement('div');
  el.className = 'reacts';
  el.dataset.for = id;
  el.textContent = reactions.map(r => r.emoji).join('');
  el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const old = el.querySelector('.who');
    if(old){ old.remove(); return; }
    const w = document.createElement('span');
    w.className = 'who';
    w.textContent = reactions.map(r => (r.who === 'jes' ? '我' : speakerName(r.who)) + ' ' + r.emoji).join(' · ');
    el.appendChild(w);
  });
  return el;
}
// 某条消息的表情变了：只换掉它下面那一排，不重画整个聊天（不然会跳回最底下）
function updateReacts(m){
  const b = [...chatEl.querySelectorAll('.bubble')].find(x => x.dataset.id === m.id);
  if(!b) return;
  const holder = b.parentNode;
  const old = [...holder.querySelectorAll('.reacts')].find(x => x.dataset.for === m.id);
  if(!m.reactions || !m.reactions.length){ if(old) old.remove(); return; }
  const el = reactsEl(m.id, m.reactions);
  if(old) old.replaceWith(el);
  else{
    if(holder.classList.contains('row')) holder.classList.add('stacked');
    b.after(el);
  }
}
// 贴上 / 取消：先在手机上改好，再告诉后端；后端没接住就改回去
async function reactTo(m, emoji){
  const cid = currentConv;
  if(!cid || !backendUrl) return;
  const before = m.reactions ? m.reactions.slice() : undefined;
  const list = (m.reactions || []).slice();
  const i = list.findIndex(r => r.who === 'jes' && r.emoji === emoji);
  if(i >= 0) list.splice(i, 1); else list.push({ who: 'jes', emoji });
  m.reactions = list.length ? list : undefined;
  updateReacts(m);
  if(navigator.vibrate) navigator.vibrate(10);
  try{
    const data = await api('/react', { method: 'POST', body: { conv: cid, id: m.id, emoji } });
    m.reactions = data.message.reactions;
    save.history(cid);
  }catch(e){
    m.reactions = before;
    addNote('表情没贴上：' + e.message);
  }
  if(cid === currentConv) updateReacts(m);
}
// 点 ＋：底下弹出一个小输入框，切到表情键盘挑一个，挑到就贴上
let pickEl = null;
function closeEmojiPick(){ if(pickEl){ pickEl.remove(); pickEl = null; } }
function openEmojiPick(m){
  closeEmojiPick();
  pickEl = document.createElement('div');

  });

// 从一段文字里拿出第一个表情（👌🏻 这种带肤色的、👨‍👩‍👧 这种拼起来的都算一个）
function firstEmoji(t){
  const parts = typeof Intl !== 'undefined' && Intl.Segmenter
    ? [...new Intl.Segmenter().segment(t)].map(x => x.segment)
    : [...t];
  return parts.find(g => /\p{Extended_Pictographic}/u.test(g)) || '';
}

let pressTimer = null, pressStart = null, pressOpened = false;
let shrinkTimer = null, pressEl = null; // 长按时正在往里收的那个气泡/头像
function startShrink(el){ // 按住 0.12 秒还没动才开始收，免得只是滑聊天时气泡也跟着缩
  pressEl = el;
  shrinkTimer = setTimeout(() => el.classList.add('pressing'), 120);
}
function releaseShrink(){ clearTimeout(shrinkTimer); shrinkTimer = null; if(pressEl){ pressEl.classList.remove('pressing'); pressEl = null; } }
const cancelPress = () => { clearTimeout(pressTimer); pressTimer = null; releaseShrink(); };
/* ---------- 键盘弹出时贴合 ---------- */
// iPhone 的 Safari 弹出键盘时不会把页面变矮，只是把键盘盖上去、再把页面往上推，
// 于是底部的 Tab 栏、给 Home 条留的空位和黑色底色都露出来。
// 这里量出"现在实际看得见的区域"（visualViewport）有多高，键盘弹出时把整个 App 缩到这么高、摆回顶上。
const vv = window.visualViewport;
let fullH = vv ? Math.max(vv.height, window.innerHeight) : 0; // 没开键盘时看得见的高度
const touchPhone = window.matchMedia ? matchMedia('(pointer: coarse)').matches : false; // 只在触屏手机上收 Tab 栏
const isTyping = () => { const a = document.activeElement; return !!a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !/^(file|checkbox|radio|button|submit)$/.test(a.type))); };
function fitKeyboard(){
  if(!vv) return;
  const chatAtBottom = chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 40;
  if(!isTyping()) fullH = Math.max(vv.height, window.innerHeight);
  const typing = isTyping();
  const open = typing && fullH - vv.height > 120; // 看得见的区域少了一大截：键盘出来了
  // 收 Tab 栏和缩 App 放在同一刻（键盘真的升起来、量到高度变了才做），免得先掉一截再弹回来
  document.body.classList.toggle('kb-open', open && touchPhone);
  window.scrollTo(0, 0); // 页面被推上去的话，摆回顶上
  const root = document.documentElement.style;
  if(open){ root.setProperty('--app-h', vv.height + 'px'); root.setProperty('--app-top', Math.max(0, vv.offsetTop) + 'px'); }
  else { root.removeProperty('--app-h'); root.removeProperty('--app-top'); }
  if(chatAtBottom) chatEl.scrollTop = chatEl.scrollHeight; // 原来在看最新消息：键盘弹起后还停在最底下
  if(open) alignCommentAnchor(); // 朋友圈：正在评论的那条挪到评论框正上方
}
if(vv){
  vv.addEventListener('resize', fitKeyboard);
  // 键盘开着时 iOS 又挪了看得见的区域：等它停下来（0.15 秒没再挪）再对准一次。
  // 不紧跟着挪：键盘升起的动画里 iOS 会临时乱挪几下，紧跟着挪 App 会被推下去一瞬间（上面露出一块黑）
  let vvSettle = null;
  vv.addEventListener('scroll', () => {
    clearTimeout(vvSettle);
    vvSettle = setTimeout(() => {
      if(document.documentElement.style.getPropertyValue('--app-h')) document.documentElement.style.setProperty('--app-top', Math.max(0, vv.offsetTop) + 'px');
    }, 150);
  });
  document.addEventListener('focusin', () => { setTimeout(fitKeyboard, 50); });
  // 收起键盘：有报告说 iOS 26 收起后页面会停在被推上去的位置，所以过一会儿再摆正、再量一次
  document.addEventListener('focusout', () => { setTimeout(fitKeyboard, 50); setTimeout(fitKeyboard, 400); });
}

// 在输入框光标处插入「@名字 」
function insertMention(cid){
  const tag = '@' + contactName(cid) + ' ';
  const pos = typeof input.selectionStart === 'number' ? input.selectionStart : input.value.length;
  const before = input.value.slice(0, pos);
  const pad = before && !/\s$/.test(before) ? ' ' : ''; // 前面紧挨着字的话，先空一格
  input.value = before + pad + tag + input.value.slice(pos);
  const caret = pos + pad.length + tag.length;
  input.focus();
  input.setSelectionRange(caret, caret);
  if(navigator.vibrate) navigator.vibrate(15);
}

function addNote(text){
