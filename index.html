<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小手机">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>小手机</title>
<style>
  :root{
    --sky-top: #0B0C14; --sky-bottom: #171A2B;
    --frame: #16161C; --frame-edge: #060608;
    --lamp: #E3A15C; --lamp-dim: #B97A4A; --moon: #8892AC;
    --ink: #EDE7DA; --ink-dim: #9A9CB4;
    --bubble-ai: #23273A; --bubble-me: #3A2E28;
    --card: #1A1D2C; --card-line: rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0; background:#0A0A10;}
  body{
    height: 100dvh;
    background: radial-gradient(ellipse 900px 600px at 50% -10%, #23283f 0%, #0A0A10 55%, #050507 100%);
    display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    padding: 16px; overflow:hidden;
  }
  .phone{
    width: min(400px, 94vw); height: min(720px, 92dvh);
    background: var(--frame); border-radius: 38px; padding: 12px;
    box-shadow: 0 0 0 1px var(--frame-edge), 0 40px 80px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.04);
    display:flex; flex-direction:column; position:relative;
  }
  @media (max-width: 480px){
    body{ padding:0; }
    .phone{
      width:100vw; height:100dvh; border-radius:0; padding:0;
      padding-top: env(safe-area-inset-top, 0px);
      /* 底部安全区不在这里留了：交给下面的 tabbar 自己往下铺，避免留两遍出现一条空白 */
    }
    .screen{ border-radius:0; }
  }
  .screen{
    flex:1; border-radius:26px; overflow:hidden; display:flex; flex-direction:column; position:relative;
    background: radial-gradient(420px 260px at 30% 0%, rgba(227,161,92,.14), transparent 60%), linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
  }
  .status{ height:26px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding: 6px 20px 0; font-size:11px; color: var(--ink-dim); }

  /* ---- 顶部各tab的header ---- */
  .header{ display:flex; align-items:center; gap:12px; padding: 8px 16px 14px; border-bottom: 1px solid var(--card-line); flex-shrink:0; }
  .avatar{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background: radial-gradient(circle at 35% 30%, #F3C286, var(--lamp) 55%, var(--lamp-dim) 100%);
    box-shadow: 0 0 18px 3px rgba(227,161,92,.45);
    display:flex; align-items:center; justify-content:center; color:#20140A; font-family:"Noto Serif SC", serif; font-size:16px;
  }
  .who{flex:1; min-width:0;}
  .who .name{ font-family:"Noto Serif SC", serif; font-size:16px; color: var(--ink); }
  .who .status-line{font-size:11px; color: var(--moon); margin-top:2px;}
  .plain-title{ font-family:"Noto Serif SC", serif; font-size:17px; color: var(--ink); flex:1; }

  /* ---- 三个面板容器 ---- */
  .panels{ flex:1; min-height:0; position:relative; }
  .panel{ position:absolute; inset:0; display:none; flex-direction:column; min-height:0; }
  .panel.active{ display:flex; }

  /* ---- 信息 tab ---- */
  .chat{ flex:1; overflow-y:auto; padding: 16px 14px 8px; display:flex; flex-direction:column; gap:11px; }
  .row{ display:flex; } .row.me{ justify-content:flex-end; }
  .bubble{ max-width: 76%; padding: 10px 14px; border-radius: 15px; font-size: 13.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .row.ai .bubble{ background: var(--bubble-ai); color: var(--ink); border: 1px solid rgba(227,161,92,.18); border-top-left-radius:4px; box-shadow: 0 0 14px rgba(227,161,92,.06); }
  .row.me .bubble{ background: var(--bubble-me); color: var(--ink); border-top-right-radius:4px; }
  .bubble.typing{ color: var(--ink-dim); font-style: italic; }
  .note{ align-self:center; font-size:11.5px; color: var(--ink-dim); padding:4px 10px; text-align:center; }
  .bubble img{ max-width:100%; border-radius:10px; display:block; margin-top:6px; }
  .bubble img:first-child{ margin-top:0; }

  /* 消息出现的轻微动效 */
  .row{ animation: bubbleIn .28s ease; }
  @keyframes bubbleIn{ from{ opacity:0; transform: translateY(8px) scale(.97); } to{ opacity:1; transform: translateY(0) scale(1); } }

  /* 正在输入的跳动小点 */
  .bubble.typing-dots{ display:flex; gap:4px; align-items:center; padding:12px 16px; }
  .bubble.typing-dots .dot{ width:6px; height:6px; border-radius:50%; background: var(--ink-dim); animation: typingPulse 1.2s infinite ease-in-out; }
  .bubble.typing-dots .dot:nth-child(2){ animation-delay:.2s; }
  .bubble.typing-dots .dot:nth-child(3){ animation-delay:.4s; }
  @keyframes typingPulse{ 0%,60%,100%{ transform:scale(1); opacity:.4; } 30%{ transform:scale(1.3); opacity:1; } }

  .attach-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04); color: var(--ink-dim); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .image-preview-bar{
    display:flex; align-items:center; gap:8px; padding:8px 14px; border-top:1px solid var(--card-line);
  }
  .image-preview-bar img{ width:36px; height:36px; object-fit:cover; border-radius:8px; }
  .image-preview-bar button{
    background:transparent; border:1px solid rgba(255,255,255,.14); color: var(--ink-dim);
    border-radius:8px; width:22px; height:22px; font-size:12px; cursor:pointer;
  }
  .inputbar{ display:flex; align-items:flex-end; gap:8px; padding: 10px 12px 14px; border-top: 1px solid var(--card-line); background: linear-gradient(180deg, transparent, rgba(5,5,8,.4)); flex-shrink:0; }
  textarea{ flex:1; resize:none; border-radius:16px; border:1px solid rgba(255,255,255,.12); padding: 9px 12px; font-size:16px; font-family:inherit; color: var(--ink); background: rgba(255,255,255,.04); max-height:80px; min-height:36px; outline:none; }
  textarea::placeholder{ color: var(--ink-dim); }
  textarea:focus{ border-color: var(--lamp); }
  .send{ background: linear-gradient(135deg, #F0BA80, var(--lamp-dim)); color:#20140A; border:none; border-radius:16px; padding: 9px 16px; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0; }
  .send:disabled{ opacity:.4; }

  /* ---- 动态 tab ---- */
  .moments-body{ flex:1; overflow-y:auto; padding: 14px 14px 90px; }
  .moment-compose{
    background: var(--card); border:1px solid var(--card-line); border-radius:14px; padding:10px; margin-bottom:16px;
  }
  .moment-compose textarea{ width:100%; min-height:64px; background:transparent; border:none; color:var(--ink); font-size:14px; resize:vertical; outline:none; padding:2px; }
  .moment-compose-actions{ display:flex; justify-content:flex-end; margin-top:4px; }
  .moment-post-btn{ background: var(--lamp); color:#20140A; border:none; border-radius:10px; padding:6px 14px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .moment-post-btn:disabled{ opacity:.4; }
  .moment-card{ margin-bottom:20px; }
  .moment-date{ font-size:11px; color: var(--ink-dim); margin-bottom:6px; }
  .moment-text{ font-size:13.5px; line-height:1.7; color: var(--ink); white-space:pre-wrap; margin-bottom:10px; }
  .moment-comment{
    background: var(--bubble-ai); border:1px solid rgba(227,161,92,.18); border-radius:12px;
    padding:10px 12px; font-size:13px; line-height:1.6; color: var(--ink); position:relative;
  }
  .moment-comment::before{ content:"💬 " attr(data-name); display:block; font-size:11px; color: var(--lamp); margin-bottom:4px; font-family:"Noto Serif SC", serif; }
  .moment-comment.pending{ color: var(--ink-dim); font-style:italic; }
  .moments-empty{ color: var(--ink-dim); font-size:13px; text-align:center; margin-top:40px; }

  /* ---- 设置 tab ---- */
  .settings-body{ flex:1; overflow-y:auto; padding: 14px 14px 90px; display:flex; flex-direction:column; gap:16px; }
  .settings-section{ background: var(--card); border:1px solid var(--card-line); border-radius:14px; padding:12px; }
  .settings-section h4{ margin:0 0 8px; font-size:12px; color: var(--ink-dim); font-weight:500; letter-spacing:.03em; }
  .settings-section label{ font-size:11.5px; color: var(--ink-dim); display:block; margin-top:8px; }
  .settings-section input, .settings-section textarea{
    width:100%; border-radius:10px; border:1px solid rgba(255,255,255,.14); padding:7px 10px; font-size:16px;
    font-family:inherit; color: var(--ink); background: rgba(255,255,255,.04); margin-top:4px;
  }
  .settings-section textarea{ min-height:64px; resize:vertical; }
  .settings-save{ background: var(--lamp); color:#20140A; font-weight:600; border:none; border-radius:10px; padding:8px 16px; font-size:12.5px; cursor:pointer; margin-top:10px; }
  .memory-item{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--card-line); font-size:13px; color: var(--ink); }
  .memory-item:last-child{ border-bottom:none; }
  .memory-item span{ flex:1; }
  .memory-del{ background:transparent; border:1px solid rgba(255,255,255,.14); color: var(--ink-dim); border-radius:8px; width:22px; height:22px; font-size:12px; cursor:pointer; flex-shrink:0; }
  .memory-empty{ color: var(--ink-dim); font-size:12.5px; }

  /* ---- 底部 tab bar ---- */
  .tabbar{
    display:flex; border-top:1px solid var(--card-line); background: rgba(10,10,16,.85); backdrop-filter: blur(8px);
    flex-shrink:0; padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tab-btn{
    flex:1; background:none; border:none; padding:9px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px;
    color: var(--ink-dim); font-size:10.5px; cursor:pointer; font-family:inherit;
  }
  .tab-btn .icon{ font-size:18px; line-height:1; }
  .tab-btn.active{ color: var(--lamp); }
</style>
</head>
<body>
<div class="phone">
  <div class="screen">
    <div class="status"><span id="clock">23:41</span><span>●●●</span></div>

    <div class="panels">
      <!-- 动态 -->
      <div class="panel" id="panel-moments">
        <div class="header"><div class="plain-title">动态</div></div>
        <div class="moments-body" id="momentsBody">
          <div class="moment-compose">
            <textarea id="momentInput" placeholder="今天过得怎么样，写下来说给 Ta 听……"></textarea>
            <div class="moment-compose-actions">
              <button class="moment-post-btn" id="momentPostBtn">发布</button>
            </div>
          </div>
          <div id="momentsList"></div>
        </div>
      </div>

      <!-- 信息 -->
      <div class="panel active" id="panel-chat">
        <div class="header">
          <div class="avatar" id="avatarLetter">阿</div>
          <div class="who">
            <div class="name" id="personaName">阿澄</div>
            <div class="status-line" id="statusLine">伦敦</div>
          </div>
        </div>
        <div class="chat" id="chat"></div>
        <div class="image-preview-bar" id="imagePreviewBar" style="display:none;">
          <img id="imagePreviewThumb" alt="预览">
          <span style="flex:1; font-size:12px; color:var(--ink-dim);">已选好一张图片</span>
          <button id="removeImageBtn">×</button>
        </div>
        <div class="inputbar">
          <input type="file" id="imageInput" accept="image/*" style="display:none;">
          <button class="attach-btn" id="attachBtn" title="发图片">🖼</button>
          <textarea id="input" rows="1" placeholder="想说点什么…"></textarea>
          <button class="send" id="sendBtn">寄出</button>
        </div>
      </div>

      <!-- 设置 -->
      <div class="panel" id="panel-settings">
        <div class="header"><div class="plain-title">设置</div></div>
        <div class="settings-body">
          <div class="settings-section">
            <h4>备份日记（换浏览器/设备用）</h4>
            <textarea id="migrateArea" placeholder="聊天记录和记忆已经存在后端了，这里只备份“动态”里的日记。点“导出”会把日记填进这里；要导入就把复制来的内容粘贴进来，再点“导入”"></textarea>
            <div style="display:flex; gap:8px; margin-top:8px;">
              <button class="settings-save" id="exportBtn">导出到上面</button>
              <button class="settings-save" id="importBtn" style="background:transparent; color:var(--ink-dim); border:1px solid rgba(255,255,255,.14);">从上面导入</button>
            </div>
          </div>
          <div class="settings-section">
            <h4>连接</h4>
            <label>后端地址</label>
            <input id="backendInput" placeholder="https://xxx.onrender.com">
            <button class="settings-save" id="saveConnBtn">保存</button>
          </div>
          <div class="settings-section">
            <h4>聊天记录</h4>
            <button class="settings-save" id="clearHistoryBtn" style="background:transparent; color:var(--ink-dim); border:1px solid rgba(255,255,255,.14);">清空聊天记录</button>
          </div>
          <div class="settings-section">
            <h4>主动消息通知</h4>
            <div id="notifyStatus" style="font-size:12.5px; color:var(--ink-dim); margin-bottom:8px;">还没开启</div>
            <button class="settings-save" id="enableNotifyBtn">开启通知</button>
          </div>
          <div class="settings-section">
            <h4>Ta 记住的事</h4>
            <div id="memoryList"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="tabbar">
      <button class="tab-btn" data-tab="moments"><span class="icon">✦</span>动态</button>
      <button class="tab-btn active" data-tab="chat"><span class="icon">💬</span>信息</button>
      <button class="tab-btn" data-tab="settings"><span class="icon">⚙</span>设置</button>
    </div>
  </div>
</div>

<script>
/* ---------- 状态 ---------- */
// v2：聊天记录和记忆的"正本"都在后端数据库里，手机上只存一份副本方便离线翻看
let backendUrl = localStorage.getItem('mp_backend') || '';
let persona = JSON.parse(localStorage.getItem('mp_persona') || 'null') || { name: "Alistair", system: "" };
let localHistory = JSON.parse(localStorage.getItem('mp_history_v2') || '[]'); // [{id, role, text, hadImage, ts}]
let thumbs = JSON.parse(localStorage.getItem('mp_thumbs') || '{}');           // { 消息时间: 缩略图 }
let moments = JSON.parse(localStorage.getItem('mp_moments') || '[]');
let memories = JSON.parse(localStorage.getItem('mp_memories') || '[]');

function safeSet(key, value){
  try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
}
const save = {
  history: () => safeSet('mp_history_v2', JSON.stringify(localHistory)),
  moments: () => safeSet('mp_moments', JSON.stringify(moments)),
  memories: () => safeSet('mp_memories', JSON.stringify(memories)),
  persona: () => safeSet('mp_persona', JSON.stringify(persona)),
  backend: () => safeSet('mp_backend', backendUrl),
  // 缩略图存不下时，从最早的开始删，保证不会因为空间满了卡住
  thumbs: () => {
    const keys = Object.keys(thumbs).sort((a,b) => a - b);
    while(!safeSet('mp_thumbs', JSON.stringify(thumbs)) && keys.length){ delete thumbs[keys.shift()]; }
  },
};

// 统一的请求函数：带超时，返回内容看不懂时给出明确报错
async function api(path, { method = 'GET', body, timeout = 60000 } = {}){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try{
    const res = await fetch(backendUrl.replace(/\/$/, '') + path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      signal: controller.signal
    });
    let data;
    try{ data = await res.json(); }
    catch(_){ throw new Error('后端返回了看不懂的内容（状态码 ' + res.status + '）'); }
    if(!res.ok) throw new Error(data.error || '请求失败');
    return data;
  }catch(e){
    if(e.name === 'AbortError') throw new Error('后端太久没回应，可能刚睡醒，等一下再试');
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

async function loadPersonaFromBackend(){
  if(!backendUrl) return;
  try{
    const data = await api('/persona');
    if(data && data.system){
      persona = { name: data.name || "Alistair", system: data.system };
      save.persona();
      renderPersona();
    }
  }catch(e){ /* 拿不到就先用本地缓存 */ }
}

function fmtClock(){
  const d = new Date();
  document.getElementById('clock').textContent = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}
fmtClock(); setInterval(fmtClock, 30000);

/* ---------- Tab 切换 ---------- */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'settings') loadMemories();
  });
});

/* ---------- 信息 tab ---------- */
const chatEl = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const personaNameEl = document.getElementById('personaName');
const avatarLetterEl = document.getElementById('avatarLetter');
const statusLineEl = document.getElementById('statusLine');
const attachBtn = document.getElementById('attachBtn');
const imageInput = document.getElementById('imageInput');
const imagePreviewBar = document.getElementById('imagePreviewBar');
const imagePreviewThumb = document.getElementById('imagePreviewThumb');
const removeImageBtn = document.getElementById('removeImageBtn');
let selectedImage = null; // { full: 发给模型的压缩图, thumb: 存在手机里的小缩略图 }

function compressImage(dataUrl, maxSide, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => reject(new Error('这张图片读不出来，换一张试试'));
    img.src = dataUrl;
  });
}

attachBtn.addEventListener('click', () => imageInput.click());
imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const full = await compressImage(reader.result, 1280, 0.8);
      const thumb = await compressImage(reader.result, 360, 0.7);
      selectedImage = { full, thumb };
      imagePreviewThumb.src = thumb;
      imagePreviewBar.style.display = 'flex';
    }catch(e){ alert(e.message); }
  };
  reader.readAsDataURL(file);
  imageInput.value = '';
});
removeImageBtn.addEventListener('click', () => {
  selectedImage = null;
  imagePreviewBar.style.display = 'none';
});

function renderPersona(){
  personaNameEl.textContent = persona.name;
  avatarLetterEl.textContent = persona.name.slice(0,1);
}

const ACTIVITY_LABEL = { work: '工作中', free: '休息中', sleep: '睡着了' };
function updateStatus(status){
  if(!status) return;
  statusLineEl.textContent = '伦敦 ' + status.time + ' · ' + (ACTIVITY_LABEL[status.activity] || '');
}

function addBubble(container, role, text, imageDataUrl){
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'me' : 'ai');
  const b = document.createElement('div');
  b.className = 'bubble';
  if(imageDataUrl){
    const img = document.createElement('img');
    img.src = imageDataUrl;
    b.appendChild(img);
  }
  if(text){
    const span = document.createElement('div');
    span.textContent = text;
    b.appendChild(span);
  }
  row.appendChild(b);
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;
  return b;
}

function addNote(text){
  const row = document.createElement('div');
  row.className = 'note';
  row.textContent = text;
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
  return row;
}

function bubbleForMessage(m){
  const thumb = thumbs[m.ts];
  const text = m.text || (m.hadImage && !thumb ? '[图片]' : '');
  addBubble(chatEl, m.role, text, thumb);
}

function renderChat(){
  chatEl.innerHTML = '';
  if(localHistory.length === 0){
    emptyNote = addNote('还没有消息，跟他说点什么吧');
  }
  localHistory.forEach(bubbleForMessage);
}
let emptyNote = null;

// 去后端拉新消息
let syncing = false, sending = false;
async function syncMessages(){
  if(!backendUrl || syncing || sending) return;
  syncing = true;
  try{
    const after = localHistory.length ? localHistory[localHistory.length - 1].ts : 0;
    const data = await api('/messages?after=' + after, { timeout: 30000 });
    updateStatus(data.status);
    let added = false;
    (data.messages || []).forEach(m => {
      if(localHistory.some(x => x.id === m.id)) return;
      if(emptyNote){ emptyNote.remove(); emptyNote = null; }
      localHistory.push(m);
      bubbleForMessage(m);
      added = true;
    });
    if(added) save.history();
  }catch(e){ /* 拉不到就下次再拉 */ }
  syncing = false;
}

async function sendChat(){
  const text = input.value.trim();
  const image = selectedImage;
  if(!text && !image) return;
  if(!backendUrl){ alert('先去"设置"填后端地址'); return; }
  input.value = '';
  selectedImage = null;
  imagePreviewBar.style.display = 'none';
  sendBtn.disabled = true;
  sending = true;

  if(emptyNote){ emptyNote.remove(); emptyNote = null; }
  addBubble(chatEl, 'user', text, image ? image.thumb : null);
  try{
    const data = await api('/send', { method: 'POST', body: { text, image: image ? image.full : null }, timeout: 90000 });
    const m = data.message;
    localHistory.push(m);
    save.history();
    if(image){ thumbs[m.ts] = image.thumb; save.thumbs(); }
  }catch(e){
    addNote('这条没发出去：' + e.message);
  }finally{
    sending = false;
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', sendChat);
input.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); } });

// App 开着的时候每 15 秒看一眼有没有新消息；从后台切回来时也马上看一眼
setInterval(() => { if(document.visibilityState === 'visible') syncMessages(); }, 15000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') syncMessages(); });

/* ---------- 动态 tab（日记评论还是即时的） ---------- */
const momentInput = document.getElementById('momentInput');
const momentPostBtn = document.getElementById('momentPostBtn');
const momentsList = document.getElementById('momentsList');

function renderMoments(){
  momentsList.innerHTML = '';
  if(moments.length === 0){
    momentsList.innerHTML = '<div class="moments-empty">还没有写过日记，写第一篇试试</div>';
    return;
  }
  [...moments].reverse().forEach(m => {
    const card = document.createElement('div');
    card.className = 'moment-card';
    const dateDiv = document.createElement('div');
    dateDiv.className = 'moment-date';
    dateDiv.textContent = m.date;
    const textDiv = document.createElement('div');
    textDiv.className = 'moment-text';
    textDiv.textContent = m.text;
    const commentDiv = document.createElement('div');
    commentDiv.className = 'moment-comment' + (m.reply ? '' : ' pending');
    commentDiv.setAttribute('data-name', persona.name);
    commentDiv.textContent = m.reply || '正在写评论…';
    card.appendChild(dateDiv); card.appendChild(textDiv); card.appendChild(commentDiv);
    momentsList.appendChild(card);
  });
}

async function postMoment(){
  const text = momentInput.value.trim();
  if(!text) return;
  if(!backendUrl){ alert('先去"设置"填后端地址'); return; }
  momentInput.value = '';
  momentPostBtn.disabled = true;

  const entry = { date: new Date().toLocaleString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}), text, reply: null };
  moments.push(entry);
  save.moments();
  renderMoments();

  const memoryNote = memories.length
    ? "\n\n[你还记得关于对方的这些事，可以自然地在合适的时候体现出来，不要生硬地逐条背出来：\n" + memories.map(m => "- " + m).join("\n") + "]"
    : "";
  const diarySystem = persona.system + memoryNote + "\n\n现在对方发来的是今天一整篇日记，不是普通聊天消息。请像朋友在评论区认真留言一样，详细回应这一整天——多提到几个具体的点和细节，语气走心，不要只泛泛地说'辛苦了'这种空话。可以写长一点，3-6句话。";

  try{
    const data = await api('/chat', { method: 'POST', body: { system: diarySystem, messages: [{role:'user', content:text}], max_tokens: 500 }, timeout: 90000 });
    entry.reply = data.reply;
    save.moments();
    renderMoments();
    api('/extract-memory', { method: 'POST', body: { recentMessages: [{role:'user', content:text}, {role:'assistant', content:data.reply}] } })
      .then(d => { if(d.memories){ memories = d.memories; save.memories(); } })
      .catch(() => {});
  }catch(e){
    entry.reply = '（评论失败了：' + e.message + '）';
    save.moments();
    renderMoments();
  }finally{
    momentPostBtn.disabled = false;
  }
}
momentPostBtn.addEventListener('click', postMoment);

/* ---------- 设置 tab ---------- */
const backendInput = document.getElementById('backendInput');
const memoryListEl = document.getElementById('memoryList');

function renderMemoryList(){
  memoryListEl.innerHTML = '';
  if(memories.length === 0){
    memoryListEl.innerHTML = '<div class="memory-empty">还没有记住什么，多聊几句就会开始记录了</div>';
    return;
  }
  memories.forEach((mem, idx) => {
    const row = document.createElement('div');
    row.className = 'memory-item';
    const span = document.createElement('span');
    span.textContent = mem;
    const delBtn = document.createElement('button');
    delBtn.className = 'memory-del';
    delBtn.textContent = '×';
    delBtn.addEventListener('click', async () => {
      try{
        const data = await api('/memories/delete', { method: 'POST', body: { index: idx } });
        memories = data.memories; save.memories(); renderMemoryList();
      }catch(e){ alert('删除失败：' + e.message); }
    });
    row.appendChild(span); row.appendChild(delBtn);
    memoryListEl.appendChild(row);
  });
}

async function loadMemories(){
  renderMemoryList();
  if(!backendUrl) return;
  try{
    const data = await api('/memories');
    memories = data.memories || []; save.memories(); renderMemoryList();
  }catch(e){ /* 拿不到就先显示手机里的副本 */ }
}

document.getElementById('exportBtn').addEventListener('click', () => {
  document.getElementById('migrateArea').value = JSON.stringify({ moments });
});
document.getElementById('importBtn').addEventListener('click', () => {
  const text = document.getElementById('migrateArea').value.trim();
  if(!text){ alert('先把要导入的内容粘贴到上面的框里'); return; }
  if(!confirm('导入会覆盖这台设备上的日记，确定吗？')) return;
  try{
    const obj = JSON.parse(text);

  }catch(e){
    alert('导入失败，内容格式不对，检查一下是不是完整复制了：' + e.message);
  }
});

document.getElementById('saveConnBtn').addEventListener('click', () => {
  backendUrl = backendInput.value.trim();
  save.backend();
  loadPersonaFromBackend();
  syncMessages();
  alert('已保存');
});
document.getElementById('clearHistoryBtn').addEventListener('click', async () => {
  if(!confirm('确定要清空聊天记录吗？（"动态"和"设置"里的记忆不会受影响）')) return;
  try{
    await api('/history/clear', { method: 'POST', body: {} });
    localHistory = []; thumbs = {};
    save.history(); save.thumbs();
    renderChat();
  }catch(e){ alert('清空失败：' + e.message); }
});

/* ---------- 通知 ---------- */
const notifyStatus = document.getElementById('notifyStatus');
const enableNotifyBtn = document.getElementById('enableNotifyBtn');
let swRegistration = null;

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function checkNotifyStatus(){
  if(!('Notification' in window)){
    notifyStatus.textContent = '这个浏览器不支持通知';
    enableNotifyBtn.disabled = true;
    return;
  }
  if(Notification.permission === 'granted' && swRegistration){
    const sub = await swRegistration.pushManager.getSubscription();
    notifyStatus.textContent = sub ? '已开启 ✅' : '权限已给，但还没订阅，点一下按钮';
  } else if(Notification.permission === 'denied'){
    notifyStatus.textContent = '被拒绝了，需要去手机系统设置里手动打开通知权限';
  } else {
    notifyStatus.textContent = '还没开启';
  }
}

async function enableNotify(){
  if(!backendUrl){ alert('先在上面填好后端地址'); return; }
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    alert('这个浏览器/系统版本不支持推送通知（iOS 需要 16.4 及以上，并且是从主屏幕图标打开的"小手机"，不是 Safari 标签页里打开的）');
    return;
  }
  // iOS 第一次加载 Service Worker 时页面还没被它接管，刷新一次就好
  if(!navigator.serviceWorker.controller){
    notifyStatus.textContent = '第一次需要刷新一下，马上自动刷新…';
    location.reload();
    return;
  }
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){
      notifyStatus.textContent = '你没有允许通知权限';
      return;
    }
    if(!swRegistration) swRegistration = await navigator.serviceWorker.ready;
    const { publicKey } = await api('/vapid-public-key');
    let sub = await swRegistration.pushManager.getSubscription();
    if(!sub){
      sub = await swRegistration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });
    }
    await api('/subscribe', { method: 'POST', body: { subscription: sub } });
    notifyStatus.textContent = '已开启 ✅';
  }catch(e){
    notifyStatus.textContent = '开启失败：' + e.message;
  }
}
enableNotifyBtn.addEventListener('click', enableNotify);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg => { swRegistration = reg; checkNotifyStatus(); }).catch(()=>{});
}

/* ---------- 第一次升级到 v2：把手机里的旧聊天记录和记忆搬去后端 ---------- */
function legacyText(m){
  if(m.displayText !== undefined) return m.displayText;
  if(Array.isArray(m.content)) return m.content.filter(c => c.type === 'text').map(c => c.text).join(' ');
  return m.content || '';
}
async function migrateLegacyIfNeeded(){
  if(localStorage.getItem('mp_migrated_v2')) return;
  const legacy = JSON.parse(localStorage.getItem('mp_history') || '[]');
  if(!legacy.length){ localStorage.setItem('mp_migrated_v2', '1'); return; }
  let lastTs = 0;
  const items = legacy.map(m => {
    const ts = Math.max(Number(m.ts) || 0, lastTs + 1); lastTs = ts;
    if(m.displayImage) thumbs[ts] = m.displayImage;
    return { role: m.role, text: legacyText(m), hadImage: !!m.displayImage, ts };
  });
  await api('/import', { method: 'POST', body: { history: items, memories }, timeout: 90000 });
  save.thumbs();
  localStorage.setItem('mp_migrated_v2', '1');
}

/* ---------- 初始化 ---------- */
async function init(){
  renderPersona();
  backendInput.value = backendUrl;
  renderChat();
  renderMoments();
  renderMemoryList();
  if(!backendUrl){
    addNote('先去"设置"填一下后端地址，才能真正聊起来');
    return;
  }
  loadPersonaFromBackend();
  try{ await migrateLegacyIfNeeded(); }
  catch(e){ addNote('旧聊天记录还没搬过去（' + e.message + '），下次打开会再试'); }
  await syncMessages();
  loadMemories();
}
init();
