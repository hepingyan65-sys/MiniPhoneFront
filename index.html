<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小手机">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>小手机</title>
<style>
  :root{
    --sky-top: #0B0C14; --sky-bottom: #171A2B;
    --frame: #16161C; --frame-edge: #060608;
    --lamp: #E3A15C; --lamp-dim: #B97A4A; --moon: #8892AC;
    --ink: #EDE7DA; --ink-dim: #9A9CB4;
    --bubble-ai: #23273A; --bubble-me: #3A2E28;
    --card: #1A1D2C; --card-line: rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0; background:#0A0A10;}
  body{
    height: 100dvh;
    background: radial-gradient(ellipse 900px 600px at 50% -10%, #23283f 0%, #0A0A10 55%, #050507 100%);
    display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    padding: 16px; overflow:hidden;
  }
  .phone{
    width: min(400px, 94vw); height: min(720px, 92dvh);
    background: var(--frame); border-radius: 38px; padding: 12px;
    box-shadow: 0 0 0 1px var(--frame-edge), 0 40px 80px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.04);
    display:flex; flex-direction:column; position:relative;
  }
  @media (max-width: 480px){
    body{ padding:0; }
    .phone{
      width:100vw; height:100dvh; border-radius:0; padding:0;
      padding-top: env(safe-area-inset-top, 0px);
      /* 底部安全区不在这里留了：交给下面的 tabbar 自己往下铺，避免留两遍出现一条空白 */
    }
    .screen{ border-radius:0; }
  }
  .screen{
    flex:1; border-radius:26px; overflow:hidden; display:flex; flex-direction:column; position:relative;
    background: radial-gradient(420px 260px at 30% 0%, rgba(227,161,92,.14), transparent 60%), linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
  }
  .status{ height:26px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding: 6px 20px 0; font-size:11px; color: var(--ink-dim); }

  /* ---- 顶部各tab的header ---- */
  .header{ display:flex; align-items:center; gap:12px; padding: 8px 16px 14px; border-bottom: 1px solid var(--card-line); flex-shrink:0; }
  .avatar{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background: radial-gradient(circle at 35% 30%, #F3C286, var(--lamp) 55%, var(--lamp-dim) 100%);
    box-shadow: 0 0 18px 3px rgba(227,161,92,.45);
    display:flex; align-items:center; justify-content:center; color:#20140A; font-family:"Noto Serif SC", serif; font-size:16px;
  }
  /* 照片头像（avatars/ 文件夹里） */
  img.avatar{ object-fit:cover; background:#2A2E42; box-shadow: 0 0 14px 2px rgba(227,161,92,.28); }
  .back-btn{ background:none; border:none; color: var(--lamp); font-size:26px; line-height:1; padding:0 4px 0 0; cursor:pointer; font-family:inherit; }

  /* 联系人列表 */
  .contacts-list{ flex:1; overflow-y:auto; padding: 6px 0 20px; }
  .contact-row{ display:flex; align-items:center; gap:12px; padding:11px 16px; cursor:pointer; border-bottom:1px solid var(--card-line); }
  .contact-row:active{ background: rgba(255,255,255,.04); }
  .contact-row img{ width:48px; height:48px; border-radius:50%; object-fit:cover; flex-shrink:0; background:#2A2E42; }
  .contact-row .c-main{ flex:1; min-width:0; }
  .contact-row .c-top{ display:flex; align-items:baseline; gap:8px; }
  .contact-row .c-name{ flex:1; font-family:"Noto Serif SC", serif; font-size:15px; color: var(--ink); }
  .contact-row .c-time{ font-size:10.5px; color: var(--ink-dim); flex-shrink:0; }
  .contact-row .c-bottom{ display:flex; align-items:center; gap:8px; margin-top:3px; }
  .contact-row .c-last{ flex:1; min-width:0; font-size:12px; color: var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .unread{ min-width:17px; height:17px; border-radius:9px; background: var(--lamp); color:#20140A; font-size:10.5px; font-weight:600; display:flex; align-items:center; justify-content:center; padding:0 5px; flex-shrink:0; }
  .contact-row.not-yet{ cursor:default; opacity:.45; }
  .contact-row.not-yet:active{ background:none; }
  .tab-btn{ position:relative; }
  /* 群头像：五个人的小头像拼在一起（像微信群） */
  .group-av{ display:flex; flex-wrap:wrap-reverse; justify-content:center; align-content:center; gap:1px; padding:2px; background:#2A2E42; border-radius:50%; overflow:hidden; flex-shrink:0; }
  .group-av img{ border-radius:3px !important; object-fit:cover; background:none !important; box-shadow:none !important; }
  /* 群聊里每条消息前面的小头像和名字 */
  .row.with-speaker{ gap:8px; align-items:flex-start; }
  .row.with-speaker .mini-av{ width:30px; height:30px; border-radius:50%; object-fit:cover; flex-shrink:0; margin-top:2px; }
  .row.with-speaker .col{ display:flex; flex-direction:column; align-items:flex-start; gap:3px; max-width:76%; min-width:0; }
  .row.with-speaker .col .bubble{ max-width:100%; }
  .row.with-speaker .col .quote{ max-width:100%; }
  .speaker-name{ font-size:10.5px; color: var(--ink-dim); padding-left:2px; }
  .row.with-speaker .mini-av{ cursor:pointer; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }

  /* 资料页：群里短按头像打开 */
  .profile{ position:absolute; inset:0; z-index:40; display:none; flex-direction:column;
    background: radial-gradient(420px 300px at 50% 18%, rgba(227,161,92,.16), transparent 65%), linear-gradient(180deg, var(--sky-top), var(--sky-bottom)); }
  .profile.open{ display:flex; }
  .profile .p-body{ flex:1; display:flex; flex-direction:column; align-items:center; padding: 28px 28px 20px; gap:6px; text-align:center; }
  .profile .p-av{ width:96px; height:96px; border-radius:50%; object-fit:cover; background:#2A2E42; box-shadow: 0 0 26px 4px rgba(227,161,92,.3); margin-bottom:10px; }
  .profile .p-name{ font-family:"Noto Serif SC", serif; font-size:20px; color: var(--ink); }
  .profile .p-full{ font-size:12px; color: var(--ink-dim); letter-spacing:.3px; }
  .profile .p-role{ font-size:13px; color: var(--ink); margin-top:14px; line-height:1.7; }
  .profile .p-now{ font-size:12px; color: var(--lamp); margin-top:6px; }
  .profile .p-btn{ margin-top:auto; width:100%; padding:12px; border-radius:12px; border:1px solid rgba(227,161,92,.35); background: rgba(227,161,92,.12); color: var(--ink); font-size:14px; font-family:inherit; cursor:pointer; }
  .profile .p-btn:disabled{ opacity:.4; }
  .tab-dot{ position:absolute; top:6px; left:calc(50% + 8px); width:8px; height:8px; border-radius:50%; background: var(--lamp); display:none; }

  .who{flex:1; min-width:0;}
  .who .name{ font-family:"Noto Serif SC", serif; font-size:16px; color: var(--ink); }
  .who .status-line{font-size:11px; color: var(--moon); margin-top:2px;}
  .plain-title{ font-family:"Noto Serif SC", serif; font-size:17px; color: var(--ink); flex:1; }

  /* ---- 三个面板容器 ---- */
  .panels{ flex:1; min-height:0; position:relative; }
  .panel{ position:absolute; inset:0; display:none; flex-direction:column; min-height:0; }
  .panel.active{ display:flex; }

  /* ---- 信息 tab ---- */
  .chat{ flex:1; overflow-y:auto; padding: 16px 14px 8px; display:flex; flex-direction:column; gap:11px; }
  .row{ display:flex; } .row.me{ justify-content:flex-end; }
  .bubble{ max-width: 76%; padding: 10px 14px; border-radius: 15px; font-size: 13.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .row.ai .bubble{ background: var(--bubble-ai); color: var(--ink); border: 1px solid rgba(227,161,92,.18); border-top-left-radius:4px; box-shadow: 0 0 14px rgba(227,161,92,.06); }
  .row.me .bubble{ background: var(--bubble-me); color: var(--ink); border-top-right-radius:4px; }
  .bubble.typing{ color: var(--ink-dim); font-style: italic; }
  .note{ align-self:center; font-size:11.5px; color: var(--ink-dim); padding:4px 10px; text-align:center; }
  .note.time-note{ font-size:11px; opacity:.7; padding:2px 10px; letter-spacing:.3px; }
  .bubble img{ max-width:100%; border-radius:10px; display:block; margin-top:6px; }
  .bubble img:first-child{ margin-top:0; }

  /* 引用：长按气泡弹出菜单，引用的原文显示在气泡下面的灰色小框里（像微信） */
  .bubble{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  .bubble.flash{ box-shadow: 0 0 0 2px var(--lamp) !important; transition: box-shadow .3s; }
  .row.has-quote{ flex-direction:column; align-items:flex-start; gap:4px; }
  .row.me.has-quote{ align-items:flex-end; }
  .quote{
    max-width:76%; font-size:11.5px; line-height:1.5; color: var(--ink-dim);
    background: rgba(255,255,255,.05); border-radius:8px; padding:5px 9px; cursor:pointer;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-word;
  }
  .msg-menu{
    position:fixed; z-index:50; display:flex; gap:2px; padding:4px;
    background:#2A2E42; border:1px solid var(--card-line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  .msg-menu button{ background:transparent; border:none; color: var(--ink); font-size:13px; font-family:inherit; padding:7px 14px; border-radius:7px; cursor:pointer; }
  .msg-menu button:active{ background: rgba(255,255,255,.08); }
  .reply-bar{ display:flex; align-items:center; gap:8px; padding:8px 14px; border-top:1px solid var(--card-line); }
  .reply-bar .reply-text{ flex:1; min-width:0; font-size:12px; color: var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .reply-bar button{
    background:transparent; border:1px solid rgba(255,255,255,.14); color: var(--ink-dim);
    border-radius:8px; width:22px; height:22px; font-size:12px; cursor:pointer; flex-shrink:0;
  }

  /* 消息出现的轻微动效 */
  .row{ animation: bubbleIn .28s ease; }
  @keyframes bubbleIn{ from{ opacity:0; transform: translateY(8px) scale(.97); } to{ opacity:1; transform: translateY(0) scale(1); } }

  /* 正在输入的跳动小点 */
  .bubble.typing-dots{ display:flex; gap:4px; align-items:center; padding:12px 16px; }
  .bubble.typing-dots .dot{ width:6px; height:6px; border-radius:50%; background: var(--ink-dim); animation: typingPulse 1.2s infinite ease-in-out; }
  .bubble.typing-dots .dot:nth-child(2){ animation-delay:.2s; }
  .bubble.typing-dots .dot:nth-child(3){ animation-delay:.4s; }
  @keyframes typingPulse{ 0%,60%,100%{ transform:scale(1); opacity:.4; } 30%{ transform:scale(1.3); opacity:1; } }

  .attach-btn{
    width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04); color: var(--ink-dim); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .image-preview-bar{
    display:flex; align-items:center; gap:8px; padding:8px 14px; border-top:1px solid var(--card-line);
  }
  .image-preview-bar img{ width:36px; height:36px; object-fit:cover; border-radius:8px; }
  .image-preview-bar button{
    background:transparent; border:1px solid rgba(255,255,255,.14); color: var(--ink-dim);
    border-radius:8px; width:22px; height:22px; font-size:12px; cursor:pointer;
  }
  .inputbar{ display:flex; align-items:flex-end; gap:8px; padding: 10px 12px 14px; border-top: 1px solid var(--card-line); background: linear-gradient(180deg, transparent, rgba(5,5,8,.4)); flex-shrink:0; }
  textarea{ flex:1; resize:none; border-radius:16px; border:1px solid rgba(255,255,255,.12); padding: 9px 12px; font-size:16px; font-family:inherit; color: var(--ink); background: rgba(255,255,255,.04); max-height:80px; min-height:36px; outline:none; }
  textarea::placeholder{ color: var(--ink-dim); }
  textarea:focus{ border-color: var(--lamp); }
  .send{ background: linear-gradient(135deg, #F0BA80, var(--lamp-dim)); color:#20140A; border:none; border-radius:16px; padding: 9px 16px; font-size:13px; font-weight:600; cursor:pointer; flex-shrink:0; }
  .send:disabled{ opacity:.4; }

  /* ---- 动态 tab（朋友圈） ---- */
  .moments-body{ flex:1; overflow-y:auto; padding: 14px 14px 90px; }
  .feed-compose{ background: var(--card); border:1px solid var(--card-line); border-radius:14px; padding:10px; margin-bottom:18px; }
  .feed-compose textarea{ width:100%; min-height:52px; background:transparent; border:none; color:var(--ink); font-size:14px; resize:vertical; outline:none; padding:2px; font-family:inherit; }
  .feed-pick{ display:grid; grid-template-columns: repeat(5, 1fr); gap:6px; margin-top:6px; }
  .feed-pick .pk{ position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; background:#2A2E42; }
  .feed-pick .pk img{ width:100%; height:100%; object-fit:cover; display:block; }
  .feed-pick .pk button{ position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; border:none; background:rgba(0,0,0,.6); color:#fff; font-size:11px; line-height:18px; padding:0; cursor:pointer; }
  .feed-pick .pk-add{ aspect-ratio:1; border-radius:8px; border:1px dashed rgba(255,255,255,.2); background:transparent; color: var(--ink-dim); font-size:20px; cursor:pointer; }
  .feed-actions{ display:flex; justify-content:flex-end; margin-top:8px; }
  .feed-post-btn{ background: var(--lamp); color:#20140A; border:none; border-radius:10px; padding:6px 14px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .feed-post-btn:disabled{ opacity:.4; }
  .post{ display:flex; gap:10px; padding:14px 0; border-bottom:1px solid var(--card-line); }
  .post .p-avatar{ width:40px; height:40px; border-radius:8px; flex-shrink:0; object-fit:cover; }
  .post .p-main{ flex:1; min-width:0; }
  .post .p-author{ font-size:13.5px; color: var(--lamp); font-family:"Noto Serif SC", serif; margin-bottom:3px; }
  .post .p-text{ font-size:13.5px; line-height:1.65; color: var(--ink); white-space:pre-wrap; word-break:break-word; }
  .post .p-imgs{ display:grid; grid-template-columns: repeat(3, 1fr); gap:4px; margin-top:7px; max-width:250px; }
  .post .p-imgs.one{ grid-template-columns: 1fr; max-width:190px; }
  .post .p-imgs img{ width:100%; aspect-ratio:1; object-fit:cover; border-radius:4px; display:block; background:#2A2E42; cursor:pointer; }
  .post .p-imgs.one img{ aspect-ratio:auto; max-height:240px; }
  .post .p-desc{ aspect-ratio:1; border-radius:4px; padding:7px; box-sizing:border-box; cursor:pointer; overflow:hidden;
    background: linear-gradient(160deg, rgba(227,161,92,.18), rgba(136,146,172,.12)); border:1px solid rgba(227,161,92,.2);
    font-size:10.5px; line-height:1.45; color: var(--ink); display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; word-break:break-word; }
  .post .p-desc::before{ content:"📷 "; }
  .post .p-imgs.one .p-desc{ aspect-ratio:4/3; font-size:12px; -webkit-line-clamp:7; padding:10px; }
  .post .p-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:7px; }
  .post .p-time{ font-size:11px; color: var(--ink-dim); }
  .post .p-like-btn{ background:transparent; border:none; color: var(--ink-dim); font-size:15px; padding:0 4px; cursor:pointer; font-family:inherit; }
  .post .p-like-btn.on{ color: var(--lamp); }
  .post .p-react{ margin-top:7px; background: rgba(255,255,255,.04); border-radius:6px; font-size:12.5px; line-height:1.6; }
  .post .p-likes{ padding:5px 9px; color: var(--lamp); }
  .post .p-likes + .p-comments{ border-top:1px solid var(--card-line); }
  .post .p-comments{ padding:4px 9px; }
  .post .p-comment{ color: var(--ink); padding:1px 0; word-break:break-word; }
  .post .p-comment b{ color: var(--lamp); font-weight:normal; }
  .post .p-comment i{ font-style:normal; color: var(--ink-dim); }
  .moments-empty{ color: var(--ink-dim); font-size:13px; text-align:center; margin-top:40px; line-height:1.8; }
  .img-viewer{ position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; }
  .img-viewer.open{ display:flex; }
  .img-viewer img{ max-width:100%; max-height:100%; object-fit:contain; }
  .img-viewer .desc-big{ display:none; max-width:300px; padding:22px; border-radius:12px; font-size:15px; line-height:1.8; color: var(--ink);
    background: linear-gradient(160deg, rgba(227,161,92,.22), rgba(136,146,172,.14)); border:1px solid rgba(227,161,92,.3); }

  /* ---- 设置 tab ---- */
  .settings-body{ flex:1; overflow-y:auto; padding: 14px 14px 90px; display:flex; flex-direction:column; gap:16px; }
  .settings-section{ background: var(--card); border:1px solid var(--card-line); border-radius:14px; padding:12px; }
  .settings-section h4{ margin:0 0 8px; font-size:12px; color: var(--ink-dim); font-weight:500; letter-spacing:.03em; }
  .settings-section label{ font-size:11.5px; color: var(--ink-dim); display:block; margin-top:8px; }
  .settings-section input, .settings-section textarea{
    width:100%; border-radius:10px; border:1px solid rgba(255,255,255,.14); padding:7px 10px; font-size:16px;
    font-family:inherit; color: var(--ink); background: rgba(255,255,255,.04); margin-top:4px;
  }
  .settings-section textarea{ min-height:64px; resize:vertical; }
  .settings-save{ background: var(--lamp); color:#20140A; font-weight:600; border:none; border-radius:10px; padding:8px 16px; font-size:12.5px; cursor:pointer; margin-top:10px; }
  .memory-item{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--card-line); font-size:13px; color: var(--ink); }
  .memory-item:last-child{ border-bottom:none; }
  .memory-item span{ flex:1; }
  .memory-del{ background:transparent; border:1px solid rgba(255,255,255,.14); color: var(--ink-dim); border-radius:8px; width:22px; height:22px; font-size:12px; cursor:pointer; flex-shrink:0; }
  .memory-empty{ color: var(--ink-dim); font-size:12.5px; }

  /* ---- 底部 tab bar ---- */
  .tabbar{
    display:flex; border-top:1px solid var(--card-line); background: rgba(10,10,16,.85); backdrop-filter: blur(8px);
    flex-shrink:0; padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tab-btn{
    flex:1; background:none; border:none; padding:9px 4px 8px; display:flex; flex-direction:column; align-items:center; gap:3px;
    color: var(--ink-dim); font-size:10.5px; cursor:pointer; font-family:inherit;
  }
  .tab-btn .icon{ font-size:18px; line-height:1; }
  .tab-btn.active{ color: var(--lamp); }
</style>
</head>
<body>
<div class="img-viewer" id="imgViewer"><img id="imgViewerImg" alt=""><div class="desc-big" id="imgViewerDesc"></div></div>
<div class="phone">
  <div class="screen">
    <div class="status"><span id="clock">23:41</span><span>●●●</span></div>

    <div class="panels">
      <!-- 动态 -->
      <div class="panel" id="panel-moments">
        <div class="header"><div class="plain-title">朋友圈</div></div>
        <div class="moments-body" id="momentsBody">
          <div class="feed-compose">
            <textarea id="feedInput" placeholder="这一刻的想法……"></textarea>
            <div class="feed-pick" id="feedPick"></div>
            <input type="file" id="feedImageInput" accept="image/*" multiple style="display:none;">
            <div class="feed-actions"><button class="feed-post-btn" id="feedPostBtn">发表</button></div>
          </div>
          <div id="feedList"></div>
        </div>
      </div>

      <!-- 信息 -->
      <div class="panel active" id="panel-chat">
       <!-- 联系人列表：点进去才是聊天 -->
       <div id="contactsView" style="display:flex; flex-direction:column; flex:1; min-height:0;">
        <div class="header"><div class="plain-title">信息</div></div>
        <div class="contacts-list" id="contactsList"></div>
       </div>
       <!-- 资料页（群里短按头像） -->
       <div class="profile" id="profileView">
        <div class="header">
          <button class="back-btn" id="profileBackBtn" aria-label="返回">‹</button>
          <div class="who"><div class="name">资料</div></div>
        </div>
        <div class="p-body">
          <img class="p-av" id="profileAv" alt="">
          <div class="p-name" id="profileName"></div>
          <div class="p-full" id="profileFull"></div>
          <div class="p-role" id="profileRole"></div>
          <div class="p-now" id="profileNow"></div>
          <button class="p-btn" id="profileChatBtn">发消息</button>
        </div>
       </div>
       <!-- 和某个人的聊天 -->
       <div id="convView" style="display:none; flex-direction:column; flex:1; min-height:0;">
        <div class="header">
          <button class="back-btn" id="backBtn" aria-label="返回">‹</button>
          <div id="convAvatarBox" style="display:flex;"></div>
          <div class="who">

<script>
/* ---------- 状态 ---------- */
// v2：聊天记录和记忆的"正本"都在后端数据库里，手机上只存一份副本方便离线翻看
let backendUrl = localStorage.getItem('mp_backend') || '';
let persona = JSON.parse(localStorage.getItem('mp_persona') || 'null') || { name: "Alistair", system: "" };
// 联系人：头像照片在 avatars/ 文件夹。后端 /contacts 里登记了的人才能聊天，其他人先在列表里显示成灰色
const CONTACT_INFO = {
  alistair: { name: 'Alistair', avatar: 'avatars/alistair.jpg', full: 'Alistair Whitmore', role: '古建筑修复事务所', where: '伦敦' },
  crew:     { name: '工地上的老伙计们', avatar: 'avatars/crew.jpg', group: true, members: ['alistair', 'tom', 'ollie', 'nell', 'paddy'] },
  tom:      { name: 'Tom',      avatar: 'avatars/tom.jpg',   full: 'Thomas Bennett',   role: '结构工程师', where: '伦敦' },
  ollie:    { name: 'Ollie',    avatar: 'avatars/ollie.jpg', full: 'Oliver Hayes',     role: '建筑师 · 柯基 Milo 的主人', where: '伦敦' },
  nell:     { name: 'Nell',     avatar: 'avatars/nell.jpg',  full: 'Eleanor Price',    role: '项目经理', where: '伦敦' },
  paddy:    { name: 'Paddy',    avatar: 'avatars/paddy.jpg', full: 'Patrick O\'Connell', role: '石匠大师', where: '英国乡下' },
};
const CONTACT_ORDER = ['alistair', 'crew', 'tom', 'ollie', 'nell', 'paddy'];
const isGroup = (cid) => !!(CONTACT_INFO[cid] && CONTACT_INFO[cid].group);
const mentionsMe = (text) => /@\s*Jess/i.test(text || ''); // 群里有人 @我
let backendContacts = JSON.parse(localStorage.getItem('mp_contacts') || 'null') || { alistair: 'Alistair' }; // { id: 名字 }
let readAt = JSON.parse(localStorage.getItem('mp_read') || '{}'); // { id: 看过的最后一条消息的时间 }，用来算未读
let currentConv = null; // 正在看的对话；null 表示在联系人列表

// 每个对话一份聊天记录副本。Alistair 的还用原来的 mp_history_v2，旧数据原样保留
const histKey = (cid) => cid === 'alistair' ? 'mp_history_v2' : 'mp_history_' + cid;
const histories = {};
function historyOf(cid){
  if(!histories[cid]) histories[cid] = JSON.parse(localStorage.getItem(histKey(cid)) || '[]'); // [{id, role, text, hadImage, ts, replyTo}]
  return histories[cid];
}
function contactName(cid){
  if(cid === 'alistair') return persona.name;
  return backendContacts[cid] || (CONTACT_INFO[cid] || {}).name || cid;
}
let thumbs = JSON.parse(localStorage.getItem('mp_thumbs') || '{}');           // { 消息时间: 缩略图 }
try{ localStorage.removeItem('mp_moments'); }catch(e){} // 旧的日记不要了（Jes 确认过，自己有留档）
let feed = JSON.parse(localStorage.getItem('mp_feed') || '[]');       // 朋友圈的副本（正本在后端，照片不存手机）
let feedReadAt = Number(localStorage.getItem('mp_feed_read') || 0);  // 朋友圈里别人的点赞、评论看到哪儿了
let memories = JSON.parse(localStorage.getItem('mp_memories') || '[]');

function safeSet(key, value){
  try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
}
const save = {
  history: (cid) => safeSet(histKey(cid), JSON.stringify(historyOf(cid))),
  contacts: () => safeSet('mp_contacts', JSON.stringify(backendContacts)),
  readAt: () => safeSet('mp_read', JSON.stringify(readAt)),
  feed: () => safeSet('mp_feed', JSON.stringify(feed)),
  feedRead: () => safeSet('mp_feed_read', String(feedReadAt)),
  memories: () => safeSet('mp_memories', JSON.stringify(memories)),
  persona: () => safeSet('mp_persona', JSON.stringify(persona)),
  backend: () => safeSet('mp_backend', backendUrl),
  // 缩略图存不下时，从最早的开始删，保证不会因为空间满了卡住
  thumbs: () => {
    const keys = Object.keys(thumbs).sort((a,b) => a - b);
    while(!safeSet('mp_thumbs', JSON.stringify(thumbs)) && keys.length){ delete thumbs[keys.shift()]; }
  },
};

// 统一的请求函数：带超时，返回内容看不懂时给出明确报错
async function api(path, { method = 'GET', body, timeout = 60000 } = {}){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try{
    const res = await fetch(backendUrl.replace(/\/$/, '') + path, {
      method,
      headers: body ? { "Content-Type": "application/json" } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      signal: controller.signal
    });
    let data;
    try{ data = await res.json(); }
    catch(_){ throw new Error('后端返回了看不懂的内容（状态码 ' + res.status + '）'); }
    if(!res.ok) throw new Error(data.error || '请求失败');
    return data;
  }catch(e){
    if(e.name === 'AbortError') throw new Error('后端太久没回应，可能刚睡醒，等一下再试');
    throw e;
  }finally{
    clearTimeout(timer);
  }
}

async function loadPersonaFromBackend(){
  if(!backendUrl) return;
  try{
    const data = await api('/persona');
    if(data && data.system){
      persona = { name: data.name || "Alistair", system: data.system };
      save.persona();
      renderPersona();
    }
  }catch(e){ /* 拿不到就先用本地缓存 */ }
}

// 问后端现在能和谁聊天
async function loadContacts(){
  try{
    const data = await api('/contacts');
    if(data && Array.isArray(data.contacts) && data.contacts.length){
      backendContacts = {};
      data.contacts.forEach(c => { backendContacts[c.id] = c.name; });
      save.contacts();
      renderContacts();
    }
  }catch(e){ /* 拿不到就用上次的 */ }
}

const chatEl = document.getElementById('chat');
const input = document.getElementById('input');

const statusLineEl = document.getElementById('statusLine');
const attachBtn = document.getElementById('attachBtn');
const imageInput = document.getElementById('imageInput');
const imagePreviewBar = document.getElementById('imagePreviewBar');
const imagePreviewThumb = document.getElementById('imagePreviewThumb');
const removeImageBtn = document.getElementById('removeImageBtn');
let selectedImage = null; // { full: 发给模型的压缩图, thumb: 存在手机里的小缩略图 }

function compressImage(dataUrl, maxSide, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => reject(new Error('这张图片读不出来，换一张试试'));
    img.src = dataUrl;
  });
}

attachBtn.addEventListener('click', () => imageInput.click());
imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const full = await compressImage(reader.result, 1280, 0.8);
      const thumb = await compressImage(reader.result, 360, 0.7);
      selectedImage = { full, thumb };
      imagePreviewThumb.src = thumb;
      imagePreviewBar.style.display = 'flex';
    }catch(e){ alert(e.message); }
  };
  reader.readAsDataURL(file);
  imageInput.value = '';
});

  selectedImage = null;
  imagePreviewBar.style.display = 'none';
});

function renderPersona(){
  if(currentConv) personaNameEl.textContent = contactName(currentConv);
  renderContacts();
}

const ACTIVITY_LABEL = { work: '工作中', free: '休息中', sleep: '睡着了' };
const statuses = {};   // 每个对话最近一次拿到的状态
const liveUntil = {};  // 每个对话"他在线、要看得勤一点"到什么时候
function renderStatus(){
  const status = currentConv && statuses[currentConv];
  if(!status){ statusLineEl.textContent = '伦敦'; return; }
  if(status.group){
    statusLineEl.textContent = '伦敦 ' + status.time + ' · ' + (status.awake ? status.awake + ' 人醒着' : '大家都睡了');
    return;
  }
  const label = status.online ? '在线' : (ACTIVITY_LABEL[status.activity] || '');
  statusLineEl.textContent = '伦敦 ' + status.time + ' · ' + label;
}
function updateStatus(cid, status){
  if(!status) return;
  statuses[cid] = status;
  // 他在线的时候前端看得勤一点，免得他回了你半天才看到
  if(status.online) liveUntil[cid] = Date.now() + 3 * 60 * 1000;
  if(cid === currentConv) renderStatus();
}

/* ---------- 联系人列表 ---------- */
const canChat = (cid) => !!backendContacts[cid];
function unreadCount(cid){
  const after = readAt[cid] || 0;
  return historyOf(cid).filter(m => m.role !== 'user' && m.ts > after).length;
}
// 正在看这个对话的时候，把它标成已读
function markRead(cid){
  const h = historyOf(cid);
  const last = h.length ? h[h.length - 1].ts : 0;
  if(last && readAt[cid] !== last){ readAt[cid] = last; save.readAt(); }
}
function isViewing(cid){
  return cid === currentConv && document.visibilityState === 'visible'
    && document.getElementById('panel-chat').classList.contains('active');
}
// 列表里的时间：今天显示几点，昨天显示"昨天"，一周内显示周几，再早显示日期
function listTime(ts){
  const d = new Date(ts), now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const DAY = 24 * 60 * 60 * 1000;
  if(ts >= startOfToday) return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if(ts >= startOfToday - DAY) return '昨天';
  if(ts >= startOfToday - 6 * DAY) return WEEKDAY_NAMES[d.getDay()];
  return (d.getMonth() + 1) + '/' + d.getDate();
}
// 头像：有照片就用照片（群也有一张合照）；群万一没有照片，就把五个人的小照片拼起来
function avatarFor(cid, size){
  const info = CONTACT_INFO[cid];
  if(info.avatar){
    const img = document.createElement('img');
    img.src = info.avatar; img.alt = '';
    img.style.width = img.style.height = size + 'px';
    return img;
  }
  const box = document.createElement('div');
  box.className = 'group-av';
  box.style.width = box.style.height = size + 'px';
  const cell = Math.floor((size - 6) / 3);
  info.members.forEach(m => {
    const img = document.createElement('img');
    img.src = CONTACT_INFO[m].avatar; img.alt = '';
    img.style.width = img.style.height = cell + 'px';
    box.appendChild(img);
  });
  return box;
}
const speakerName = (id) => (CONTACT_INFO[id] ? contactName(id) : '某人');
function previewOf(cid, m){
  const t = (m.text || (m.hadImage ? '[图片]' : '')).replace(/\s+/g, ' ');
  if(m.role === 'user') return '我：' + t;
  return (isGroup(cid) && m.speaker ? speakerName(m.speaker) + '：' : '') + cleanStamps(t).replace(/\s+/g, ' ');
}

function renderContacts(){
  contactsListEl.innerHTML = '';
  let anyUnread = false;
  CONTACT_ORDER.forEach(cid => {
    const info = CONTACT_INFO[cid];
    const ok = canChat(cid);
    const h = historyOf(cid);
    const last = h[h.length - 1];
    const row = document.createElement('div');
    row.className = 'contact-row' + (ok ? '' : ' not-yet');
    const img = avatarFor(cid, 48);
    const main = document.createElement('div'); main.className = 'c-main';
    const top = document.createElement('div'); top.className = 'c-top';
    const name = document.createElement('div'); name.className = 'c-name'; name.textContent = contactName(cid);
    const time = document.createElement('div'); time.className = 'c-time'; time.textContent = last ? listTime(last.ts) : '';
    top.appendChild(name); top.appendChild(time);
    const bottom = document.createElement('div'); bottom.className = 'c-bottom';
    const lastEl = document.createElement('div'); lastEl.className = 'c-last';
    if(!ok) lastEl.textContent = '还在工地上忙，过几天就能聊天了';
    else if(last) lastEl.textContent = previewOf(cid, last);
    else lastEl.textContent = '还没有消息';
    bottom.appendChild(lastEl);
    const n = ok ? unreadCount(cid) : 0;
    if(n){
      // 群聊像开了免打扰：只有 @我 的才让底部「信息」亮小圆点
      if(!isGroup(cid) || historyOf(cid).some(m => m.role !== 'user' && m.ts > (readAt[cid] || 0) && mentionsMe(m.text))) anyUnread = true;
      const badge = document.createElement('div'); badge.className = 'unread'; badge.textContent = n > 99 ? '99+' : n;
      bottom.appendChild(badge);
    }
    main.appendChild(top); main.appendChild(bottom);
    row.appendChild(img); row.appendChild(main);
    if(ok) row.addEventListener('click', () => openConv(cid));
    contactsListEl.appendChild(row);
  });
  chatTabDot.style.display = anyUnread ? 'block' : 'none';
}

function openConv(cid){
  if(currentConv !== cid){ cancelReply(); }
  currentConv = cid;
  personaNameEl.textContent = contactName(cid);
  convAvatarBox.innerHTML = '';
  const av = avatarFor(cid, 40);
  av.classList.add('avatar');
  convAvatarBox.appendChild(av);
  renderStatus();
  contactsView.style.display = 'none';
  convView.style.display = 'flex';
  renderChat();
  markRead(cid);
  renderContacts();
  syncMessages(cid);
}
function closeConv(){
  if(!currentConv) return;
  closeMsgMenu();
  currentConv = null;
  convView.style.display = 'none';
  contactsView.style.display = 'flex';
  renderContacts();
}

function addBubble(container, role, text, imageDataUrl, opts = {}){
  const row = document.createElement('div');
  row.className = 'row ' + (role === 'user' ? 'me' : 'ai');
  const b = document.createElement('div');
  b.className = 'bubble';
  if(opts.id) b.dataset.id = opts.id;
  if(imageDataUrl){
    const img = document.createElement('img');
    img.src = imageDataUrl;
    b.appendChild(img);
  }
  if(text){
    const span = document.createElement('div');
    span.textContent = text;
    b.appendChild(span);
  }
  // 群聊里别人说的话：前面放小头像，上面写名字
  let holder = row;
  if(opts.speaker && role !== 'user'){
    row.classList.add('with-speaker');
    const av = document.createElement('img');
    av.className = 'mini-av'; av.alt = '';
    av.src = (CONTACT_INFO[opts.speaker] || {}).avatar || '';
    av.dataset.speaker = opts.speaker;
    const col = document.createElement('div'); col.className = 'col';
    const nm = document.createElement('div'); nm.className = 'speaker-name'; nm.textContent = speakerName(opts.speaker);
    col.appendChild(nm);
    row.appendChild(av); row.appendChild(col);
    holder = col;
  }
  holder.appendChild(b);
  if(opts.replyTo){
    if(holder === row) row.classList.add('has-quote');
    const q = document.createElement('div');
    q.className = 'quote';
    q.textContent = snippetOf(findMsg(opts.replyTo));
    q.addEventListener('click', () => jumpToMessage(opts.replyTo));
    holder.appendChild(q);
  }
  container.appendChild(row);
  container.scrollTop = container.scrollHeight;
  return b;
}

/* ---------- 引用 ---------- */
const replyBar = document.getElementById('replyBar');
const replyTextEl = document.getElementById('replyText');
const cancelReplyBtn = document.getElementById('cancelReplyBtn');
let replyingTo = null; // 正在引用的那条消息的 id

function findMsg(id){ return currentConv ? historyOf(currentConv).find(m => m.id === id) : null; }
function snippetOf(m){
  if(!m) return '原消息已经不在了';
  const t = (m.text || (m.hadImage ? '[图片]' : '')).replace(/\s+/g, ' ');
  return (m.role === 'user' ? '我' : (m.speaker ? speakerName(m.speaker) : contactName(currentConv))) + '：' + t;
}

// 点一下引用框，跳回原来那条消息，让它亮一下
function jumpToMessage(id){
  const el = [...chatEl.querySelectorAll('.bubble')].find(x => x.dataset.id === id);
  if(!el) return;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1200);
}

function startReply(m){
  replyingTo = m.id;
  replyTextEl.textContent = '引用 ' + snippetOf(m);
  replyBar.style.display = 'flex';
  input.focus();
}
function cancelReply(){
  replyingTo = null;
  replyBar.style.display = 'none';
}
cancelReplyBtn.addEventListener('click', cancelReply);

// 长按气泡弹出小菜单：引用 / 复制
let menuEl = null, menuOpenedAt = 0;
function closeMsgMenu(){ if(menuEl){ menuEl.remove(); menuEl = null; } }
function openMsgMenu(b){
  closeMsgMenu();
  const m = findMsg(b.dataset.id);
  if(!m) return;
  menuEl = document.createElement('div');
  menuEl.className = 'msg-menu';
  const addItem = (label, fn) => {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.addEventListener('click', (ev) => { ev.stopPropagation(); closeMsgMenu(); fn(); });
    menuEl.appendChild(btn);
  };
  addItem('引用', () => startReply(m));
  if(m.text) addItem('复制', () => { if(navigator.clipboard) navigator.clipboard.writeText(m.text).catch(() => {}); });
  document.body.appendChild(menuEl);
  // 菜单放在气泡上方，上面放不下就放下方
  const r = b.getBoundingClientRect(), mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
  let top = r.top - mh - 6;
  if(top < 8) top = r.bottom + 6;
  const left = Math.max(8, Math.min(r.left + r.width / 2 - mw / 2, window.innerWidth - mw - 8));
  menuEl.style.top = top + 'px';
  menuEl.style.left = left + 'px';
  menuOpenedAt = Date.now();
}

let pressTimer = null, pressStart = null, pressOpened = false;
const cancelPress = () => { clearTimeout(pressTimer); pressTimer = null; };
chatEl.addEventListener('touchstart', (e) => {
  // 群里长按头像：@ 他
  const av = e.target.closest('.mini-av');
  if(av && av.dataset.speaker){
    const t = e.touches[0];
    pressStart = { x: t.clientX, y: t.clientY };
    pressOpened = false;
    pressTimer = setTimeout(() => { pressTimer = null; pressOpened = true; insertMention(av.dataset.speaker); }, 450);
    return;
  }
  const b = e.target.closest('.bubble');
  if(!b || !b.dataset.id) return;
  const t = e.touches[0];
  pressStart = { x: t.clientX, y: t.clientY };
  pressOpened = false;
  pressTimer = setTimeout(() => { pressTimer = null; pressOpened = true; openMsgMenu(b); }, 450);
}, { passive: true });
// 长按弹出菜单后松手：拦下松手带出来的那次"点击"，不然按得久一点菜单会刚弹出就被关掉
chatEl.addEventListener('touchend', (e) => { if(pressOpened){ e.preventDefault(); pressOpened = false; } });
chatEl.addEventListener('touchmove', (e) => {
  if(!pressTimer) return;
  const t = e.touches[0];
  if(Math.abs(t.clientX - pressStart.x) > 10 || Math.abs(t.clientY - pressStart.y) > 10) cancelPress(); // 手指动了就是在滑，不算长按
}, { passive: true });

chatEl.addEventListener('touchcancel', cancelPress);

// 在输入框光标处插入「@名字 」
function insertMention(cid){
  const tag = '@' + contactName(cid) + ' ';
  const pos = typeof input.selectionStart === 'number' ? input.selectionStart : input.value.length;
  const before = input.value.slice(0, pos);
  const pad = before && !/\s$/.test(before) ? ' ' : ''; // 前面紧挨着字的话，先空一格
  input.value = before + pad + tag + input.value.slice(pos);
  const caret = pos + pad.length + tag.length;
  input.focus();
  input.setSelectionRange(caret, caret);
  if(navigator.vibrate) navigator.vibrate(15);
}

function addNote(text){
  const row = document.createElement('div');
  row.className = 'note';

  chatEl.appendChild(row);

  return row;

// ---- 消息时间：像微信一样，隔了 5 分钟以上才插一行时间（用手机本地时间） ----
const TIME_GAP = 5 * 60 * 1000;
const WEEKDAY_NAMES = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
let lastShownTs = 0; // 上一条显示出来的消息的时间

function formatMsgTime(ts){
  const d = new Date(ts), now = new Date();
  const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const DAY = 24 * 60 * 60 * 1000;
  if(ts >= startOfToday) return hm;
  if(ts >= startOfToday - DAY) return '昨天 ' + hm;
  if(ts >= startOfToday - 6 * DAY) return WEEKDAY_NAMES[d.getDay()] + ' ' + hm;
  const md = (d.getMonth() + 1) + '月' + d.getDate() + '日 ';
  if(d.getFullYear() === now.getFullYear()) return md + hm;
  return d.getFullYear() + '年' + md + hm;
}

function maybeTimeDivider(ts){
  if(!ts) return;
  if(ts - lastShownTs >= TIME_GAP){
    const note = addNote(formatMsgTime(ts));
    note.classList.add('time-note');
  }
  lastShownTs = ts;
}

// 以前有几条消息里夹着后端的时间标记（"[你那边 11月5日 …]"），手机里存的副本还留着，显示时擦掉
const cleanStamps = (t) => String(t || '').replace(/\s*\[(?:她|你)那边[^\]]*\]\s*/g, '\n\n').replace(/\n{3,}/g, '\n\n').trim();
function bubbleForMessage(m){
  maybeTimeDivider(m.ts);
  const thumb = thumbs[m.ts];
  const text = (m.role === 'user' ? m.text : cleanStamps(m.text)) || (m.hadImage && !thumb ? '[图片]' : '');
  addBubble(chatEl, m.role, text, thumb, { id: m.id, replyTo: m.replyTo, speaker: m.speaker });
}

function renderChat(){
  chatEl.innerHTML = '';
  emptyNote = null;
  lastShownTs = 0;
  if(!currentConv) return;
  const h = historyOf(currentConv);
  if(h.length === 0){
    emptyNote = addNote(isGroup(currentConv) ? '群里还没有消息，等他们聊起来吧' : '还没有消息，跟' + contactName(currentConv) + '说点什么吧');
  }
  h.forEach(bubbleForMessage);
}
let emptyNote = null;

// 去后端拉某个对话的新消息
const syncing = {}, lastSyncAt = {};
let sendingConv = null; // 正在发消息的对话（发的时候先不拉这个对话，免得重复）
async function syncMessages(cid){
  if(!backendUrl || !canChat(cid) || syncing[cid] || sendingConv === cid) return;
  syncing[cid] = true;
  lastSyncAt[cid] = Date.now();
  try{
    const h = historyOf(cid);
    const after = h.length ? h[h.length - 1].ts : 0;
    const data = await api('/messages?conv=' + encodeURIComponent(cid) + '&after=' + after, { timeout: 30000 });
    updateStatus(cid, data.status);
    let added = false;
    (data.messages || []).forEach(m => {
      if(h.some(x => x.id === m.id)) return;
      h.push(m);
      if(cid === currentConv){
        if(emptyNote){ emptyNote.remove(); emptyNote = null; }
        bubbleForMessage(m);
      }
      added = true;
    });
    if(added){
      save.history(cid);
      if(isViewing(cid)) markRead(cid);
      renderContacts();
    }
  }catch(e){ /* 拉不到就下次再拉 */ }
  syncing[cid] = false;
}

async function sendChat(){
  const text = input.value.trim();
  const image = selectedImage;
  if(!text && !image) return;
  if(!backendUrl){ alert('先去"设置"填后端地址'); return; }
  const cid = currentConv;
  if(!cid) return;
  const replyTo = replyingTo;
  input.value = '';
  selectedImage = null;
  imagePreviewBar.style.display = 'none';
  cancelReply();
  sendBtn.disabled = true;
  sendingConv = cid;

  if(emptyNote){ emptyNote.remove(); emptyNote = null; }
  maybeTimeDivider(Date.now());
  const bubble = addBubble(chatEl, 'user', text, image ? image.thumb : null, { replyTo });
  try{
    const data = await api('/send', { method: 'POST', body: { conv: cid, text, image: image ? image.full : null, replyTo }, timeout: 90000 });
    const m = data.message;
    bubble.dataset.id = m.id; // 发出去拿到编号以后，这条也能被长按引用了
    historyOf(cid).push(m);
    save.history(cid);
    markRead(cid);
    if(image){ thumbs[m.ts] = image.thumb; save.thumbs(); }
  }catch(e){
    if(cid === currentConv) addNote('这条没发出去：' + e.message);
    else alert('发给' + contactName(cid) + '的那条没发出去：' + e.message);
  }finally{
    sendingConv = null;
    sendBtn.disabled = false;
  }
}

  if(d < 86400000) return Math.floor(d / 3600000) + '小时前';
  const t = new Date(ts);
  return (t.getMonth() + 1) + '月' + t.getDate() + '日 ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
}

function renderFeed(){

    foot.appendChild(time);

      const lb = document.createElement('button'); lb.className = 'p-like-btn' + (liked ? ' on' : ''); lb.textContent = liked ? '♥' : '♡';
      lb.title = liked ? '取消赞' : '赞';
      lb.addEventListener('click', () => toggleLike(p.id, lb));

    main.appendChild(foot);
    const likes = p.likes || [], comments = p.comments || [];
    if(likes.length || comments.length){
      const box = document.createElement('div'); box.className = 'p-react';
      if(likes.length){

          cs.appendChild(row);
        });

      }
      main.appendChild(box);
    }
    card.appendChild(av); card.appendChild(main);
    feedListEl.appendChild(card);
  });
}

/* ---------- 通知 ---------- */
const notifyStatus = document.getElementById('notifyStatus');
const enableNotifyBtn = document.getElementById('enableNotifyBtn');
let swRegistration = null;

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function checkNotifyStatus(){
  if(!('Notification' in window)){
    notifyStatus.textContent = '这个浏览器不支持通知';
    enableNotifyBtn.disabled = true;
    return;
  }
  if(Notification.permission === 'granted' && swRegistration){
    const sub = await swRegistration.pushManager.getSubscription();
    notifyStatus.textContent = sub ? '已开启 ✅' : '权限已给，但还没订阅，点一下按钮';
  } else if(Notification.permission === 'denied'){
    notifyStatus.textContent = '被拒绝了，需要去手机系统设置里手动打开通知权限';
  } else {
    notifyStatus.textContent = '还没开启';
  }
}

async function enableNotify(){
  if(!backendUrl){ alert('先在上面填好后端地址'); return; }
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    alert('这个浏览器/系统版本不支持推送通知（iOS 需要 16.4 及以上，并且是从主屏幕图标打开的"小手机"，不是 Safari 标签页里打开的）');
    return;
  }
  // iOS 第一次加载 Service Worker 时页面还没被它接管，刷新一次就好
  if(!navigator.serviceWorker.controller){
    notifyStatus.textContent = '第一次需要刷新一下，马上自动刷新…';
    location.reload();
    return;
  }
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){
      notifyStatus.textContent = '你没有允许通知权限';
      return;
    }
    if(!swRegistration) swRegistration = await navigator.serviceWorker.ready;
    const { publicKey } = await api('/vapid-public-key');
    let sub = await swRegistration.pushManager.getSubscription();
    if(!sub){
      sub = await swRegistration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });
    }
    await api('/subscribe', { method: 'POST', body: { subscription: sub } });
    notifyStatus.textContent = '已开启 ✅';
  }catch(e){
    notifyStatus.textContent = '开启失败：' + e.message;
  }
}
enableNotifyBtn.addEventListener('click', enableNotify);

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg => { swRegistration = reg; checkNotifyStatus(); }).catch(()=>{});
}

/* ---------- 第一次升级到 v2：把手机里的旧聊天记录和记忆搬去后端 ---------- */
function legacyText(m){
  if(m.displayText !== undefined) return m.displayText;
  if(Array.isArray(m.content)) return m.content.filter(c => c.type === 'text').map(c => c.text).join(' ');
  return m.content || '';
}
async function migrateLegacyIfNeeded(){
  if(localStorage.getItem('mp_migrated_v2')) return;
  const legacy = JSON.parse(localStorage.getItem('mp_history') || '[]');
  if(!legacy.length){ localStorage.setItem('mp_migrated_v2', '1'); return; }
  let lastTs = 0;
  const items = legacy.map(m => {
    const ts = Math.max(Number(m.ts) || 0, lastTs + 1); lastTs = ts;
    if(m.displayImage) thumbs[ts] = m.displayImage;
    return { role: m.role, text: legacyText(m), hadImage: !!m.displayImage, ts };
  });
  await api('/import', { method: 'POST', body: { history: items, memories }, timeout: 90000 });
  save.thumbs();
  localStorage.setItem('mp_migrated_v2', '1');
}

/* ---------- 初始化 ---------- */
async function init(){
  // 第一次用上联系人列表：以前的消息都算看过了，不然会冒出几十条"未读"
  CONTACT_ORDER.forEach(cid => {
    if(readAt[cid] !== undefined) return;
    const h = historyOf(cid);
    readAt[cid] = h.length ? h[h.length - 1].ts : 0;
  });
  save.readAt();
  renderPersona();
  backendInput.value = backendUrl;
  renderContacts();
  renderFeedPick();
  renderFeed();
  updateFeedDot();
  renderMemoryList();
  if(!backendUrl){
    alert('先去"设置"填一下后端地址，才能真正聊起来');
    return;
  }
  loadPersonaFromBackend();
  loadContacts();
  try{ await migrateLegacyIfNeeded(); }
  catch(e){ alert('旧聊天记录还没搬过去（' + e.message + '），下次打开会再试'); }
  await Promise.all(chatIds().map(syncMessages));
  syncFeed();
  loadMemories();
}
init();
</script>
